contract: inventory
description: "Tracks on-hand, reserved and available stock of products per warehouse location, and lets order, purchasing and warehouse systems receive, reserve, release, ship and adjust that stock."
promises:
  P01:
    promise: "A SKU is 3 to 32 characters of uppercase letters A-Z, digits 0-9 and hyphens, and never starts or ends with a hyphen."
    status: declared
    by: [stock.field.sku]
  P02:
    promise: "A location code has the form WAREHOUSE-ZONE-BIN, where the warehouse is 3 uppercase letters, the zone is 1 uppercase letter and the bin is 4 digits (for example \"AMS-B-0142\")."
    status: declared
    by: [stock.field.location]
  P03:
    promise: "Every quantity in a request or answer is a whole number of units; quantities in receive, reserve, release and ship requests are between 1 and 100000 inclusive."
    status: declared
    by: [stock.field.quantity, stock.entity.line, stock.field.on_hand, stock.field.reserved, stock.field.available, adjustment.field.delta, event.field.quantity_changed]
  P04:
    promise: "Every stock level reported for a SKU at a location carries on-hand, reserved and available counts, where reserved and available are each at least 0 and available always equals on-hand minus reserved."
    status: declared
    by: [stock.entity.stock_level, stock.field.reserved, stock.field.available, stock.invariant.available_is_on_hand_minus_reserved]
  P05:
    promise: "An adjustment carries a signed non-zero quantity delta between -100000 and 100000 and a reason code that is one of DAMAGED, LOST, FOUND, CYCLE_COUNT or CORRECTION."
    status: declared
    by: [adjustment.entity.adjustment, adjustment.field.delta, adjustment.field.reason]
  P06:
    promise: "A reservation request names an order id and has 1 to 100 lines, each with a SKU, a location and a quantity of at least 1, and no SKU-location pair appears twice in the same request."
    status: declared
    by: [reservation.entity.reserve_request, reservation.field.order_id, stock.entity.line, stock.field.sku, stock.field.location, stock.field.quantity]
  # The six operations are the ones offered to callers. ExpireReservation is a seventh operation of the manifest, but only the shell's own clock (caller role clock) may call it, so no caller is offered it; its request also carries the idempotency key.
  P07:
    promise: "The service offers exactly these operations - GetStock, ReceiveGoods, ReserveStock, ReleaseReservation, ShipReservation and AdjustStock - and each write request must carry a caller-chosen idempotency key of 8 to 64 characters."
    status: declared
    by: [stock.operation.get_stock, receipt.operation.receive_goods, reservation.operation.reserve_stock, reservation.operation.release_reservation, reservation.operation.ship_reservation, adjustment.operation.adjust_stock, request.field.idempotency_key]
  # Stated and checked: the answer lines equal the request lines both ways (ensures, all/any), RESERVED with a reservation id, a refusal gives no commit statement (nothing changes), and each listed short line is a request line with its requested quantity and requested > available (refuses). Not stated: that every short line is listed - available stock is not stored or read, so no rule can name the lines that are short.
  P08:
    promise: "ReserveStock is all-or-nothing - it either reserves every line in full and answers RESERVED with a reservation id, or reserves nothing and answers INSUFFICIENT_STOCK listing each short line with its requested and available quantity."
    status: workaround
    by: [reservation.operation.reserve_stock, reservation.field.result, reservation.field.reservation_id, stock.error.insufficient_stock, stock.entity.short_line]
    hole: A2
  # Seven codes are declared errors, each with a message. FORBIDDEN is not: who may call is outside the manifest. A rejection at the boundary is not the error INVALID_REQUEST; the shell maps it.
  P09:
    promise: "Every refusal answer carries exactly one error code from INVALID_REQUEST, UNKNOWN_SKU, UNKNOWN_LOCATION, INSUFFICIENT_STOCK, RESERVATION_NOT_FOUND, INVALID_STATE, FORBIDDEN or IDEMPOTENCY_CONFLICT, plus a human-readable message."
    status: workaround
    by: [request.error.invalid_request, stock.error.unknown_sku, stock.error.unknown_location, stock.error.insufficient_stock, reservation.error.reservation_not_found, reservation.error.invalid_state, request.error.idempotency_conflict]
    hole: D2
  # The answer has lines of the same shape. That they are the requested lines, one for one, is a rule between the request and the answer.
  P10:
    promise: "A successful ReserveStock answer contains one line per requested line, with the same SKU, location and quantity as requested."
    status: workaround
    by: [reservation.entity.reservation, stock.entity.line]
    hole: A2
  # Shipping in full (no lines) or per line, and the refusal invalid_request, are declared. The bound "not more than still reserved on the line" depends on the stored reservation and lives in the core.
  P11:
    promise: "ShipReservation ships either the whole reservation or a stated quantity per line that is never more than the quantity still reserved on that line, and a larger quantity is refused with INVALID_REQUEST."
    status: workaround
    by: [reservation.entity.ship_request, stock.entity.line, request.error.invalid_request]
    hole: A2
  # The refusal insufficient_stock is declared. Its condition needs the stored counts, and "changes nothing" is not stated.
  P12:
    promise: "An adjustment with a negative delta that would make on-hand fall below the quantity currently reserved is refused with INSUFFICIENT_STOCK and changes nothing."
    status: workaround
    by: [adjustment.operation.adjust_stock, stock.error.insufficient_stock]
    hole: A2
  P13:
    promise: "A reservation id is unique across the service and is never reused, and at most one open reservation exists per order id."
    status: not-declarable
    hole: C1
  P14:
    promise: "A reservation is in one of the states ACTIVE, PARTIALLY_SHIPPED, SHIPPED, RELEASED or EXPIRED, may move only from ACTIVE to PARTIALLY_SHIPPED, SHIPPED, RELEASED or EXPIRED and from PARTIALLY_SHIPPED to SHIPPED or RELEASED, and SHIPPED, RELEASED and EXPIRED are final."
    status: declared
    by: [reservation.field.state, reservation.error.invalid_state, reservation.operation.release_reservation, reservation.operation.ship_reservation, reservation.operation.expire_reservation]
  # Declared: each write operation (ReceiveGoods, ReserveStock, ReleaseReservation, ShipReservation, AdjustStock, and the clock's ExpireReservation, whose request also carries the key) has idempotency with key input.idempotency_key, window 24 hours and otherwise request.error.idempotency_conflict. The contract uses the Postgres extra, so the schema has the table "idempotency"."inventory" and the store file has runOnce: a repeat with the same key and body in the window returns the first answer and runs nothing (no change, no event), another body gets idempotency_conflict, a refusal is not stored. The core keeps no keys. The scenarios of each write operation show the repeat at once and 1 ms before 24 hours (the first answer, no event), another body at both times (idempotency_conflict, no event), the key free at 24 hours with the same and another body, and, for receive, reserve and adjust, a refusal that does not keep the key.
  # The key has no owner (no scope): the promise names none, so the key is one per operation for all callers. "Without changing stock again" holds because the repeat does not run the core and emits no event; the shell must call runOnce in the transaction of the change.
  P15:
    promise: "A write request repeated with the same idempotency key and the same body within 24 hours returns the original answer without changing stock again, and the same key with a different body is refused with IDEMPOTENCY_CONFLICT."
    status: declared
    by: [request.field.idempotency_key, request.error.idempotency_conflict, receipt.operation.receive_goods, reservation.operation.reserve_stock, reservation.operation.release_reservation, reservation.operation.ship_reservation, reservation.operation.expire_reservation, adjustment.operation.adjust_stock]
  # The expiry is declared: ReserveStock ensures output.expires_at = now + 30 minutes when the request has no time-to-live, and now + input.ttl_minutes minutes when it has one (1 to 10080 minutes, a field limit); ExpireReservation changes the reservation from ACTIVE only to EXPIRED (a partly shipped, shipped or released one answers invalid_state) with due: now >= current.expires_at, so the runtime refuses a call before the expiry time as not due; only the shell's clock (caller role clock) may call it; the reservation is a table, so the store file has selectReservationExpireReservationDue(now, limit), from the same rule. The scenarios show the default, each time-to-live bound, the expiry at the exact time and later, not due 1 ms before, and each other state refused.
  # "Its stock becomes available again" is not stated. The stock levels are other records, which the manifest does not store or load: the answer is the reservation's state, and ReservationExpired (one per line in the core) is emits of zero or more with values not tied to the change, as for ReleaseReservation (P18). A change to other records in a timed change is outside the clock plan (E3).
  P16:
    promise: "An ACTIVE reservation that is neither shipped nor released expires 30 minutes after creation unless the request set a time-to-live between 1 minute and 7 days, and its stock becomes available again."
    status: workaround
    by: [reservation.field.ttl_minutes, reservation.field.expires_at, reservation.operation.reserve_stock, reservation.operation.expire_reservation, reservation.event.reservation_expired, access.field.role]
    hole: E3
  # The two timestamps are occurred_at (in every event) and expires_at (in the answers about a reservation); no request has one. Each is a timestamp with precision: 3: UTC with a trailing Z and exactly 3 digits after the second. The generated schema refuses another form in an answer or an event (a ContractViolation), and the scenarios check the 3-digit values of both.
  P17:
    promise: "All timestamps in requests, answers and events are UTC in ISO 8601 format with a trailing \"Z\" and millisecond precision."
    status: declared
    by: [event.field.occurred_at, reservation.field.expires_at]
  # The six events and their fields are declared: an event id (from the shell), the SKU, the location, the quantity changed, the stock level and a time. AdjustStock counts its event: exactly one stock_adjusted on each success. The rest is not stated:
  # - ReceiveGoods, ReserveStock and ShipReservation change several SKU-locations, one event per line; ReleaseReservation and ExpireReservation (the shell's clock) give back each line of the reservation. A count { event } is one per success, so "one event per changed line" cannot be stated, and these keep emits of zero or more.
  # - The values are not tied to the change: an ensures with event. needs exactly one event per success, and AdjustStock also emits StockDepleted when the count drops to 0 (P20), so it cannot read the event; the other operations have one event per line.
  # - The time of the change is a value of the core, not of a clock (E2).
  P18:
    promise: "For every successful change to stock the service publishes exactly one event of type StockReceived, StockReserved, ReservationReleased, ReservationExpired, StockShipped or StockAdjusted, carrying an event id, the SKU, the location, the quantity changed, the new on-hand and available counts and the time of the change."
    status: workaround
    by: [stock.event.stock_received, reservation.event.stock_reserved, reservation.event.reservation_released, reservation.event.reservation_expired, reservation.event.stock_shipped, adjustment.event.stock_adjusted, adjustment.operation.adjust_stock, event.field.event_id, stock.field.sku, stock.field.location, event.field.quantity_changed, stock.entity.stock_level, event.field.occurred_at]
    hole: D4
  # Each of the seven events has delivery { id: event_id, orderBy: [sku, location], sequence: sequence }, and the contract uses the Postgres extra. The shell gives the id (newEventId); the outbox keeps the event from the transaction of the change until markPublished (at least once, a re-send has the same id), refuses a second row with an id (primary key), and fills the sequence 1, 2, ... per SKU and location in the order the events were written. The transport is the user's.
  P19:
    promise: "Events are delivered at least once, may be duplicated but carry the same event id when they are, and events for the same SKU and location arrive in the order the changes happened, each with a per-SKU-location sequence number that increases by 1."
    status: declared
    by: [stock.event.stock_received, reservation.event.stock_reserved, reservation.event.reservation_released, reservation.event.reservation_expired, reservation.event.stock_shipped, adjustment.event.stock_adjusted, stock.event.stock_depleted, event.field.event_id, event.field.sequence, stock.field.sku, stock.field.location]
  # AdjustStock states it: exactly one StockDepleted when output.available = 0, and none otherwise (emits { event, when }). ReserveStock does not: it reserves several lines, so it needs one StockDepleted for each line whose count drops to 0, which a count of one per success cannot state, and its answer does not carry the available counts for a when rule.
  P20:
    promise: "Whenever the available count for a SKU at a location drops to 0 the service publishes a StockDepleted event for that SKU and location."
    status: workaround
    by: [stock.event.stock_depleted, reservation.operation.reserve_stock, adjustment.operation.adjust_stock]
    hole: A2
  # The header names the caller access.entity.caller, with a role: order_system, purchasing_system, warehouse_staff, warehouse_supervisor or clock (authentication is the shell's; a caller that is absent or does not parse is a ContractViolation). Each operation states its callers, checked by the generated runtime before the record's state, requires and the handler: ReserveStock, ReleaseReservation and ShipReservation allow caller.role = 'order_system'; ReceiveGoods allows caller.role = 'warehouse_staff' or caller.role = 'purchasing_system'; AdjustStock allows caller.role = 'warehouse_supervisor'; ExpireReservation, which the promise does not name, allows only caller.role = 'clock', the shell's own clock; each refuses any other caller with access.error.forbidden (FORBIDDEN), filled with the role. GetStock has allow: any; its otherwise is never answered. Warehouse supervisors are a role of their own, apart from warehouse staff, as the promise names them. The clock is a role too: it may call GetStock as any caller, and is refused by the five other operations. The scenarios show each role allowed and every other role refused, also before the state of a reservation; the core does not read the caller.
  P21:
    promise: "Only the order system may call ReserveStock, ReleaseReservation and ShipReservation; only warehouse staff and the purchasing system may call ReceiveGoods; only warehouse supervisors may call AdjustStock; any authenticated caller may call GetStock, and other calls are refused with FORBIDDEN."
    status: declared
    by: [access.entity.caller, access.field.role, access.error.forbidden, reservation.operation.reserve_stock, reservation.operation.release_reservation, reservation.operation.ship_reservation, receipt.operation.receive_goods, adjustment.operation.adjust_stock, stock.operation.get_stock]
  # The purchase order, the 1 to 200 lines and the new on-hand count of each line are declared. "New on-hand = previous on-hand + received" needs the stored count.
  P22:
    promise: "ReceiveGoods names a purchase order id and 1 to 200 lines, and the answer reports for each line the new on-hand count, which equals the previous on-hand plus the received quantity."
    status: workaround
    by: [receipt.entity.receive_request, receipt.field.purchase_order_id, receipt.entity.receipt, stock.field.on_hand]
    hole: A2
  # The manifest is stable, so urn-forge diff refuses a removal or a rename. compatibility.callers lets diff accept
  # a new field, operation, error code or event type. compatibility.notice: a removal is a sunset atom, which diff
  # accepts only after a deprecation with a sunsetDate, which compile checks is 6 months after deprecatedOn.
  P23:
    promise: "Within a major version of the contract, fields, operations, error codes and event types are only added, never removed or renamed, callers must ignore fields they do not know, and a removed element stays supported for at least 6 months after it is announced as deprecated."
    status: declared
    by: [manifest.compatibility]
