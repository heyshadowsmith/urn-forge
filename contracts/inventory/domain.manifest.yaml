# Inventory: on-hand, reserved and available stock of products per warehouse location.
# The shell authenticates the caller, reads the clock, and loads the stored records that a call needs
# (stock levels, the reservation); each is a property of the input. An answer is the new state of the
# records it names (levels, reservation) and the events of the change; a refusal is an output too.
manifest:
  namespace: corpus
  domain: inventory
  version: 1.0.0
  # Callers ignore a property, an output or a choice that they do not know.
  compatibility:
    callers: ignore-unknown

definitions:
  # Who calls, as the shell authenticated them. The clock is the shell's own clock, which calls
  # expire_reservation for each reservation whose expiry time has come.
  role:
    description: The kind of caller, as the shell authenticated it
    type: string
    rules:
      - enum: [order_system, purchasing_system, warehouse_staff, warehouse_supervisor, clock]

  caller:
    description: Who calls, as the shell authenticated them
    type: object
    properties: [role]
    rules:
      - required: [role]

  # Times: UTC, ISO 8601, a trailing Z and exactly 3 digits after the second.
  utc_time:
    description: A time in UTC with milliseconds, such as 2026-11-22T10:00:00.000Z
    type: string
    rules:
      - format: date-time
      - pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'

  now:
    description: The time of the call, from the shell's clock
    type: utc_time

  idempotency_key:
    description: A key that the caller chooses for one write request
    type: string
    rules:
      - minLength: 8
      - maxLength: 64

  # Stock of one product at one warehouse location.
  sku:
    description: A product code of uppercase letters, digits and hyphens, with no hyphen at either end
    type: string
    rules:
      - minLength: 3
      - maxLength: 32
      - pattern: '^[A-Z0-9]([A-Z0-9-]*[A-Z0-9])?$'

  location:
    description: A location code WAREHOUSE-ZONE-BIN, for example AMS-B-0142
    type: string
    rules:
      - pattern: '^[A-Z]{3}-[A-Z]-[0-9]{4}$'

  quantity:
    description: A number of units in a receive, reserve or ship request
    type: integer
    rules:
      - minimum: 1
      - maximum: 100000

  requested:
    description: The number of units that a request asked for
    type: quantity

  on_hand:
    description: The units physically at the location
    type: integer
    rules:
      - minimum: 0

  reserved:
    description: The units at the location that open reservations hold
    type: integer
    rules:
      - minimum: 0

  available:
    description: The units at the location that can still be reserved
    type: integer
    rules:
      - minimum: 0

  line:
    description: A number of units of one SKU at one location
    type: object
    properties: [sku, location, quantity]
    rules:
      - required: [sku, location, quantity]

  receipt_lines:
    description: The lines of goods that arrived
    type: array
    items: line
    rules:
      - minItems: 1
      - maxItems: 200

  reserve_lines:
    description: The lines to reserve, each SKU-location pair once
    type: array
    items: line
    rules:
      - minItems: 1
      - maxItems: 100
      - one_line_per_pair

  ship_lines:
    description: The quantity to ship of some lines of a reservation, each SKU-location pair once
    type: array
    items: line
    rules:
      - minItems: 1
      - maxItems: 100
      - one_line_per_pair

  stock_level:
    description: The stock of one SKU at one location
    type: object
    properties: [sku, location, on_hand, reserved, available]
    rules:
      - required: [sku, location, on_hand, reserved, available]
      - available_is_on_hand_minus_reserved

  stored_level:
    description: The stored stock level of the SKU at the location, which the shell loaded; absent when there is none
    type: stock_level

  stored_levels:
    description: The stored stock levels of the SKU-location pairs of the call, which the shell loaded
    type: array
    items: stock_level

  levels:
    description: The new stock level of each SKU-location pair that the call changed
    type: array
    items: stock_level

  level:
    description: A stock level after a change
    type: stock_level

  short_line:
    description: A line that the stock cannot cover, with what was asked and what is available
    type: object
    properties: [sku, location, requested, available]
    rules:
      - required: [sku, location, requested, available]

  short_lines:
    description: The lines that the stock cannot cover
    type: array
    items: short_line
    rules:
      - minItems: 1

  # Receiving goods.
  purchase_order_id:
    description: The purchase order that the goods arrive for
    type: string
    rules:
      - minLength: 1

  # Reservations.
  reservation_id:
    description: The identifier of a reservation
    type: string
    rules:
      - pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

  order_id:
    description: The order that a reservation is for
    type: string
    rules:
      - minLength: 1

  ttl_minutes:
    description: The minutes until an unshipped, unreleased reservation expires; 30 when absent
    type: integer
    rules:
      - minimum: 1
      - maximum: 10080

  result:
    description: The answer of a reservation that holds every line in full
    type: string
    rules:
      - enum: [RESERVED]

  state:
    description: The state of a reservation
    type: string
    rules:
      - enum: [ACTIVE, PARTIALLY_SHIPPED, SHIPPED, RELEASED, EXPIRED]

  expires_at:
    description: When the reservation expires if it is still active
    type: utc_time

  shipped:
    description: The units of a reserved line that have been shipped
    type: integer
    rules:
      - minimum: 0

  reserved_line:
    description: A line of a reservation, the units it reserved and the units shipped so far
    type: object
    properties: [sku, location, quantity, shipped]
    rules:
      - required: [sku, location, quantity, shipped]
      - shipped_at_most_quantity

  reservation_lines:
    description: The lines of a reservation, each SKU-location pair once
    type: array
    items: reserved_line
    rules:
      - minItems: 1
      - maxItems: 100
      - one_line_per_pair

  reservation:
    description: A reservation of stock for an order
    type: object
    identifier: reservation_id
    properties: [reservation_id, order_id, state, reservation_lines, expires_at]
    rules:
      - required: [reservation_id, order_id, state, reservation_lines, expires_at]
      - shipping_matches_state

  stored_reservation:
    description: The stored reservation that the request names, which the shell loaded; absent when there is none
    type: reservation

  open_reservation:
    description: The stored open (active or partly shipped) reservation of the order, which the shell loaded; absent when there is none
    type: reservation

  # Adjustments.
  delta:
    description: The signed change to the on-hand count
    type: integer
    rules:
      - minimum: -100000
      - maximum: 100000
      - not_zero

  reason:
    description: Why the on-hand count changes
    type: string
    rules:
      - enum: [DAMAGED, LOST, FOUND, CYCLE_COUNT, CORRECTION]

  # Events: one for each SKU-location pair that a change moved. They are part of the answer; the
  # shell publishes them.
  event_id:
    description: The identifier of an event, the same in each copy of it
    type: string
    rules:
      - pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

  event_type:
    description: The kind of change to stock
    type: string
    rules:
      - enum: [StockReceived, StockReserved, ReservationReleased, ReservationExpired, StockShipped, StockAdjusted]

  quantity_changed:
    description: The number of units that the change moved
    type: delta

  occurred_at:
    description: When the change happened
    type: utc_time

  stock_event:
    description: A change to the stock of one SKU at one location, with the new stock level
    type: object
    properties: [event_id, event_type, sku, location, quantity_changed, level, occurred_at, reservation_id, reason]
    rules:
      - required: [event_id, event_type, sku, location, quantity_changed, level, occurred_at]
      - level_is_the_event_pair

  events:
    description: The events of a change, one for each SKU-location pair that it moved
    type: array
    items: stock_event

  stock_depleted:
    description: The available count of a SKU at a location dropped to 0
    type: object
    properties: [event_id, sku, location, occurred_at]
    rules:
      - required: [event_id, sku, location, occurred_at]

  depletions:
    description: A StockDepleted event for each SKU-location pair whose available count dropped to 0
    type: array
    items: stock_depleted

  # Refusals: each carries one error code and a message.
  error_code:
    description: The code of a refusal
    type: string
    rules:
      - enum: [INVALID_REQUEST, UNKNOWN_SKU, UNKNOWN_LOCATION, INSUFFICIENT_STOCK, RESERVATION_NOT_FOUND, INVALID_STATE, FORBIDDEN, IDEMPOTENCY_CONFLICT]

  expected_code:
    description: The error code that a refusal carries
    type: string

  error_message:
    description: The reason of a refusal, for a person
    type: string
    rules:
      - minLength: 1

  invalid_request:
    description: The request is not valid for the current stock or reservation
    type: object
    properties: [error_code, error_message]
    rules:
      - required: [error_code, error_message]
      - code_is: INVALID_REQUEST

  unknown_sku:
    description: The service does not know the SKU
    type: object
    properties: [error_code, error_message, sku]
    rules:
      - required: [error_code, error_message, sku]
      - code_is: UNKNOWN_SKU

  unknown_location:
    description: The service does not know the location
    type: object
    properties: [error_code, error_message, location]
    rules:
      - required: [error_code, error_message, location]
      - code_is: UNKNOWN_LOCATION

  insufficient_stock:
    description: The stock cannot cover the request, so nothing changed
    type: object
    properties: [error_code, error_message, short_lines]
    rules:
      - required: [error_code, error_message, short_lines]
      - code_is: INSUFFICIENT_STOCK

  reservation_not_found:
    description: No reservation has this identifier
    type: object
    properties: [error_code, error_message, reservation_id]
    rules:
      - required: [error_code, error_message, reservation_id]
      - code_is: RESERVATION_NOT_FOUND

  invalid_state:
    description: The reservation is in a state that does not allow the change
    type: object
    properties: [error_code, error_message, reservation_id, state]
    rules:
      - required: [error_code, error_message, reservation_id, state]
      - code_is: INVALID_STATE

  open_reservation_exists:
    description: The order already has an open (active or partly shipped) reservation, so nothing was reserved; its code is INVALID_REQUEST
    type: object
    properties: [error_code, error_message, order_id]
    rules:
      - required: [error_code, error_message, order_id]
      - code_is: INVALID_REQUEST

  forbidden:
    description: The caller may not call this operation
    type: object
    properties: [error_code, error_message, role]
    rules:
      - required: [error_code, error_message, role]
      - code_is: FORBIDDEN

  # The shell's refusal of a repeated idempotency key with another body. No operation answers it: the
  # shell keeps the earlier requests, and check() checks its answer.
  idempotency_conflict:
    description: The idempotency key was used before with a different body
    type: object
    properties: [error_code, error_message, idempotency_key]
    rules:
      - required: [error_code, error_message, idempotency_key]
      - code_is: IDEMPOTENCY_CONFLICT

  # The inputs.
  stock_query:
    description: A question for the stock of one SKU at one location
    type: object
    properties: [caller, sku, location, stored_level]
    rules:
      - required: [caller, sku, location]
      - level_is_the_query

  receive_request:
    description: Goods that arrived for a purchase order
    type: object
    properties: [caller, now, idempotency_key, purchase_order_id, receipt_lines, stored_levels]
    rules:
      - required: [caller, now, idempotency_key, purchase_order_id, receipt_lines, stored_levels]

  reserve_request:
    description: A request to hold stock for an order
    type: object
    properties: [caller, now, idempotency_key, order_id, reserve_lines, ttl_minutes, stored_levels, open_reservation]
    rules:
      - required: [caller, now, idempotency_key, order_id, reserve_lines, stored_levels]
      - open_reservation_is_the_orders

  release_request:
    description: A request to give the stock of a reservation back
    type: object
    properties: [caller, now, idempotency_key, reservation_id, stored_reservation, stored_levels]
    rules:
      - required: [caller, now, idempotency_key, reservation_id, stored_levels]
      - names_the_reservation

  ship_request:
    description: A request to ship a reservation, in full or the stated quantity per line
    type: object
    properties: [caller, now, idempotency_key, reservation_id, ship_lines, stored_reservation, stored_levels]
    rules:
      - required: [caller, now, idempotency_key, reservation_id, stored_levels]
      - names_the_reservation

  expire_request:
    description: A request of the shell's clock to expire a reservation whose time has come
    type: object
    properties: [caller, now, idempotency_key, reservation_id, stored_reservation, stored_levels]
    rules:
      - required: [caller, now, idempotency_key, reservation_id, stored_levels]
      - names_the_reservation

  adjustment:
    description: A correction of the on-hand count of one SKU at one location
    type: object
    properties: [caller, now, idempotency_key, sku, location, delta, reason, stored_level]
    rules:
      - required: [caller, now, idempotency_key, sku, location, delta, reason]
      - level_is_the_query

  # The answers.
  receipt:
    description: The new stock of each received line, and its events
    type: object
    properties: [purchase_order_id, levels, events]
    rules:
      - required: [purchase_order_id, levels, events]

  reservation_made:
    description: A reservation that holds every requested line in full, the new stock levels and the events
    type: object
    properties: [result, reservation, levels, events, depletions]
    rules:
      - required: [result, reservation, levels, events, depletions]

  reservation_changed:
    description: A reservation after a change, the new stock levels and the events
    type: object
    properties: [reservation, levels, events]
    rules:
      - required: [reservation, levels, events]

  adjustment_made:
    description: The corrected stock level and its events
    type: object
    properties: [level, events, depletions]
    rules:
      - required: [level, events, depletions]

rules:
  # Rules of values.
  one_line_per_pair:
    description: No two lines have the same SKU and location
    rule: self.all(l, self.exists_one(m, m.sku == l.sku && m.location == l.location))
    failure_message: A SKU-location pair appears twice

  available_is_on_hand_minus_reserved:
    description: The available count is the on-hand count minus the reserved count
    rule: self.available == self.on_hand - self.reserved
    failure_message: The available count must equal on-hand minus reserved

  shipped_at_most_quantity:
    description: A line ships no more units than it reserved
    rule: self.shipped <= self.quantity
    failure_message: A line cannot ship more than it reserved

  shipping_matches_state:
    description: >-
      An active or expired reservation has shipped nothing, a shipped one has shipped every line in
      full, and a partly shipped one has shipped some units and not all
    rule: >-
      (self.state != 'ACTIVE' || self.reservation_lines.all(l, l.shipped == 0)) &&
      (self.state != 'EXPIRED' || self.reservation_lines.all(l, l.shipped == 0)) &&
      (self.state != 'SHIPPED' || self.reservation_lines.all(l, l.shipped == l.quantity)) &&
      (self.state != 'PARTIALLY_SHIPPED' || (self.reservation_lines.exists(l, l.shipped > 0) && self.reservation_lines.exists(l, l.shipped < l.quantity)))
    failure_message: The shipped units do not match the state of the reservation

  not_zero:
    description: The number is not 0
    rule: self != 0
    failure_message: Must not be 0

  level_is_the_event_pair:
    description: The stock level of an event is the level of its SKU and location
    rule: self.level.sku == self.sku && self.level.location == self.location
    failure_message: The stock level is of another SKU or location than the event

  code_is:
    description: A refusal carries its own error code
    parameters: [expected_code]
    rule: self.error_code == expected_code
    failure_message: The error code must be {expected_code}

  level_is_the_query:
    description: The loaded stock level is the level of the SKU and location of the request
    rule: '!has(self.stored_level) || (self.stored_level.sku == self.sku && self.stored_level.location == self.location)'
    failure_message: The loaded stock level is of another SKU or location

  open_reservation_is_the_orders:
    description: The loaded open reservation is an active or partly shipped reservation of the order of the request
    rule: >-
      !has(self.open_reservation) ||
      (self.open_reservation.order_id == self.order_id && self.open_reservation.state in ['ACTIVE', 'PARTIALLY_SHIPPED'])
    failure_message: The loaded open reservation is not an open reservation of this order

  names_the_reservation:
    description: The loaded reservation is the one that the request names
    rule: '!has(self.stored_reservation) || self.stored_reservation.reservation_id == self.reservation_id'
    failure_message: The loaded reservation is not the one that the request names

  # Who may call: a rule on each output of an operation, and its opposite on forbidden.
  by_order_system:
    description: The order system called
    rule: input.caller.role == 'order_system'
    failure_message: Only the order system may call this operation

  not_by_order_system:
    description: A caller other than the order system called
    rule: input.caller.role != 'order_system'
    failure_message: The order system may call this operation

  by_receiving_caller:
    description: Warehouse staff or the purchasing system called
    rule: input.caller.role in ['warehouse_staff', 'purchasing_system']
    failure_message: Only warehouse staff and the purchasing system may call this operation

  not_by_receiving_caller:
    description: A caller other than warehouse staff or the purchasing system called
    rule: "!(input.caller.role in ['warehouse_staff', 'purchasing_system'])"
    failure_message: Warehouse staff and the purchasing system may call this operation

  by_supervisor:
    description: A warehouse supervisor called
    rule: input.caller.role == 'warehouse_supervisor'
    failure_message: Only warehouse supervisors may call this operation

  not_by_supervisor:
    description: A caller other than a warehouse supervisor called
    rule: input.caller.role != 'warehouse_supervisor'
    failure_message: A warehouse supervisor may call this operation

  by_clock:
    description: The shell's clock called
    rule: input.caller.role == 'clock'
    failure_message: Only the shell's clock may call this operation

  not_by_clock:
    description: A caller other than the shell's clock called
    rule: input.caller.role != 'clock'
    failure_message: The shell's clock may call this operation

  names_the_role:
    description: The refusal names the role of the caller
    rule: output.role == input.caller.role
    failure_message: The refusal names another role than the caller's

  # Reading stock, and the stock of one SKU at one location.
  is_the_stored_level:
    description: The answer is the stored stock level
    rule: has(input.stored_level) && output == input.stored_level
    failure_message: The answer is not the stored stock level

  no_stored_level:
    description: No stock level is stored for the SKU at the location
    rule: '!has(input.stored_level)'
    failure_message: A stock level is stored for the SKU at the location

  names_the_sku:
    description: The refusal names the SKU of the request
    rule: output.sku == input.sku
    failure_message: The refusal names another SKU

  names_the_location:
    description: The refusal names the location of the request
    rule: output.location == input.location
    failure_message: The refusal names another location

  # Events of a change.
  one_event_per_level:
    description: Each changed stock level has exactly one event of the type, with that level, at the time of the call
    parameters: [event_type]
    rule: >-
      size(output.events) == size(output.levels) &&
      output.levels.all(v, output.events.exists_one(e, e.level == v)) &&
      output.events.all(e, e.event_type == event_type && e.occurred_at == input.now)
    failure_message: Each changed stock level must have exactly one {event_type} event at the time of the call

  events_name_the_reservation:
    description: Each event names the reservation
    rule: output.events.all(e, has(e.reservation_id) && e.reservation_id == output.reservation.reservation_id)
    failure_message: An event does not name the reservation

  # Receiving goods.
  names_the_purchase_order:
    description: The receipt names the purchase order of the request
    rule: output.purchase_order_id == input.purchase_order_id
    failure_message: The receipt names another purchase order

  receives_each_line:
    description: >-
      The receipt has one new stock level for each line; for a line whose SKU-location pair occurs once,
      its on-hand count is the stored count plus the received quantity, and its reserved count is unchanged
    rule: >-
      size(output.levels) == size(input.receipt_lines) &&
      input.receipt_lines.all(l, !input.receipt_lines.exists_one(m, m.sku == l.sku && m.location == l.location) ||
        input.stored_levels.exists(s, s.sku == l.sku && s.location == l.location &&
          output.levels.exists(v, v.sku == l.sku && v.location == l.location && v.on_hand == s.on_hand + l.quantity && v.reserved == s.reserved)))
    failure_message: The new on-hand count of a line is not the stored count plus the received quantity

  receipt_events_move_the_lines:
    description: Each event of a receipt moves the quantity of a received line, and names no reservation
    rule: >-
      output.events.all(e, !has(e.reservation_id) &&
        input.receipt_lines.exists(l, l.sku == e.sku && l.location == e.location && l.quantity == e.quantity_changed))
    failure_message: An event does not move the quantity of a received line

  a_received_line_is_unknown:
    description: No stock level is stored for the SKU and location of a received line
    rule: input.receipt_lines.exists(l, !input.stored_levels.exists(s, s.sku == l.sku && s.location == l.location))
    failure_message: Every received line has a stored stock level

  # Reserving stock: every line in full, or nothing.
  no_open_reservation:
    description: The order has no open reservation
    rule: '!has(input.open_reservation)'
    failure_message: The order already has an open reservation

  has_an_open_reservation:
    description: The order has an open reservation
    rule: has(input.open_reservation)
    failure_message: The order has no open reservation

  names_the_order:
    description: The refusal names the order of the request
    rule: output.order_id == input.order_id
    failure_message: The refusal names another order

  a_reserved_line_is_unknown:
    description: No stock level is stored for the SKU and location of a requested line
    rule: input.reserve_lines.exists(l, !input.stored_levels.exists(s, s.sku == l.sku && s.location == l.location))
    failure_message: Every requested line has a stored stock level

  covers_every_line:
    description: The available stock covers every requested line in full
    rule: input.reserve_lines.all(l, input.stored_levels.exists(s, s.sku == l.sku && s.location == l.location && l.quantity <= s.available))
    failure_message: The available stock does not cover every line

  is_reserved_active:
    description: The answer is RESERVED, and the reservation is active
    rule: output.result == 'RESERVED' && output.reservation.state == 'ACTIVE'
    failure_message: A new reservation is RESERVED and ACTIVE

  reserves_the_lines:
    description: The reservation is for the order, with one line per requested line, with the same SKU, location and quantity, and nothing shipped
    rule: >-
      output.reservation.order_id == input.order_id &&
      size(output.reservation.reservation_lines) == size(input.reserve_lines) &&
      input.reserve_lines.all(l, output.reservation.reservation_lines.exists(r,
        r.sku == l.sku && r.location == l.location && r.quantity == l.quantity && r.shipped == 0))
    failure_message: The reservation does not hold exactly the requested lines

  reserves_the_stock:
    description: Each requested line adds its quantity to the reserved count of its stock level, and nothing else changes
    rule: >-
      size(output.levels) == size(input.reserve_lines) &&
      input.reserve_lines.all(l, input.stored_levels.exists(s, s.sku == l.sku && s.location == l.location &&
        output.levels.exists(v, v.sku == l.sku && v.location == l.location && v.on_hand == s.on_hand && v.reserved == s.reserved + l.quantity)))
    failure_message: The new reserved count of a line is not the stored count plus the requested quantity

  reserve_events_move_the_lines:
    description: Each event of a reservation moves the quantity of a requested line
    rule: output.events.all(e, input.reserve_lines.exists(l, l.sku == e.sku && l.location == e.location && l.quantity == e.quantity_changed))
    failure_message: An event does not move the quantity of a requested line

  depletes_at_zero:
    description: Each changed stock level whose available count is 0 has exactly one StockDepleted event, and no other has one
    rule: >-
      output.levels.all(v, (v.available == 0) == output.depletions.exists(d, d.sku == v.sku && d.location == v.location)) &&
      output.depletions.all(d, d.occurred_at == input.now &&
        output.depletions.exists_one(x, x.sku == d.sku && x.location == d.location) &&
        output.levels.exists(v, v.sku == d.sku && v.location == d.location))
    failure_message: The StockDepleted events are not the changed levels whose available count is 0

  expires_after_30_minutes:
    description: Without a time-to-live, the reservation expires 30 minutes after the call
    rule: has(input.ttl_minutes) || timestamp(output.reservation.expires_at) == timestamp(input.now) + duration('30m')
    failure_message: A reservation without a time-to-live expires 30 minutes after the call

  expires_within_a_week:
    description: With a time-to-live, the reservation expires between 1 minute and 7 days after the call
    rule: >-
      !has(input.ttl_minutes) ||
      (timestamp(output.reservation.expires_at) >= timestamp(input.now) + duration('1m') &&
       timestamp(output.reservation.expires_at) <= timestamp(input.now) + duration('168h'))
    failure_message: A reservation with a time-to-live expires between 1 minute and 7 days after the call

  lists_the_short_lines:
    description: >-
      Every requested line has a stored level, and the short lines are exactly the requested lines that
      ask for more than is available, each once, with its requested and available quantity
    rule: >-
      input.reserve_lines.all(l, input.stored_levels.exists(s, s.sku == l.sku && s.location == l.location &&
        (l.quantity <= s.available || output.short_lines.exists(x, x.sku == l.sku && x.location == l.location)))) &&
      output.short_lines.all(x, x.requested > x.available &&
        output.short_lines.exists_one(y, y.sku == x.sku && y.location == x.location) &&
        input.reserve_lines.exists(l, l.sku == x.sku && l.location == x.location && l.quantity == x.requested) &&
        input.stored_levels.exists(s, s.sku == x.sku && s.location == x.location && s.available == x.available))
    failure_message: The short lines are not exactly the lines that the available stock cannot cover

  # Changing a reservation: release, expire and ship.
  no_stored_reservation:
    description: No reservation is stored with the identifier of the request
    rule: '!has(input.stored_reservation)'
    failure_message: A reservation is stored with this identifier

  names_the_reservation_id:
    description: The refusal names the reservation of the request
    rule: output.reservation_id == input.reservation_id
    failure_message: The refusal names another reservation

  names_the_stored_state:
    description: The refusal names the reservation and its stored state
    rule: has(input.stored_reservation) && output.reservation_id == input.reservation_id && output.state == input.stored_reservation.state
    failure_message: The refusal does not name the reservation and its stored state

  was_open:
    description: The stored reservation was active or partly shipped
    rule: has(input.stored_reservation) && input.stored_reservation.state in ['ACTIVE', 'PARTIALLY_SHIPPED']
    failure_message: The reservation was not active or partly shipped

  was_not_open:
    description: The stored reservation was shipped, released or expired
    rule: has(input.stored_reservation) && !(input.stored_reservation.state in ['ACTIVE', 'PARTIALLY_SHIPPED'])
    failure_message: The reservation was active or partly shipped

  was_active:
    description: The stored reservation was active
    rule: has(input.stored_reservation) && input.stored_reservation.state == 'ACTIVE'
    failure_message: The reservation was not active

  was_not_active:
    description: The stored reservation was partly shipped, shipped, released or expired
    rule: has(input.stored_reservation) && input.stored_reservation.state != 'ACTIVE'
    failure_message: The reservation was active

  is_released:
    description: The reservation is released
    rule: output.reservation.state == 'RELEASED'
    failure_message: The reservation is not released

  is_expired:
    description: The reservation is expired
    rule: output.reservation.state == 'EXPIRED'
    failure_message: The reservation is not expired

  is_shipped_or_partly:
    description: The reservation is shipped or partly shipped
    rule: output.reservation.state in ['PARTIALLY_SHIPPED', 'SHIPPED']
    failure_message: The reservation is not shipped or partly shipped

  keeps_the_identity:
    description: The reservation keeps its identifier, its order and its expiry time
    rule: >-
      has(input.stored_reservation) &&
      output.reservation.reservation_id == input.stored_reservation.reservation_id &&
      output.reservation.order_id == input.stored_reservation.order_id &&
      output.reservation.expires_at == input.stored_reservation.expires_at
    failure_message: The reservation may not change its identifier, its order or its expiry time

  keeps_the_lines:
    description: The reservation keeps its lines
    rule: has(input.stored_reservation) && output.reservation.reservation_lines == input.stored_reservation.reservation_lines
    failure_message: The reservation may not change its lines

  gives_back_the_held_stock:
    description: >-
      Each line with units still held takes them off the reserved count of its stock level, and no
      other stock level changes
    rule: >-
      has(input.stored_reservation) &&
      input.stored_reservation.reservation_lines.all(r, r.shipped == r.quantity ||
        input.stored_levels.exists(s, s.sku == r.sku && s.location == r.location &&
          output.levels.exists(v, v.sku == r.sku && v.location == r.location && v.on_hand == s.on_hand && v.reserved == s.reserved - (r.quantity - r.shipped)))) &&
      output.levels.all(v, input.stored_reservation.reservation_lines.exists(r, r.sku == v.sku && r.location == v.location && r.shipped < r.quantity))
    failure_message: The new reserved counts do not give back the units that the reservation still held

  held_events_move_the_lines:
    description: Each event gives back the units that a line of the reservation still held
    rule: >-
      has(input.stored_reservation) &&
      output.events.all(e, input.stored_reservation.reservation_lines.exists(r, r.sku == e.sku && r.location == e.location && e.quantity_changed == r.quantity - r.shipped))
    failure_message: An event does not give back the units that a line still held

  is_due:
    description: The expiry time of the reservation has come
    rule: has(input.stored_reservation) && timestamp(input.now) >= timestamp(input.stored_reservation.expires_at)
    failure_message: The reservation is not due to expire

  is_not_due:
    description: The reservation is active and its expiry time has not come
    rule: has(input.stored_reservation) && input.stored_reservation.state == 'ACTIVE' && timestamp(input.now) < timestamp(input.stored_reservation.expires_at)
    failure_message: The reservation is due to expire

  ships_the_lines:
    description: >-
      Without lines, every line ships in full. With lines, each named line of the reservation ships the
      stated quantity, which is at most the units it still holds, and the other lines ship nothing
    rule: >-
      has(input.stored_reservation) &&
      size(output.reservation.reservation_lines) == size(input.stored_reservation.reservation_lines) &&
      input.stored_reservation.reservation_lines.all(s, output.reservation.reservation_lines.exists(r,
        r.sku == s.sku && r.location == s.location && r.quantity == s.quantity &&
        ((!has(input.ship_lines) && r.shipped == s.quantity) ||
         (has(input.ship_lines) &&
          (input.ship_lines.exists(x, x.sku == s.sku && x.location == s.location && x.quantity <= s.quantity - s.shipped && r.shipped == s.shipped + x.quantity) ||
           (!input.ship_lines.exists(x, x.sku == s.sku && x.location == s.location) && r.shipped == s.shipped)))))) &&
      (!has(input.ship_lines) || input.ship_lines.all(x, input.stored_reservation.reservation_lines.exists(s, s.sku == x.sku && s.location == x.location)))
    failure_message: The shipped units are not the units that the request ships

  ships_more_than_held:
    description: A stated line is not a line of the reservation, or asks for more units than the line still holds
    rule: >-
      has(input.ship_lines) && has(input.stored_reservation) &&
      input.ship_lines.exists(x, !input.stored_reservation.reservation_lines.exists(s,
        s.sku == x.sku && s.location == x.location && x.quantity <= s.quantity - s.shipped))
    failure_message: Every stated line is a line of the reservation with that many units still held

  takes_the_shipped_stock:
    description: >-
      Each line that ships units takes them off the on-hand and the reserved count of its stock level,
      and no other stock level changes
    rule: >-
      has(input.stored_reservation) &&
      output.reservation.reservation_lines.all(r, input.stored_reservation.reservation_lines.all(s,
        s.sku != r.sku || s.location != r.location || r.shipped == s.shipped ||
        input.stored_levels.exists(w, w.sku == r.sku && w.location == r.location &&
          output.levels.exists(v, v.sku == r.sku && v.location == r.location &&
            v.on_hand == w.on_hand - (r.shipped - s.shipped) && v.reserved == w.reserved - (r.shipped - s.shipped))))) &&
      output.levels.all(v, output.reservation.reservation_lines.exists(r, r.sku == v.sku && r.location == v.location &&
        input.stored_reservation.reservation_lines.exists(s, s.sku == r.sku && s.location == r.location && r.shipped > s.shipped)))
    failure_message: The new stock levels do not take off the shipped units

  shipped_events_move_the_lines:
    description: Each event moves the units that a line shipped in this call
    rule: >-
      has(input.stored_reservation) &&
      output.events.all(e, output.reservation.reservation_lines.exists(r, r.sku == e.sku && r.location == e.location &&
        input.stored_reservation.reservation_lines.exists(s, s.sku == r.sku && s.location == r.location && e.quantity_changed == r.shipped - s.shipped)))
    failure_message: An event does not move the units that a line shipped

  # Adjusting stock.
  adjusts_the_level:
    description: The new on-hand count is the stored count plus the delta, and the reserved count is unchanged
    rule: >-
      has(input.stored_level) &&
      output.level.sku == input.sku && output.level.location == input.location &&
      output.level.on_hand == input.stored_level.on_hand + input.delta &&
      output.level.reserved == input.stored_level.reserved
    failure_message: The new on-hand count is not the stored count plus the delta

  one_adjusted_event:
    description: Exactly one StockAdjusted event, with the delta, the reason, the new level and the time of the call
    rule: >-
      size(output.events) == 1 &&
      output.events.all(e, e.event_type == 'StockAdjusted' && e.quantity_changed == input.delta && e.level == output.level &&
        e.occurred_at == input.now && !has(e.reservation_id) && has(e.reason) && e.reason == input.reason)
    failure_message: An adjustment has exactly one StockAdjusted event of the change

  depletes_at_zero_once:
    description: Exactly one StockDepleted event when the available count is 0, and none otherwise
    rule: >-
      (output.level.available == 0) == (size(output.depletions) == 1) &&
      size(output.depletions) <= 1 &&
      output.depletions.all(d, d.sku == input.sku && d.location == input.location && d.occurred_at == input.now)
    failure_message: An adjustment has one StockDepleted event when the available count is 0, and none otherwise

  is_short_of_the_delta:
    description: >-
      The delta would make on-hand fall below the reserved count, and the one short line asks for the
      units taken off against the units available
    rule: >-
      has(input.stored_level) &&
      input.stored_level.on_hand + input.delta < input.stored_level.reserved &&
      size(output.short_lines) == 1 &&
      output.short_lines.all(x, x.sku == input.sku && x.location == input.location &&
        x.requested == -input.delta && x.available == input.stored_level.available)
    failure_message: The adjustment does not make on-hand fall below the reserved count

operations:
  get_stock:
    description: Read the stock of one SKU at one location
    input: stock_query
    # Any authenticated caller may read the stock.
    output:
      - stock_level: [is_the_stored_level]
      - unknown_sku: [no_stored_level, names_the_sku]
      - unknown_location: [no_stored_level, names_the_location]

  receive_goods:
    description: Add received goods to the on-hand stock
    input: receive_request
    output:
      - receipt:
          - by_receiving_caller
          - names_the_purchase_order
          - receives_each_line
          - one_event_per_level: StockReceived
          - receipt_events_move_the_lines
      - unknown_sku: [by_receiving_caller, a_received_line_is_unknown]
      - unknown_location: [by_receiving_caller, a_received_line_is_unknown]
      - forbidden: [not_by_receiving_caller, names_the_role]

  reserve_stock:
    description: Reserve every line in full, or nothing
    input: reserve_request
    output:
      - reservation_made:
          - by_order_system
          - no_open_reservation
          - covers_every_line
          - is_reserved_active
          - reserves_the_lines
          - reserves_the_stock
          - one_event_per_level: StockReserved
          - events_name_the_reservation
          - reserve_events_move_the_lines
          - depletes_at_zero
          - expires_after_30_minutes
          - expires_within_a_week
      - insufficient_stock: [by_order_system, lists_the_short_lines]
      - open_reservation_exists: [by_order_system, has_an_open_reservation, names_the_order]
      - unknown_sku: [by_order_system, a_reserved_line_is_unknown]
      - unknown_location: [by_order_system, a_reserved_line_is_unknown]
      - forbidden: [not_by_order_system, names_the_role]

  release_reservation:
    description: Give the stock of an active or partly shipped reservation back
    input: release_request
    output:
      - reservation_changed:
          - by_order_system
          - was_open
          - is_released
          - keeps_the_identity
          - keeps_the_lines
          - gives_back_the_held_stock
          - one_event_per_level: ReservationReleased
          - events_name_the_reservation
          - held_events_move_the_lines
      - reservation_not_found: [by_order_system, no_stored_reservation, names_the_reservation_id]
      - invalid_state: [by_order_system, was_not_open, names_the_stored_state]
      - forbidden: [not_by_order_system, names_the_role]

  ship_reservation:
    description: Ship a reservation, in full or the stated quantity per line
    input: ship_request
    output:
      - reservation_changed:
          - by_order_system
          - was_open
          - is_shipped_or_partly
          - keeps_the_identity
          - ships_the_lines
          - takes_the_shipped_stock
          - one_event_per_level: StockShipped
          - events_name_the_reservation
          - shipped_events_move_the_lines
      - invalid_request: [by_order_system, was_open, ships_more_than_held]
      - reservation_not_found: [by_order_system, no_stored_reservation, names_the_reservation_id]
      - invalid_state: [by_order_system, was_not_open, names_the_stored_state]
      - forbidden: [not_by_order_system, names_the_role]

  # The shell's clock calls it for each active reservation whose expiry time has come.
  expire_reservation:
    description: Expire an active reservation whose expiry time has come, and give its stock back
    input: expire_request
    output:
      - reservation_changed:
          - by_clock
          - was_active
          - is_due
          - is_expired
          - keeps_the_identity
          - keeps_the_lines
          - gives_back_the_held_stock
          - one_event_per_level: ReservationExpired
          - events_name_the_reservation
          - held_events_move_the_lines
      - invalid_request: [by_clock, is_not_due]
      - reservation_not_found: [by_clock, no_stored_reservation, names_the_reservation_id]
      - invalid_state: [by_clock, was_not_active, names_the_stored_state]
      - forbidden: [not_by_clock, names_the_role]

  adjust_stock:
    description: Correct the on-hand count of one SKU at one location
    input: adjustment
    output:
      - adjustment_made: [by_supervisor, adjusts_the_level, one_adjusted_event, depletes_at_zero_once]
      - insufficient_stock: [by_supervisor, is_short_of_the_delta]
      - unknown_sku: [by_supervisor, no_stored_level, names_the_sku]
      - unknown_location: [by_supervisor, no_stored_level, names_the_location]
      - forbidden: [not_by_supervisor, names_the_role]
