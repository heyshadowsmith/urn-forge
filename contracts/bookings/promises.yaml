contract: bookings
description: "Lets guests and restaurant staff book, change and cancel tables at a restaurant for a given date, time and party size, with deposits for larger parties."
# The shell loads what a call needs into its input (the booking as stored, the caller it authenticated, the time
# of its clock, the first call with an idempotency key) and stores and publishes what an output holds. Each
# output lists the rules that hold when it comes back, so runOperation refuses an answer that breaks them.
promises:
  # Workaround: the shape is the pattern of reference. The reference is the identifier of booking, so it is the
  # primary key of the booking table and two stored bookings never share one. "Never reused" is not stated: a
  # deleted row frees its reference, and no rule of create_booking sees the references used before, so a core can
  # give a reference of a deleted booking to a new one and every check passes.
  P01:
    promise: "A booking reference is exactly 8 characters drawn from upper-case letters A-Z (excluding I and O) and digits 2-9, and is never reused for another booking."
    status: workaround
    by: [definitions.reference, definitions.booking]
    hole: C1
  # Declared: party_size is an integer with minimum 1 and maximum 20. create_booking answers party_too_large_for_online
  # exactly when the party is 13 or more (party_too_large on that output, party_fits_online on every other one), and
  # change_booking does the same for a new party size (new_party_too_large, new_party_fits_online). This refusal comes
  # before the others of the request, so a request for 13 or more always gets it.
  P02:
    promise: "A party size is a whole number from 1 to 20, and requests for 13 or more guests are refused with PARTY_TOO_LARGE_FOR_ONLINE so they can be handled by phone."
    status: declared
    by: [definitions.party_size, definitions.party_too_large_for_online, rules.party_too_large, rules.party_fits_online, rules.new_party_too_large, rules.new_party_fits_online, rules.names_the_party, rules.names_the_new_party, operations.create_booking, operations.change_booking]
  # Workaround: the 15-minute boundary (pattern of local_time) and the time zone in each answer (required in
  # confirmation, booking, no_availability and booking_event) are declared. local_start_is_starts_at makes starts_at of
  # each confirmation and booking (stored, or to store) the local date and time in its time_zone, to the second, and a
  # name that is no time zone fails it; move_is_at_its_local_time does the same for a move in the stored zone, and
  # alternatives_at_their_local_time and requested_start_in_the_zone for the starts of a no_availability in its zone.
  # Not declared: that the zone is the restaurant's. No input holds the restaurant's zone (create_request has none, and
  # the manifest has no restaurant record), so the zone of an answer is the core's choice: a request at a Paris
  # restaurant for 19:30 with a starts_at of 21:30 UTC is booked with time_zone America/Noronha, and every check passes.
  P03:
    promise: "A booking time is given as a local date and time on a 15-minute boundary (minutes 00, 15, 30 or 45) in the restaurant's IANA time zone, and every answer carries that time zone name alongside the time."
    status: workaround
    by: [definitions.local_date, definitions.local_time, definitions.time_zone, definitions.confirmation, definitions.booking, definitions.no_availability, definitions.change_request, rules.local_start_is_starts_at, rules.move_is_at_its_local_time, rules.alternatives_at_their_local_time, rules.requested_start_in_the_zone]
    hole: D3
  # Declared: contact requires name (minLength 1, maxLength 100), and the rule email_or_phone needs an email or a phone;
  # phone has the E.164 pattern of at most 15 digits. The check refuses a contact with neither.
  P04:
    promise: "A guest's contact must include a name of 1 to 100 characters and at least one of an email address or an E.164 phone number of at most 15 digits."
    status: declared
    by: [definitions.contact, definitions.name, definitions.email, definitions.phone, rules.email_or_phone]
  # Declared: special_requests has maxLength 500; dietary_tags is an optional array of dietary_tag (an enum of the
  # published set) with maxItems 10 and uniqueItems.
  P05:
    promise: "Special requests are free text of at most 500 characters, and dietary tags, if given, are a list of at most 10 distinct values from a fixed published set such as vegetarian, vegan, gluten_free, nut_allergy and halal."
    status: declared
    by: [definitions.special_requests, definitions.dietary_tag, definitions.dietary_tags, definitions.booking_request]
  # Declared: booking_request, the body of create_booking's input, requires restaurant_id, local_date, local_time,
  # party_size, contact and idempotency_key, whose minLength is 16 and maxLength 64.
  P06:
    promise: "A create-booking request must contain the restaurant id, local date and time, party size, guest contact and a client-generated idempotency key of 16 to 64 characters."
    status: declared
    by: [definitions.booking_request, definitions.restaurant_id, definitions.local_date, definitions.local_time, definitions.party_size, definitions.contact, definitions.idempotency_key, operations.create_booking]
  # Workaround: the window is stated over now and starts_at (in_the_booking_window on booked and the other answers,
  # outside_the_booking_window on outside_booking_window; the move_ rules for a new start in change_booking). For a
  # move it is declared: move_is_at_its_local_time rejects a new starts_at that is not the new local date and time in
  # the zone of the stored booking. For create it is not: the request has no zone, and the restaurant's zone is in no
  # input (P03), so a request whose starts_at is not its local time cannot be rejected. Such a request is booked with
  # a zone that fits its starts_at (local_start_is_starts_at holds in the core's zone): at 10:00 UTC, a request at a
  # Paris restaurant for 11:00 local time (now) with a starts_at of 13:00 UTC is booked with time_zone America/Noronha;
  # and payment_declined, which carries no zone, refuses it with PAYMENT_DECLINED.
  P07:
    promise: "A booking can be made no earlier than 2 hours and no later than 90 days before its start time, and requests outside that window are refused with OUTSIDE_BOOKING_WINDOW."
    status: workaround
    by: [operations.create_booking, operations.change_booking, rules.in_the_booking_window, rules.outside_the_booking_window, rules.move_in_the_booking_window, rules.move_outside_the_booking_window, rules.move_is_at_its_local_time, rules.local_start_is_starts_at, definitions.starts_at, definitions.now, definitions.outside_booking_window, definitions.change_request, definitions.confirmation]
    hole: D3
  # Declared: create_booking answers deposit_required exactly when a party of 7 to 12 gives no deposit_token
  # (deposit_token_missing on that output, deposit_token_if_needed on the outputs after it); 13 or more is refused
  # first (P02). change_booking does the same for a new party size (new_deposit_token_missing, new_deposit_token_if_needed).
  P08:
    promise: "A party of 7 or more guests must include a deposit payment token in the request, otherwise the request is refused with DEPOSIT_REQUIRED."
    status: declared
    by: [definitions.deposit_token, definitions.deposit_required, rules.deposit_token_if_needed, rules.deposit_token_missing, rules.new_deposit_token_if_needed, rules.new_deposit_token_missing, operations.create_booking, operations.change_booking]
  # Workaround: an amount is an integer of cents with exclusiveMinimum 0, so it is positive with at most 2 decimals of a
  # currency of 2 decimals; deposit_has_terms and deposit_is_per_guest state the per-guest amount and the product,
  # exactly. Not declared: the restaurant's single published currency. The manifest holds no restaurant record, and
  # currency is any ISO 4217 shape, so a deposit in USD at a restaurant that publishes EUR passes every check; nor is
  # the number of decimals tied to the currency.
  P09:
    promise: "A deposit, when taken, is in the restaurant's single published currency, is a positive amount with at most 2 decimal places, and equals the per-guest deposit amount stated in the answer times the party size."
    status: workaround
    by: [definitions.deposit_amount, definitions.deposit_per_guest, definitions.currency, rules.deposit_has_terms, rules.deposit_is_per_guest]
    hole: B4
  # Workaround: booked carries a confirmation with status (const CONFIRMED), reference, time_zone and duration_minutes
  # required, and confirms_the_request ties the restaurant, the start, the local date and time and the party size to
  # the request. The amount charged is not in the contract: the charge with the deposit token is an effect that no
  # input or output holds, so a core can charge a party of 10 and answer no deposit_amount.
  P10:
    promise: "A successful create returns status CONFIRMED with the booking reference, restaurant id, local start time, time zone, party size, booked duration in minutes and any deposit amount charged."
    status: workaround
    by: [operations.create_booking, definitions.booked, definitions.confirmation, definitions.status, definitions.reference, definitions.time_zone, definitions.duration_minutes, definitions.deposit_amount, rules.confirms_the_request]
    hole: A2
  # Workaround: each code is an output object, named by its description, and the rules of each operation's outputs give
  # one answer to one request. Not declared: a refusal carries no message (an object has no message, only a failed
  # rule has one); a malformed request is an input rejection, not INVALID_REQUEST; and that a refusal changes nothing
  # is the shell's: a refusal holds no record to store, but no generated check sees what the shell writes.
  P11:
    promise: "Every refusal carries exactly one error code from the published list (INVALID_REQUEST, OUTSIDE_BOOKING_WINDOW, NO_AVAILABILITY, DEPOSIT_REQUIRED, PAYMENT_DECLINED, PARTY_TOO_LARGE_FOR_ONLINE, BOOKING_NOT_FOUND, INVALID_STATE, CHANGE_DEADLINE_PASSED, FORBIDDEN) and a human-readable message, and a refused request creates or changes nothing."
    status: workaround
    by: [definitions.invalid_request, definitions.outside_booking_window, definitions.no_availability, definitions.deposit_required, definitions.payment_declined, definitions.party_too_large_for_online, definitions.booking_not_found, definitions.invalid_state, definitions.change_deadline_passed, definitions.forbidden]
    hole: C3
  # Workaround: up to 5 is maxItems 5 on alternatives; offers_nearby_times states the same party size, a start within
  # 2 hours of the requested one (both edges included) and the same local date. alternatives_at_their_local_time ties
  # each alternative's local date and time to its starts_at in the zone of the refusal, and requested_start_in_the_zone
  # the requested starts_at to the requested local date and time in that zone, so in that zone each alternative is on
  # the requested date. Not declared: that zone is the core's choice, not the restaurant's (P03). For a Paris
  # restaurant, a request for 23:45 with a starts_at of 23:45 UTC answered with time_zone Europe/London passes with an
  # alternative at 23:15 UTC named 23:15 on the requested date, which is 00:15 of the next day in Paris.
  P12:
    promise: "A NO_AVAILABILITY refusal may carry up to 5 alternative start times, each on the same date, within 2 hours of the requested time and for the same party size."
    status: workaround
    by: [definitions.no_availability, definitions.alternatives, definitions.alternative, rules.offers_nearby_times, rules.alternatives_at_their_local_time, rules.requested_start_in_the_zone, operations.create_booking]
    hole: D3
  # Workaround: state is an enum, required in booking, and each move is a rule over the stored state and the record to
  # store (was_confirmed and is_seated, was_seated and is_completed, …); CANCELLED, COMPLETED and NO_SHOW have no move
  # out. The moves hold for each call, not for the table: two calls that load the same CONFIRMED booking at once, a
  # seat and a cancel, both pass, and the second write turns the SEATED record into CANCELLED. The generated table
  # checks each row, not the move from the row before.
  P13:
    promise: "A booking is always in exactly one of the states CONFIRMED, SEATED, COMPLETED, CANCELLED or NO_SHOW, and the only allowed moves are CONFIRMED to SEATED, CANCELLED or NO_SHOW, and SEATED to COMPLETED; CANCELLED, COMPLETED and NO_SHOW are final."
    status: workaround
    by: [definitions.state, definitions.booking, rules.was_confirmed, rules.was_seated, rules.is_seated, rules.is_completed, rules.is_no_show, rules.is_confirmed, rules.records_the_cancellation, operations.seat_booking, operations.complete_booking, operations.cancel_booking, operations.mark_no_show, operations.change_booking]
    hole: C3
  # Workaround: change_booking and cancel_booking answer invalid_state when the booking was not CONFIRMED and
  # change_deadline_passed when the call is less than 2 hours before the stored start, and their other answers hold
  # was_confirmed and two_hours_before_start. The deadline reads stored_booking.starts_at, and local_start_is_starts_at
  # on booking rejects a stored booking whose starts_at is not its local date and time in its own time zone. But that
  # zone is the core's choice (P03): a Paris booking for 19:30 stored with time_zone America/Noronha and starts_at
  # 22:30Z keeps every rule, and its deadline is 3 hours late in Paris.
  P14:
    promise: "A guest may change the date, time or party size, or cancel, only while the booking is CONFIRMED and at least 2 hours before its start time, otherwise the request is refused with CHANGE_DEADLINE_PASSED or INVALID_STATE."
    status: workaround
    by: [operations.change_booking, operations.cancel_booking, rules.two_hours_before_start, rules.less_than_two_hours_before_start, rules.was_confirmed, rules.was_not_confirmed, rules.was_neither_confirmed_nor_cancelled, rules.local_start_is_starts_at, definitions.booking, definitions.stored_booking, definitions.change_deadline_passed, definitions.invalid_state]
    hole: D3
  # Workaround: refunds_by_the_deadline states no refund with no deposit, the full deposit 24 hours or more before the
  # start and nothing later, so never more than the deposit. The window reads stored_booking.starts_at, and
  # local_start_is_starts_at on booking ties it to the local date and time in the booking's own time zone. But that
  # zone is the core's choice (P03), so the 24 hours can be counted to a start that is not the restaurant's.
  P15:
    promise: "A cancellation made 24 hours or more before the start time refunds the full deposit, a later one refunds nothing, and a refund is never more than the deposit paid."
    status: workaround
    by: [operations.cancel_booking, rules.refunds_by_the_deadline, rules.local_start_is_starts_at, definitions.booking, definitions.stored_booking, definitions.refund_amount, definitions.deposit_amount]
    hole: D3
  # Workaround: staff_may_act holds on mark_no_show's change and staff_may_not_act on forbidden, and
  # fifteen_minutes_after_start on the change (cannot_be_marked_no_show on invalid_state). The window reads
  # stored_booking.starts_at, and local_start_is_starts_at on booking ties it to the local date and time in the
  # booking's own time zone. But that zone is the core's choice (P03), so the 15 minutes can be counted from a start
  # that is not the restaurant's.
  P16:
    promise: "A booking can be marked NO_SHOW only by restaurant staff and only from 15 minutes after its start time onward."
    status: workaround
    by: [operations.mark_no_show, rules.staff_may_act, rules.staff_may_not_act, rules.fifteen_minutes_after_start, rules.cannot_be_marked_no_show, rules.local_start_is_starts_at, definitions.booking, definitions.stored_booking, definitions.caller, definitions.role]
    hole: D3
  # Workaround: the first call with the key is data in the input: when the shell gives one from the last 24 hours
  # (first_call_has_the_key, first_call_is_recent), the same body gets repeated, the first confirmation with no record or
  # event, and another body gets invalid_request. The shell finds the first call itself, with no lock: two simultaneous
  # calls with one key both get no first call, both are booked, and the deposit is charged twice.
  P17:
    promise: "Repeating a create request with the same idempotency key within 24 hours returns the original answer and booking reference without creating a second booking or charging a second deposit, and reusing a key with a different request body is refused with INVALID_REQUEST."
    status: workaround
    by: [operations.create_booking, definitions.first_call, definitions.repeated, definitions.invalid_request, definitions.idempotency_key, rules.repeats_the_first_answer, rules.reuses_the_key, rules.is_not_a_repeat]
    hole: C2
  # Workaround: the record stores the refund and the time of a cancellation (records_the_cancellation,
  # cancellation_is_recorded), and a cancellation of a CANCELLED booking answers already_cancelled, the stored refund and
  # time, with no record or event (repeats_the_cancellation). "Does not refund again" is not stated: the refund is an
  # effect that no output holds, and two simultaneous cancellations both load a CONFIRMED booking, both answer cancelled,
  # and both refund.
  P18:
    promise: "Cancelling a booking that is already CANCELLED returns success with the same cancellation details and does not refund again."
    status: workaround
    by: [operations.cancel_booking, definitions.already_cancelled, rules.repeats_the_cancellation, rules.records_the_cancellation, rules.cancellation_is_recorded]
    hole: C2
  # Declared: the caller and the booking as stored are in the input, and names_the_booking ties the stored booking to
  # the reference. Every answer that reads or changes a booking holds caller_may_act (a guest who presents the email or
  # the phone of the booking, or staff whose restaurant is the booking's), or staff_may_act for the staff-only moves;
  # forbidden holds the negation. The record keeps the email and the phone of the contact (records_the_confirmation)
  # and no change can alter them or the restaurant (applies_the_change, keeps_all_but_the_state).
  P19:
    promise: "A guest can read, change or cancel only bookings whose reference and contact email or phone they present, while restaurant staff can read and act on any booking of their own restaurant and never on another restaurant's bookings."
    status: declared
    by: [definitions.caller, definitions.role, definitions.booking_ref, definitions.change_request, definitions.forbidden, rules.names_the_booking, rules.caller_may_act, rules.caller_may_not_act, rules.staff_may_act, rules.staff_may_not_act, rules.records_the_confirmation, rules.applies_the_change, rules.keeps_all_but_the_state, operations.get_booking, operations.change_booking, operations.cancel_booking, operations.seat_booking, operations.complete_booking, operations.mark_no_show]
  # Declared: each output that holds a record to store (booked, booking_change, cancelled) requires exactly one
  # booking_event, and the outputs that change nothing (repeated, already_cancelled, the refusals) have none. The rule
  # event_is_<kind> gives each operation its event type, and event_describes_the_booking makes the event carry the
  # reference, restaurant, new state, party size, local date, time and time zone of the record, with occurred_at the
  # time of the call, in UTC (in_utc). How the shell delivers the event is P21.
  P20:
    promise: "Every state change publishes exactly one event (BookingCreated, BookingChanged, BookingCancelled, BookingSeated, BookingCompleted or BookingNoShow) carrying the booking reference, restaurant id, new state, party size, local start time with time zone and an event timestamp in UTC."
    status: declared
    by: [definitions.booking_event, definitions.event_type, definitions.occurred_at, definitions.booked, definitions.booking_change, definitions.cancelled, rules.event_describes_the_booking, rules.event_is_created, rules.event_is_changed, rules.event_is_cancelled, rules.event_is_seated, rules.event_is_completed, rules.event_is_no_show, operations.create_booking, operations.change_booking, operations.cancel_booking, operations.seat_booking, operations.complete_booking, operations.mark_no_show]
  # Workaround: event_id is a required UUID. Its uniqueness, delivery at least once and the order per booking are the
  # shell's: the manifest has no outbox, and the core can give two events one id with every check passing.
  P21:
    promise: "Events are delivered at least once, each carries a unique event id for de-duplication, and events for the same booking are delivered in the order the changes happened."
    status: workaround
    by: [definitions.event_id, definitions.booking_event]
    hole: D4
  # Declared: booking_event has no property for the name, the email or the phone, and the check refuses a property
  # that an object does not list; the guest is guest_id, a UUID.
  P22:
    promise: "Personal guest contact details are never included in published events, which refer to the guest only by an opaque guest id."
    status: declared
    by: [definitions.booking_event, definitions.guest_id]
  # Declared: each time other than the local date and time (starts_at, cancelled_at, occurred_at, now, called_at) is a
  # string with format date-time and the rule in_utc, a trailing Z.
  P23:
    promise: "All timestamps other than the booking's local start time are given in UTC in ISO 8601 format with a trailing Z."
    status: declared
    by: [definitions.starts_at, definitions.cancelled_at, definitions.occurred_at, definitions.now, definitions.called_at, rules.in_utc]
  # Workaround: compatibility callers ignore-unknown states that callers ignore what they do not know, and diff refuses
  # a removed or changed property or output within the major version. With it, diff also accepts a new output (a new
  # error code) or a new choice in an output within the major version, which the promise does not allow. The notice of
  # 6 months is how long the operator runs the old version, which nothing that urn-forge builds can check.
  P24:
    promise: "Within a major version the contract only adds optional request fields, new answer fields and new event fields, callers must ignore fields they do not know, and a removed or changed field or error code requires a new major version announced at least 6 months before the old one is withdrawn."
    status: workaround
    by: [manifest.version, manifest.compatibility]
    hole: E4
