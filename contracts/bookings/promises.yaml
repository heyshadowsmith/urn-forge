contract: bookings
description: "Lets guests and restaurant staff book, change and cancel tables at a restaurant for a given date, time and party size, with deposits for larger parties."
promises:
  # The shape of the reference is declared; that a reference is never reused is not.
  P01:
    promise: "A booking reference is exactly 8 characters drawn from upper-case letters A-Z (excluding I and O) and digits 2-9, and is never reused for another booking."
    status: workaround
    by: [booking.field.reference]
    hole: C1
  # The range 1 to 20 is on the field; create_booking requires fewer than 13 guests, otherwise PARTY_TOO_LARGE_FOR_ONLINE.
  P02:
    promise: "A party size is a whole number from 1 to 20, and requests for 13 or more guests are refused with PARTY_TOO_LARGE_FOR_ONLINE so they can be handled by phone."
    status: declared
    by: [booking.field.party_size, booking.error.party_too_large_for_online, booking.operation.create_booking]
  # The 15-minute boundary and the time zone in each answer are declared; that the time is in the restaurant's zone, and that the name is a real IANA zone, are not.
  P03:
    promise: "A booking time is given as a local date and time on a 15-minute boundary (minutes 00, 15, 30 or 45) in the restaurant's IANA time zone, and every answer carries that time zone name alongside the time."
    status: workaround
    by: [booking.field.local_date, booking.field.local_time, booking.field.time_zone, booking.entity.confirmation, booking.entity.booking]
    hole: D3
  # The invariant states "email or phone", but the generated type has both as optional, not a union.
  P04:
    promise: "A guest's contact must include a name of 1 to 100 characters and at least one of an email address or an E.164 phone number of at most 15 digits."
    status: workaround
    by: [guest.entity.contact, guest.field.name, guest.field.email, guest.field.phone, guest.invariant.email_or_phone]
    hole: B1
  P05:
    promise: "Special requests are free text of at most 500 characters, and dietary tags, if given, are a list of at most 10 distinct values from a fixed published set such as vegetarian, vegan, gluten_free, nut_allergy and halal."
    status: declared
    by: [booking.field.special_requests, booking.field.dietary_tag, booking.entity.create_request]
  P06:
    promise: "A create-booking request must contain the restaurant id, local date and time, party size, guest contact and a client-generated idempotency key of 16 to 64 characters."
    status: declared
    by: [booking.entity.create_request, booking.field.restaurant_id, booking.field.local_date, booking.field.local_time, booking.field.party_size, guest.entity.contact, booking.field.idempotency_key]
  # The error is declared. The window is not, even with now: the start is a local date and time in the restaurant's
  # IANA zone (P03), and a rule cannot turn a date, a local time and a zone into an instant, nor a timestamp into a date
  # (D3). A UTC starts_at that the shell computes would let `now >= input.starts_at - 90 days and now <= input.starts_at
  # - 2 hours` hold, but nothing would tie starts_at to local_date, local_time and time_zone, so a wrong starts_at would
  # break the promise with every check green. A bound on local_date with today (e.g. local_date >= today + 2) is safe for
  # any zone but refuses valid bookings, so it is not this window.
  P07:
    promise: "A booking can be made no earlier than 2 hours and no later than 90 days before its start time, and requests outside that window are refused with OUTSIDE_BOOKING_WINDOW."
    status: workaround
    by: [booking.error.outside_booking_window]
    hole: D3
  # create_booking requires fewer than 7 guests or a deposit token, otherwise DEPOSIT_REQUIRED.
  P08:
    promise: "A party of 7 or more guests must include a deposit payment token in the request, otherwise the request is refused with DEPOSIT_REQUIRED."
    status: declared
    by: [booking.field.deposit_token, booking.error.deposit_required, booking.operation.create_booking]
  # Positive with 2 decimals is declared; the single currency of the restaurant is not, and a rule cannot multiply the per-guest amount by the party size.
  P09:
    promise: "A deposit, when taken, is in the restaurant's single published currency, is a positive amount with at most 2 decimal places, and equals the per-guest deposit amount stated in the answer times the party size."
    status: workaround
    by: [booking.field.deposit_amount, booking.field.deposit_per_guest, booking.field.currency, booking.invariant.deposit_has_terms]
    hole: B4
  P10:
    promise: "A successful create returns status CONFIRMED with the booking reference, restaurant id, local start time, time zone, party size, booked duration in minutes and any deposit amount charged."
    status: declared
    by: [booking.operation.create_booking, booking.entity.confirmation, booking.field.confirmed_state, booking.field.reference, booking.field.time_zone, booking.field.duration_minutes, booking.field.deposit_amount]
  # Each code is a declared error with a message; a malformed request is an input rejection, not the code INVALID_REQUEST, and that a refusal creates or changes nothing is not stated.
  P11:
    promise: "Every refusal carries exactly one error code from the published list (INVALID_REQUEST, OUTSIDE_BOOKING_WINDOW, NO_AVAILABILITY, DEPOSIT_REQUIRED, PAYMENT_DECLINED, PARTY_TOO_LARGE_FOR_ONLINE, BOOKING_NOT_FOUND, INVALID_STATE, CHANGE_DEADLINE_PASSED, FORBIDDEN) and a human-readable message, and a refused request creates or changes nothing."
    status: workaround
    by: [booking.error.invalid_request, booking.error.outside_booking_window, booking.error.no_availability, booking.error.deposit_required, booking.error.payment_declined, booking.error.party_too_large_for_online, booking.error.booking_not_found, booking.error.invalid_state, booking.error.change_deadline_passed, booking.error.forbidden]
    hole: C3
  # Up to 5 alternative times are declared; that each is on the same date, within 2 hours of the requested time and for the same party size is a rule over the items of a list (A1), and in an error, which conditions do not read.
  P12:
    promise: "A NO_AVAILABILITY refusal may carry up to 5 alternative start times, each on the same date, within 2 hours of the requested time and for the same party size."
    status: workaround
    by: [booking.error.no_availability]
    hole: A2
  P13:
    promise: "A booking is always in exactly one of the states CONFIRMED, SEATED, COMPLETED, CANCELLED or NO_SHOW, and the only allowed moves are CONFIRMED to SEATED, CANCELLED or NO_SHOW, and SEATED to COMPLETED; CANCELLED, COMPLETED and NO_SHOW are final."
    status: declared
    by: [booking.field.state, booking.operation.seat_booking, booking.operation.complete_booking, booking.operation.cancel_booking, booking.operation.mark_no_show]
  # "Only while CONFIRMED" is declared: both operations change a booking from CONFIRMED only (cancel also accepts a repeat on a CANCELLED booking, P18), otherwise INVALID_STATE. "At least 2 hours before" is not, even with now: the
  # start is local to the restaurant's zone, and `now <= current.starts_at - 2 hours` on a stored UTC starts_at would hold
  # on a value that no rule ties to local_date, local_time and time_zone (D3). The core converts the zone and refuses.
  P14:
    promise: "A guest may change the date, time or party size, or cancel, only while the booking is CONFIRMED and at least 2 hours before its start time, otherwise the request is refused with CHANGE_DEADLINE_PASSED or INVALID_STATE."
    status: workaround
    by: [booking.operation.change_booking, booking.operation.cancel_booking, booking.error.change_deadline_passed, booking.error.invalid_state]
    hole: D3
  # cancel_booking ensures the refund is zero or at most the stored deposit. Full or nothing at 24 hours before the start
  # is not declared, even with now: the start is local to the restaurant's zone, and an ensures on `now` against a stored
  # UTC starts_at would hold on a value that no rule ties to local_date, local_time and time_zone (D3).
  P15:
    promise: "A cancellation made 24 hours or more before the start time refunds the full deposit, a later one refunds nothing, and a refund is never more than the deposit paid."
    status: workaround
    by: [booking.operation.cancel_booking, booking.field.refund_amount]
    hole: D3
  # "Only by restaurant staff" is declared: mark_no_show allows only a caller with role staff of the booking's restaurant,
  # otherwise FORBIDDEN, and a guest is refused in a scenario. "From 15 minutes after its start time" needs the current
  # time and the start as an instant: the start is local to the restaurant's zone, and `now >= current.starts_at + 15
  # minutes` on a stored UTC starts_at would hold on a value that no rule ties to local_date, local_time and time_zone
  # (D3). The core converts the zone and refuses earlier with INVALID_STATE.
  P16:
    promise: "A booking can be marked NO_SHOW only by restaurant staff and only from 15 minutes after its start time onward."
    status: workaround
    by: [booking.operation.mark_no_show, auth.entity.caller, auth.field.role, booking.error.forbidden, booking.error.invalid_state]
    hole: D3
  # create_booking has idempotency { key: input.idempotency_key, window: 24 hours, otherwise: invalid_request }, and the
  # contract uses the Postgres extra, so the store file has runOnce and the answers table "idempotency"."bookings": a
  # repeat with the same key and body in 24 hours returns the stored first answer (the same reference) and runs nothing,
  # so no second booking, no second booking_created and no second deposit, which is charged only by the run of
  # create_booking (its payment_declined, its deposit_amount); the same key with another body answers invalid_request,
  # filled from the input (the code INVALID_REQUEST); the primary key makes a concurrent repeat wait or fail. The key has
  # no owner, as the promise names none. Scenarios repeat with the same body (first answer, no event), just before and at
  # 24 hours, and with another body (refused). "Original answer" is a success: a refusal is not stored, so a repeat of a
  # refused request runs again (a scenario shows it). That the shell calls runOnce, and charges the deposit inside its
  # run, is the shell's, as for insertEvents (P21).
  P17:
    promise: "Repeating a create request with the same idempotency key within 24 hours returns the original answer and booking reference without creating a second booking or charging a second deposit, and reusing a key with a different request body is refused with INVALID_REQUEST."
    status: declared
    by: [booking.operation.create_booking, booking.field.idempotency_key, booking.error.invalid_request]
  # cancel_booking changes from [CONFIRMED, CANCELLED] to CANCELLED, so a CANCELLED booking is a success that stays
  # CANCELLED, and booking_cancelled is emitted only when current.state = 'CONFIRMED', so a repeat publishes none. The
  # rest is not stated, and `ensures` cannot state it today: (1) "the same cancellation details": the stored booking has
  # no refund_amount or cancelled_at, and adding them would not help, since no rule ties what the first cancellation
  # stores to its answer (the output is a cancellation, not the record, and an ensures cannot name the record after the
  # change), so an ensures `output.cancelled_at = current.cancelled_at` would hold on whatever the shell stored; (2) "does
  # not refund again": no element models the refund itself (no refund event or effect); refund_amount is a field of the
  # answer, which a repeat repeats, so a shell that refunds on the answer would refund twice. idempotency does not fit:
  # there is no key, and the promise has no window.
  P18:
    promise: "Cancelling a booking that is already CANCELLED returns success with the same cancellation details and does not refund again."
    status: workaround
    by: [booking.operation.cancel_booking]
    hole: C2
  # The caller is a guest or staff, with the restaurant of staff (auth.entity.caller). The stored booking holds the email
  # and the phone of its contact, and a request on a booking (booking_ref, change_request) carries the reference and the
  # email or the phone that a guest presents. get_booking reads the booking (reads), so each operation on a booking has
  # it as current, and each states callers, otherwise FORBIDDEN, checked before the state and before the core:
  # - get_booking, change_booking, cancel_booking allow a guest whose input.reference = current.reference and whose
  #   presented email (or phone) is present and equals the stored one, or staff whose restaurant_id is present and
  #   equals current.restaurant_id;
  # - seat_booking, complete_booking, mark_no_show allow only that staff rule, so a guest only reads, changes or cancels.
  # Scenarios show each rule alone, a guest with no, a wrong or another contact, a guest on a staff operation, staff of
  # another restaurant and staff with no restaurant, all refused. create_booking makes a booking rather than acting on
  # one, so it allows any caller. The core does not check the caller.
  P19:
    promise: "A guest can read, change or cancel only bookings whose reference and contact email or phone they present, while restaurant staff can read and act on any booking of their own restaurant and never on another restaurant's bookings."
    status: declared
    by: [auth.entity.caller, auth.field.role, booking.entity.booking, booking.entity.booking_ref, booking.entity.change_request, booking.operation.get_booking, booking.operation.change_booking, booking.operation.cancel_booking, booking.operation.seat_booking, booking.operation.complete_booking, booking.operation.mark_no_show, booking.error.forbidden]
  # Each changing operation lists its event as { event }, so a success publishes exactly one; cancel_booking only when
  # current.state = 'CONFIRMED' (a repeat changes nothing and publishes none). Each operation ensures the event carries the
  # reference, restaurant id, new state, party size, local date, time and time zone of the change (cancel_booking reads the
  # booking from current). occurred_at is a required UTC timestamp; that it is the time of the change is not in this promise
  # (it would need a clock, E2).
  P20:
    promise: "Every state change publishes exactly one event (BookingCreated, BookingChanged, BookingCancelled, BookingSeated, BookingCompleted or BookingNoShow) carrying the booking reference, restaurant id, new state, party size, local start time with time zone and an event timestamp in UTC."
    status: declared
    by: [booking.event.booking_created, booking.event.booking_changed, booking.event.booking_cancelled, booking.event.booking_seated, booking.event.booking_completed, booking.event.booking_no_show, booking.operation.create_booking, booking.operation.change_booking, booking.operation.cancel_booking, booking.operation.seat_booking, booking.operation.complete_booking, booking.operation.mark_no_show, booking.field.state, event.field.occurred_at]
  # Each event has delivery { id: event_id, orderBy: reference }, and the contract uses the Postgres extra, so the outbox is
  # generated: insertEvents writes the events in the transaction of the change (none is lost), a row stays until
  # markPublished (at least once), event_id is the primary key (unique; the shell gives it through newEventId), and
  # nextEvents gives the events of one reference by a sequence 1 higher each time (the order of the changes). The transport
  # is the user's.
  P21:
    promise: "Events are delivered at least once, each carries a unique event id for de-duplication, and events for the same booking are delivered in the order the changes happened."
    status: declared
    by: [event.field.event_id, booking.field.reference, booking.event.booking_created, booking.event.booking_changed, booking.event.booking_cancelled, booking.event.booking_seated, booking.event.booking_completed, booking.event.booking_no_show]
  P22:
    promise: "Personal guest contact details are never included in published events, which refer to the guest only by an opaque guest id."
    status: declared
    by: [booking.event.booking_created, booking.event.booking_changed, booking.event.booking_cancelled, booking.event.booking_seated, booking.event.booking_completed, booking.event.booking_no_show, guest.field.guest_id]
  P23:
    promise: "All timestamps other than the booking's local start time are given in UTC in ISO 8601 format with a trailing Z."
    status: declared
    by: [event.field.occurred_at, booking.field.cancelled_at]
  # Within the major version, urn-forge diff refuses a removed or changed field or error code, and a new error code
  # (the header does not state that callers ignore unknown values). The notice for a new major version is how long
  # the operator runs the old one, which nothing that urn-forge builds can check.
  P24:
    promise: "Within a major version the contract only adds optional request fields, new answer fields and new event fields, callers must ignore fields they do not know, and a removed or changed field or error code requires a new major version announced at least 6 months before the old one is withdrawn."
    status: workaround
    by: [manifest.version]
    hole: E4
