contract: claims
description: "Lets employees submit expense claims with receipt lines for reimbursement, managers approve or reject them, and finance pay them."
promises:
  # Workaround: the shape is the pattern of claim_id; the request of create_draft (draft) has no claim id
  # and its answer (claim) has one, so the core assigns it; claim is a Postgres table with claim_id as its
  # primary key, so two stored claims never share an id. Nothing keeps the ids that were used: once a
  # claim's row is deleted, its id can be given to a new claim and every check passes.
  P01:
    promise: "A claim id is the prefix \"CLM-\" followed by exactly 10 digits, is assigned by the domain on creation, and is never reused for another claim."
    status: workaround
    by: [definitions.claim_id, definitions.draft, definitions.claim, operations.create_draft]
    hole: C1
  # Each money amount is an integer of cents (decision 18: an exact amount is an integer of its smallest
  # unit), so it has at most 2 fraction digits; currency is the enum of the ISO 4217 codes the domain
  # accepts, CHF, EUR, GBP and USD, each with 2 minor units (urn-forge ships no ISO 4217 list). A line
  # amount has exclusiveMinimum 0 and maximum 1000000 (10000.00). A line has no currency of its own and
  # belongs to one claim with one currency, and each event that carries a total carries the currency of
  # the claim, which its rule equals.
  P02:
    promise: "Every money amount is a decimal with at most 2 fraction digits in an ISO 4217 three-letter currency code, and every line amount is greater than 0.00 and at most 10000.00."
    status: declared
    by: [definitions.amount, definitions.total, definitions.currency, definitions.line, definitions.claim]
  # The enum of category.
  P03:
    promise: "A line's category is exactly one of TRAVEL, LODGING, MEALS, MILEAGE, SUPPLIES, TRAINING or OTHER."
    status: declared
    by: [definitions.category]
  # lines has minItems 1 and maxItems 50. A line has no currency of its own, so it uses the currency of
  # the claim by its shape. The rule total_is_sum on claim holds for every claim the harness sees: the
  # stored claim of each input, and the claim of each answer; check() holds it before a write (the
  # generated SQL lists it as checked by the harness).
  P04:
    promise: "A claim has 1 to 50 lines, all lines of one claim use the same currency as the claim, and the claim total always equals the sum of its line amounts."
    status: declared
    by: [definitions.lines, definitions.line, definitions.claim, rules.total_is_sum]
  # The rule lines_dated_for_submission on claim: each expense of a claim that left DRAFT is on the day
  # of its submitted_at (in UTC) or on one of the 90 days before. submit_claim sets submitted_at to the
  # time of the call (moves_to_submitted), its input rule lines_dated_for_now refuses a draft whose lines
  # break it, and the later changes keep the lines and the time (keeps_the_claim, keeps_the_submission).
  P05:
    promise: "A line's expense date is never later than the claim's submission date and never more than 90 days before it."
    status: declared
    by: [rules.lines_dated_for_submission, rules.lines_dated_for_now, rules.moves_to_submitted, rules.keeps_the_claim, rules.keeps_the_submission, definitions.claim, definitions.submission, operations.submit_claim]
  # Workaround: receipt_above_25 lets a MILEAGE line above 25.00 have no receipt, as P07 forbids one on
  # it; and a receipt is what the caller declares: a hash, a type and a size that do not match the file
  # are accepted.
  P06:
    promise: "A line with an amount above 25.00 must carry a receipt reference, and each receipt file is a PDF, JPEG or PNG of at most 10 MB."
    status: workaround
    by: [rules.receipt_above_25, definitions.receipt, definitions.media_type, definitions.size_bytes]
    hole: B1
  # The rules mileage_has_distance and distance_only_for_mileage on line, and the minimum 1 and maximum
  # 2000 of distance_km, whose description gives the unit: no line that breaks a part passes a check.
  P07:
    promise: "A MILEAGE line must carry a distance in kilometres between 1 and 2000 and must not carry a receipt, while every other category must not carry a distance."
    status: declared
    by: [definitions.distance_km, definitions.line, rules.mileage_has_distance, rules.distance_only_for_mileage]
  # minLength and maxLength of purpose and description.
  P08:
    promise: "A claim's purpose text is 1 to 500 characters and a line description is 1 to 200 characters."
    status: declared
    by: [definitions.purpose, definitions.description]
  # The eight operations; the requests of the changes (draft_edit, submission, change, rejection) require
  # claim_id and version, and the request of get_claim (lookup) requires claim_id.
  P09:
    promise: "Callers can create a draft claim, edit a draft, submit, withdraw, approve, reject, mark paid, and get a claim by id, and each change request names the claim id and the version the caller last read."
    status: declared
    by: [operations.create_draft, operations.edit_draft, operations.submit_claim, operations.withdraw_claim, operations.approve_claim, operations.reject_claim, operations.mark_paid, operations.get_claim, definitions.draft_edit, definitions.submission, definitions.change, definitions.rejection, definitions.lookup]
  # Workaround: state is an enum, and each success holds a rule on the stored state and one on the new
  # state, which give exactly the moves (create gives DRAFT; report_overdue keeps the state). The rules
  # read the stored claim that the shell loaded, and the generated SQL does not compare the stored state
  # or version at the write: two changes that load one SUBMITTED claim at once (approve and withdraw)
  # both pass, and the second write moves WITHDRAWN to APPROVED.
  P10:
    promise: "A claim is in exactly one state of DRAFT, SUBMITTED, APPROVED, REJECTED, WITHDRAWN or PAID, and the only allowed moves are DRAFT to SUBMITTED, SUBMITTED to APPROVED, REJECTED or WITHDRAWN, REJECTED to DRAFT, and APPROVED to PAID."
    status: workaround
    by: [definitions.state, rules.was_draft_or_rejected, rules.was_draft, rules.was_submitted, rules.was_approved, rules.creates_the_draft, rules.edits_the_draft, rules.moves_to_submitted, rules.moves_to_withdrawn, rules.moves_to_approved, rules.moves_to_rejected, rules.moves_to_paid, rules.marks_the_report, operations.create_draft, operations.edit_draft, operations.submit_claim, operations.withdraw_claim, operations.approve_claim, operations.reject_claim, operations.mark_paid, operations.report_overdue]
    hole: C3
  # Workaround: no success starts from PAID or WITHDRAWN, and each change after DRAFT keeps the lines,
  # total and currency (keeps_the_claim). But edit_draft replaces the lines of a REJECTED claim, which
  # has left DRAFT, and two changes that load one claim at once both pass (see P10), so a late write can
  # move a PAID or WITHDRAWN claim.
  P11:
    promise: "PAID and WITHDRAWN are final states, and once a claim leaves DRAFT its lines and amounts cannot be changed."
    status: workaround
    by: [rules.was_submitted, rules.was_approved, rules.was_draft_or_rejected, rules.keeps_the_claim, operations.submit_claim, operations.withdraw_claim, operations.approve_claim, operations.reject_claim, operations.mark_paid, operations.edit_draft]
    hole: C3
  # The answer of each change is the claim (with claim_id, state, total, currency and version), alone or
  # with its event. edits_the_draft and claim_at_next_version state that the new version is the version of
  # the request plus 1, and version_matches that the request names the stored version; creates_the_draft
  # states that a new claim is at version 1.
  P12:
    promise: "A successful request answers with the claim id, its new state, its total and currency, and its new version number, which is 1 higher than the version sent."
    status: declared
    by: [definitions.claim, definitions.submitted, definitions.withdrawn, definitions.approved, definitions.rejected, definitions.paid, rules.creates_the_draft, rules.next_version, rules.claim_at_next_version, rules.version_matches, operations.create_draft, operations.edit_draft, operations.submit_claim, operations.withdraw_claim, operations.approve_claim, operations.reject_claim, operations.mark_paid]
  # Workaround: a refusal is one output of the operation, not_found, forbidden, invalid_state,
  # version_conflict or duplicate_receipt, with rules that say when it comes back, and it carries no
  # claim, so the shell has nothing to write; an input that breaks a rule is the harness's InputRejected,
  # with a message for each failure. The codes on the wire (INVALID_REQUEST, NOT_FOUND, ...) are names that
  # the shell gives the outputs and InputRejected, and a refusal object holds no message, so a shell can
  # send another code or no message while every check passes.
  P13:
    promise: "A refused request answers with exactly one of the codes INVALID_REQUEST, NOT_FOUND, FORBIDDEN, INVALID_STATE, VERSION_CONFLICT or DUPLICATE_RECEIPT, plus a human-readable message, and changes nothing."
    status: workaround
    by: [definitions.not_found, definitions.forbidden, definitions.invalid_state, definitions.version_conflict, definitions.duplicate_receipt, operations.create_draft, operations.edit_draft, operations.submit_claim, operations.withdraw_claim, operations.approve_claim, operations.reject_claim, operations.mark_paid, operations.get_claim, operations.report_overdue]
    hole: A2
  # reason is 10 to 500 characters and required in rejection. The answer rejected requires the claim and
  # the event claim_rejected; moves_to_rejected states claim.reason = the reason of the request, and
  # tells_the_rejection the same of the event. Published is the delivery of P21.
  P14:
    promise: "A rejection must include a reason of 10 to 500 characters, and the answer and the published event carry that reason."
    status: declared
    by: [definitions.reason, definitions.rejection, definitions.rejected, definitions.claim_rejected, rules.moves_to_rejected, rules.tells_the_rejection, operations.reject_claim]
  # Workaround: the event claim_paid carries the total and currency of the approved claim (keeps_the_claim,
  # tells_the_payment), and a claim is paid only from APPROVED. Two mark_paid calls that load one APPROVED
  # claim at once both answer paid (see P10), so a claim can be paid twice while every check passes.
  P15:
    promise: "A payment amount always equals the approved claim total in the claim's currency, and a claim is never paid twice."
    status: workaround
    by: [rules.was_approved, rules.keeps_the_claim, rules.moves_to_paid, rules.tells_the_payment, definitions.claim_paid, operations.mark_paid]
    hole: C3
  # Workaround: each request of a change can carry idempotency_key, but nothing keeps the first answer:
  # a repeat with the same key runs the operation again.
  P16:
    promise: "A request carrying an idempotency key already used by the same caller within 24 hours returns the original answer without making a second change."
    status: workaround
    by: [definitions.idempotency_key, definitions.draft, definitions.draft_edit, definitions.submission, definitions.change, definitions.rejection, definitions.overdue_check]
    hole: C2
  # Workaround: duplicate_receipt comes back, and only it, when a receipt of the request is on two lines
  # of the request or in receipts_in_use (receipts_are_free, receipt_in_use). receipts_in_use is what the
  # shell found on other claims, and the lines are JSON in the claim table, so nothing in the SQL keeps a
  # receipt on one claim: a shell that loads an incomplete list lets it onto two.
  P17:
    promise: "The same receipt file, by its SHA-256 hash, cannot appear on two lines of claims that are not REJECTED or WITHDRAWN, and an attempt is refused with DUPLICATE_RECEIPT."
    status: workaround
    by: [definitions.sha256, definitions.receipts_in_use, definitions.duplicate_receipt, rules.receipts_are_free, rules.receipt_in_use, operations.create_draft, operations.edit_draft]
    hole: C1
  # Workaround: the rules on the caller state each part (caller_creates_own_claim, caller_owns_the_claim,
  # caller_may_read with answers_the_stored_claim). "Their manager" is the manager_id that the shell read
  # from the employee directory when the claim was created: when the manager changes, the former manager
  # can still read the claim.
  P18:
    promise: "Only the employee who owns a claim may create, edit, submit or withdraw it, and only that employee, their manager and finance users may read it."
    status: workaround
    by: [definitions.caller, definitions.role, definitions.manager_id, definitions.claim, definitions.forbidden, rules.caller_creates_own_claim, rules.caller_owns_the_claim, rules.caller_may_read, rules.answers_the_stored_claim, operations.create_draft, operations.edit_draft, operations.submit_claim, operations.withdraw_claim, operations.get_claim]
    hole: D1
  # Workaround: "the claimant's manager" is caller.employee_id = stored_claim.manager_id, and manager_id
  # comes from a directory outside the contract when the claim is created: a stale or wrong manager_id
  # lets another person decide.
  P19:
    promise: "Only the claimant's manager may approve or reject a claim, a caller may never approve their own claim, and only finance users may mark a claim paid."
    status: workaround
    by: [definitions.caller, definitions.role, definitions.manager_id, definitions.forbidden, rules.caller_is_the_other_manager, rules.caller_is_the_manager, rules.caller_is_finance, operations.approve_claim, operations.reject_claim, operations.mark_paid]
    hole: D1
  # Workaround: the answers of the five changes require their event, and the tells_ rules tie its claim
  # id, owner, total, currency and state to the claim, the actor to the request, and the time to the time
  # of the call. But edit_draft moves a REJECTED claim back to DRAFT, a change of state that no event tells.
  P20:
    promise: "On each state change the domain publishes a ClaimSubmitted, ClaimApproved, ClaimRejected, ClaimWithdrawn or ClaimPaid event carrying the claim id, employee id, total, currency, new state, actor id and timestamp."
    status: workaround
    by: [definitions.claim_submitted, definitions.claim_approved, definitions.claim_rejected, definitions.claim_withdrawn, definitions.claim_paid, rules.tells_the_submission, rules.tells_the_approval, rules.tells_the_rejection, rules.tells_the_withdrawal, rules.tells_the_payment, operations.submit_claim, operations.approve_claim, operations.reject_claim, operations.withdraw_claim, operations.mark_paid]
    hole: C3
  # Delivery at least once and in order is behaviour, not data: the manifest has no delivery and no
  # outbox. Each event has an event_id, but that two events never share one is not stated.
  P21:
    promise: "Events are delivered at least once, carry a unique event id for deduplication, and events of one claim are delivered in the order the changes happened."
    status: not-declarable
    hole: D4
  # Every time is a utc_time: format date-time and the pattern Z$; an expense date has format date.
  P22:
    promise: "All timestamps are ISO 8601 in UTC, while expense dates are calendar dates without time zone."
    status: declared
    by: [definitions.utc_time, definitions.now, definitions.submitted_at, definitions.overdue_reported_at, definitions.occurred_at, definitions.expense_date]
  # Workaround: claim_is_due states when a claim is due (SUBMITTED for 30 days since submitted_at, not
  # reported since), and the answer keeps the state (marks_the_report) and carries claim_decision_overdue.
  # Nothing calls report_overdue when a claim becomes due: a clock that does not call it reports nothing.
  P23:
    promise: "A claim left in SUBMITTED for 30 days without a decision is reported in a ClaimDecisionOverdue event, and its state is not changed by that."
    status: workaround
    by: [operations.report_overdue, definitions.overdue_check, definitions.overdue_reported, definitions.claim_decision_overdue, rules.claim_is_due, rules.marks_the_report, rules.tells_the_overdue_claim, rules.moves_to_submitted, rules.caller_is_the_clock]
    hole: E3
  # The version is 1.0.0, so urn-forge diff refuses a removal or a rename within the major version.
  # compatibility.callers states that callers ignore what they do not know, so diff accepts a new
  # optional property, output or choice.
  P24:
    promise: "Within a major version, new optional fields, event types, categories or refusal codes may be added, but existing fields, states and codes are never removed or renamed, and callers must ignore unknown fields."
    status: declared
    by: [manifest.compatibility, manifest.version]
