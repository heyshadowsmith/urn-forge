contract: claims
description: "Lets employees submit expense claims with receipt lines for reimbursement, managers approve or reject them, and finance pay them."
promises:
  # The id is never reused: nothing states uniqueness among stored claims.
  P01:
    promise: "A claim id is the prefix \"CLM-\" followed by exactly 10 digits, is assigned by the domain on creation, and is never reused for another claim."
    status: workaround
    by: [claim.field.claim_id, claim.entity.draft, claim.entity.answer]
    hole: C1
  # The currency is only three capital letters, not a code of ISO 4217, and no amount is tied to its currency.
  P02:
    promise: "Every money amount is a decimal with at most 2 fraction digits in an ISO 4217 three-letter currency code, and every line amount is greater than 0.00 and at most 10000.00."
    status: workaround
    by: [line.field.amount, claim.field.total, claim.field.currency]
    hole: B4
  P03:
    promise: "A line's category is exactly one of TRAVEL, LODGING, MEALS, MILEAGE, SUPPLIES, TRAINING or OTHER."
    status: declared
    by: [line.field.category]
  # A line has no currency of its own, so it uses the currency of the claim by its shape. The total is
  # the sum of the lines on the stored claim, and on the answer to a create or an edit; the other changes keep it.
  P04:
    promise: "A claim has 1 to 50 lines, all lines of one claim use the same currency as the claim, and the claim total always equals the sum of its line amounts."
    status: declared
    by: [claim.entity.draft, claim.entity.draft_edit, claim.entity.claim, claim.invariant.total_is_sum, claim.operation.create_draft, claim.operation.edit_draft]
  P05:
    promise: "A line's expense date is never later than the claim's submission date and never more than 90 days before it."
    status: not-declarable
    hole: A1
  # P06 and P07 conflict as written: a MILEAGE line above 25.00 cannot both carry and not carry a receipt.
  # The invariant takes the reading that keeps both: the receipt rule applies to every category but MILEAGE.
  P06:
    promise: "A line with an amount above 25.00 must carry a receipt reference, and each receipt file is a PDF, JPEG or PNG of at most 10 MB."
    status: declared
    by: [line.invariant.receipt_above_25, receipt.entity.receipt, receipt.field.media_type, receipt.field.size_bytes]
  # A line is one type with an optional distance and receipt, not a union of a MILEAGE line and other lines.
  P07:
    promise: "A MILEAGE line must carry a distance in kilometres between 1 and 2000 and must not carry a receipt, while every other category must not carry a distance."
    status: workaround
    by: [line.field.distance_km, line.invariant.mileage_has_distance, line.invariant.distance_only_for_mileage]
    hole: B1
  P08:
    promise: "A claim's purpose text is 1 to 500 characters and a line description is 1 to 200 characters."
    status: declared
    by: [claim.field.purpose, line.field.description]
  P09:
    promise: "Callers can create a draft claim, edit a draft, submit, withdraw, approve, reject, mark paid, and get a claim by id, and each change request names the claim id and the version the caller last read."
    status: declared
    by: [claim.operation.create_draft, claim.operation.edit_draft, claim.operation.submit_claim, claim.operation.withdraw_claim, claim.operation.approve_claim, claim.operation.reject_claim, claim.operation.mark_paid, claim.operation.get_claim, claim.entity.draft_edit, claim.entity.change, claim.entity.rejection]
  P10:
    promise: "A claim is in exactly one state of DRAFT, SUBMITTED, APPROVED, REJECTED, WITHDRAWN or PAID, and the only allowed moves are DRAFT to SUBMITTED, SUBMITTED to APPROVED, REJECTED or WITHDRAWN, REJECTED to DRAFT, and APPROVED to PAID."
    status: declared
    by: [claim.field.state, claim.operation.edit_draft, claim.operation.submit_claim, claim.operation.withdraw_claim, claim.operation.approve_claim, claim.operation.reject_claim, claim.operation.mark_paid, claim.operation.report_overdue]
  # PAID and WITHDRAWN are final by the moves of the state; that the lines and amounts cannot change once a claim leaves DRAFT is not stated.
  P11:
    promise: "PAID and WITHDRAWN are final states, and once a claim leaves DRAFT its lines and amounts cannot be changed."
    status: not-declarable
    hole: C3
  # A create request sends no version; its answer has version 1. The answer to a submission also holds
  # when the claim was submitted (submission_answer), which P23 counts from.
  P12:
    promise: "A successful request answers with the claim id, its new state, its total and currency, and its new version number, which is 1 higher than the version sent."
    status: declared
    by: [claim.entity.answer, claim.entity.rejection_answer, claim.entity.submission_answer, claim.operation.edit_draft, claim.operation.submit_claim, claim.operation.withdraw_claim, claim.operation.approve_claim, claim.operation.reject_claim, claim.operation.mark_paid]
  # INVALID_REQUEST is the rejection of the input, not a declared error; the codes as names on the wire, and that a refusal changes nothing, are not stated.
  P13:
    promise: "A refused request answers with exactly one of the codes INVALID_REQUEST, NOT_FOUND, FORBIDDEN, INVALID_STATE, VERSION_CONFLICT or DUPLICATE_RECEIPT, plus a human-readable message, and changes nothing."
    status: workaround
    by: [claim.error.not_found, claim.error.forbidden, claim.error.invalid_state, claim.error.version_conflict, claim.error.duplicate_receipt]
    hole: A2
  # The reason of the request is required and 10 to 500 characters. reject_claim emits exactly one
  # claim_rejected on each success ({ event }), and its ensures state output.reason = input.reason and
  # event.reason = input.reason. Published is the delivery of P21.
  P14:
    promise: "A rejection must include a reason of 10 to 500 characters, and the answer and the published event carry that reason."
    status: declared
    by: [claim.field.reason, claim.entity.rejection, claim.entity.rejection_answer, claim.event.claim_rejected, claim.operation.reject_claim]
  # A claim is paid only from APPROVED and PAID is final, so it is never paid twice; the payment amount is not tied to the approved total.
  P15:
    promise: "A payment amount always equals the approved claim total in the claim's currency, and a claim is never paid twice."
    status: not-declarable
    hole: C3
  P16:
    promise: "A request carrying an idempotency key already used by the same caller within 24 hours returns the original answer without making a second change."
    status: not-declarable
    hole: C2
  # The refusal is declared; the rule across the receipts of stored claims is not.
  P17:
    promise: "The same receipt file, by its SHA-256 hash, cannot appear on two lines of claims that are not REJECTED or WITHDRAWN, and an attempt is refused with DUPLICATE_RECEIPT."
    status: workaround
    by: [claim.error.duplicate_receipt, receipt.field.sha256]
    hole: C1
  # The shell authenticates the caller (auth.entity.caller: role, employee_id); the callers of each operation
  # decide, before the state and the handler. create_draft: caller.employee_id = input.employee_id; edit_draft,
  # submit_claim, withdraw_claim: caller.employee_id = current.employee_id; get_claim reads the stored claim
  # (reads) and allows the owner, current.manager_id or role finance. Every rule also needs input.actor_id =
  # caller.employee_id, so the actor that the events carry is the caller. Each other caller gets forbidden.
  # The shell's clock (role clock) has no employee_id, and each rule needs caller.employee_id is present,
  # so the clock can call none of these; it can call only report_overdue (P23).
  # The manager is the manager_id stored with the claim, from the employee directory, as the shell gives the record.
  P18:
    promise: "Only the employee who owns a claim may create, edit, submit or withdraw it, and only that employee, their manager and finance users may read it."
    status: declared
    by: [auth.entity.caller, auth.field.role, claim.field.employee_id, claim.field.manager_id, claim.entity.claim, claim.error.forbidden, claim.operation.create_draft, claim.operation.edit_draft, claim.operation.submit_claim, claim.operation.withdraw_claim, claim.operation.get_claim]
  # The stored claim holds manager_id. approve_claim allows caller.employee_id = current.manager_id and
  # caller.employee_id != current.employee_id; reject_claim allows caller.employee_id = current.manager_id;
  # mark_paid allows caller.role = 'finance'; each also needs input.actor_id = caller.employee_id. Each
  # other caller gets forbidden, before the state and the handler.
  P19:
    promise: "Only the claimant's manager may approve or reject a claim, a caller may never approve their own claim, and only finance users may mark a claim paid."
    status: declared
    by: [auth.entity.caller, auth.field.role, claim.field.employee_id, claim.field.manager_id, claim.entity.claim, claim.error.forbidden, claim.operation.approve_claim, claim.operation.reject_claim, claim.operation.mark_paid]
  # Each of the five operations emits exactly one event of its kind ({ event }), and its ensures tie
  # event.claim_id, total, currency and state to the output, employee_id to current and actor_id to the input.
  # Not declared: edit_draft moves a REJECTED claim back to DRAFT, a state change that publishes no event and
  # that none of the five events names. The timestamp is a UTC value of the core, not the time of the change (E2).
  P20:
    promise: "On each state change the domain publishes a ClaimSubmitted, ClaimApproved, ClaimRejected, ClaimWithdrawn or ClaimPaid event carrying the claim id, employee id, total, currency, new state, actor id and timestamp."
    status: workaround
    by: [claim.event.claim_submitted, claim.event.claim_approved, claim.event.claim_rejected, claim.event.claim_withdrawn, claim.event.claim_paid, claim.operation.submit_claim, claim.operation.approve_claim, claim.operation.reject_claim, claim.operation.withdraw_claim, claim.operation.mark_paid, event.field.occurred_at]
    hole: C3
  # Each event has delivery { id: event_id, orderBy: claim_id }; the shell gives the id (newEventId), and
  # the Postgres extra writes the outbox: the id is its primary key, a row stays until markPublished (at
  # least once), and the events of one claim keep their order by a sequence per claim. The transport is the user's.
  P21:
    promise: "Events are delivered at least once, carry a unique event id for deduplication, and events of one claim are delivered in the order the changes happened."
    status: declared
    by: [event.field.event_id, claim.field.claim_id, claim.event.claim_submitted, claim.event.claim_approved, claim.event.claim_rejected, claim.event.claim_withdrawn, claim.event.claim_paid, claim.event.claim_decision_overdue]
  P22:
    promise: "All timestamps are ISO 8601 in UTC, while expense dates are calendar dates without time zone."
    status: declared
    by: [event.field.occurred_at, line.field.expense_date, claim.field.submitted_at, claim.field.overdue_reported_at]
  # The record holds submitted_at: submit_claim ensures output.submitted_at = now in its answer, the shell
  # stores it, and claim.invariant.submitted_has_time (schema and SQL CHECK) keeps it on a SUBMITTED claim.
  # Each submission sets it again, so a claim rejected, edited and submitted again counts from its last
  # submission. report_overdue is a timed change: changes from [SUBMITTED] with no `to` (the runtime keeps
  # the state), due: current.submitted_at is present and (current.overdue_reported_at is absent or
  # current.overdue_reported_at < current.submitted_at) and now >= current.submitted_at + 30 days. The mark
  # overdue_reported_at (ensures output.overdue_reported_at = now) makes it due once per submission; a mark
  # of an earlier submission is older than submitted_at. It emits exactly one claim_decision_overdue
  # (ClaimDecisionOverdue), whose fields its ensures tie to the record and to now, with output.state =
  # current.state. Only the shell's clock (caller.role = 'clock') may call it; selectClaimReportOverdueDue
  # finds the claims that are due, from the same rule, as claim.entity.claim is a table. A call that is not
  # due is a ContractViolation. That the shell runs its clock is the shell's, as the transport of events (P21).
  P23:
    promise: "A claim left in SUBMITTED for 30 days without a decision is reported in a ClaimDecisionOverdue event, and its state is not changed by that."
    status: declared
    by: [claim.operation.report_overdue, claim.event.claim_decision_overdue, claim.field.submitted_at, claim.field.overdue_reported_at, claim.entity.claim, claim.entity.claim_ref, claim.invariant.submitted_has_time, claim.operation.submit_claim, claim.entity.submission_answer, claim.error.clock_only, auth.field.role, auth.entity.caller]
  P24:
    promise: "Within a major version, new optional fields, event types, categories or refusal codes may be added, but existing fields, states and codes are never removed or renamed, and callers must ignore unknown fields."
    status: not-declarable
    hole: E4
