# Ticketing: holds, orders, tickets, transfers, refunds, entry and the cancellation of an event.
#
# Each operation's input carries what the call needs besides the request: the caller (as the shell
# authenticated it), the time of the call, and the stored records that the shell loaded (stored_hold,
# stored_ticket, stored_transfer, stored_order, stored_tickets, and show, the event as it is now). A
# record that the shell did not find is absent. A refusal is an output, and the events of a change
# are properties of its output.
manifest:
  namespace: corpus
  domain: ticketing
  version: 1.0.0
  # Callers ignore a property, an output or a choice that they do not know.
  compatibility:
    callers: ignore-unknown

definitions:
  # Shared kinds of values.
  uuid:
    description: A UUID in lowercase hexadecimal, such as 6f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f
    type: string
    rules:
      - pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

  utc_time:
    description: An ISO 8601 date and time in UTC, with the designator Z, such as 2026-12-01T19:00:00Z
    type: string
    rules:
      - format: date-time
      - in_utc
      - is_a_real_time

  idempotency_key:
    description: A key that the caller chooses for one request, so that a repeated request gives the original answer
    type: string
    rules:
      - minLength: 8
      - maxLength: 64

  # The caller and the time of the call.
  caller_id:
    description: The identifier of a person or a system that calls the service, as the shell authenticated it
    type: string
    rules:
      - minLength: 1

  email:
    description: An email address
    type: string
    rules:
      - pattern: '^[^@ ]+@[^@ ]+\.[^@ ]+$'

  caller_email:
    description: The email address of the caller, as the shell authenticated it
    type: email

  caller_role:
    description: What the caller is to the service, a buyer, an organizer of events, or box-office staff
    type: string
    rules:
      - enum: [buyer, organizer, box_office]

  assigned_events:
    description: The events that a member of the box-office staff is assigned to
    type: array
    items: event_id

  caller:
    description: Who calls, as the shell authenticated them
    type: object
    properties: [caller_id, caller_email, caller_role, assigned_events]
    rules:
      - required: [caller_id, caller_role]

  called_at:
    description: The time of the call, in UTC, as the shell's clock gives it
    type: utc_time

  # Events (shows) that sell tickets.
  event_id:
    description: The identifier of a concert or other event that sells tickets
    type: uuid

  organizer_id:
    description: The caller who organizes an event
    type: caller_id

  starts_at:
    description: The start time of an event, in UTC
    type: utc_time

  time_zone:
    description: The IANA time zone of the venue of an event, such as Europe/Paris
    type: string
    rules:
      - pattern: '^[A-Za-z]+(/[A-Za-z0-9_+-]+)+$'
      # The names of the IANA time zone database (tzdata 2026e), zones and links, that have an area, as the
      # pattern asks: the spelling and the case of the database. A zone of a later release needs a new version.
      - enum: [
          Africa/Abidjan, Africa/Accra, Africa/Addis_Ababa, Africa/Algiers, Africa/Asmara, Africa/Asmera,
