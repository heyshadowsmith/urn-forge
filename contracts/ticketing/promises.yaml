contract: ticketing
description: "Sells tickets for concerts and events with seated and standing sections to buyers, holds seats during checkout, issues tickets, and handles transfers and refunds for buyers, organizers and box-office staff."
promises:
  # A seated or a standing place is a kind field with optional row and seat number, and invariants; the generated type is not a union.
  P01:
    promise: "A seat is identified by a section code of 1 to 6 uppercase letters or digits, a row of 1 to 2 uppercase letters, and a seat number from 1 to 150; a standing section has no row and no seat number."
    status: workaround
    by: [seat.field.place_kind, seat.field.section, seat.field.row, seat.field.seat_number, hold.invariant.seated_line_names_one_seat, hold.invariant.standing_line_names_quantity, ticket.invariant.seated_ticket_has_seat, ticket.invariant.standing_ticket_has_no_seat]
    hole: B1
  # The currency is any three uppercase letters, not a code of ISO 4217, and nothing states that all amounts of one order share one currency.
  P02:
    promise: "Every money amount is a non-negative integer number of minor units (for example cents) together with a three-letter ISO 4217 currency code, and all amounts in one order share the same currency."
    status: workaround
    by: [money.entity.money, money.field.amount_minor, money.field.currency]
    hole: B4
  # The form of the code is stated; its uniqueness across all events is not.
  P03:
    promise: "A ticket code is exactly 16 characters from the uppercase letters A-Z (without I and O) and the digits 2-9, and is unique across all events."
    status: workaround
    by: [ticket.field.ticket_code]
    hole: C1
  # The total of at most 10 tickets counts 1 for a seated line and the quantity for a standing line: a sum with a condition, which only the core checks; the line is not a union type (B1); the distinct seats are P05.
  P04:
    promise: "A hold request names one event and contains 1 to 10 lines, where a seated line names exactly one distinct seat and a standing line names a section and a quantity of at least 1, and the total number of tickets across all lines is at most 10."
    status: workaround
    by: [hold.entity.hold_request, hold.entity.hold_line, show.field.event_id, seat.field.quantity, hold.invariant.seated_line_names_one_seat, hold.invariant.standing_line_names_quantity]
    hole: A1
  # Each list of places of a hold request, a hold and an order is unique by section, row and seat number; a standing line or ticket has no row or seat number, so it is not compared.
  P05:
    promise: "A single hold or order never contains the same seat twice."
    status: declared
    by: [hold.entity.hold_request, hold.entity.hold, order.entity.order, seat.field.section, seat.field.row, seat.field.seat_number]
  P06:
    promise: "A caller can request: create a hold, release a hold, check out a hold, get an order, transfer a ticket, accept a transfer, cancel a transfer, request a refund, and validate a ticket at entry."
    status: declared
    by: [hold.operation.create_hold, hold.operation.release_hold, order.operation.check_out, order.operation.get_order, transfer.operation.transfer_ticket, transfer.operation.accept_transfer, transfer.operation.cancel_transfer, refund.operation.request_refund, entry.operation.validate_ticket]
  # The answer of create_hold is hold.entity.hold: a required hold id, 1 to 10 held lines (a seat, or a standing
  # section and quantity) each with a required price, and a required total. create_hold ensures
  # output.created_at = now (the hold is created at the time of the call, which the shell gives) and
  # output.expires_at = output.created_at + 10 minutes, so the runtime refuses any other expiry as a ContractViolation.
  # Scenarios at 19:00, 19:55 and 23:54:59.999 on New Year's Eve show the expiry exactly 10 minutes later.
  P07:
    promise: "A successful hold answer carries a hold id, the held seats or standing quantities, the price of each line, the order total, and an expiry time exactly 10 minutes after the hold was created."
    status: declared
    by: [hold.operation.create_hold, hold.entity.hold, hold.field.hold_id, hold.entity.held_line, money.entity.money, hold.field.created_at, hold.field.expires_at]
  # The four refusals are declared; that the listed seats are exactly the requested seats that cannot be held is a rule between request and answer, and "a refused hold holds nothing" is not stated.
  P08:
    promise: "A hold request is refused with SEAT_UNAVAILABLE listing every requested seat that cannot be held, with SECTION_SOLD_OUT naming the standing section lacking capacity, with LIMIT_EXCEEDED if the buyer would hold more than 10 tickets for the event, or with SALES_CLOSED if the event is not on sale; a refused hold holds nothing."
    status: workaround
    by: [hold.operation.create_hold, hold.error.seat_unavailable, hold.error.section_sold_out, hold.error.limit_exceeded, hold.error.sales_closed]
    hole: A2
  # The required fields and the three refusals are declared. "Refused with HOLD_EXPIRED if received after the hold's expiry time" is requires: now <= current.expires_at (at the expiry time itself the checkout is not after it), checked by the runtime before the handler, with scenarios a millisecond before, at and a millisecond after the expiry; a hold that is not ACTIVE is also refused with HOLD_EXPIRED. Not stated: "no ticket is issued" on a refusal. A refusal has no answer and no event, but that it creates no ticket, as that a refusal changes nothing, is the shell's (A2), and the scenarios show it only as no event.
  P09:
    promise: "A checkout request must carry the hold id and a payment reference, and is refused with HOLD_EXPIRED if received after the hold's expiry time, with HOLD_NOT_FOUND for an unknown hold, or with PAYMENT_DECLINED if the payment fails, in which case no ticket is issued."
    status: workaround
    by: [order.operation.check_out, order.entity.checkout_request, hold.field.hold_id, order.field.payment_reference, hold.field.expires_at, order.error.hold_expired, hold.error.hold_not_found, order.error.payment_declined]
    hole: A2
  # The total as the sum of the ticket prices plus the fees is an invariant of the order; one ticket per held place pairs the tickets of the answer with the lines of the stored hold, which no rule states.
  P10:
    promise: "A successful checkout returns an order id and exactly one ticket per held seat or standing place, and the order total equals the sum of the line prices plus the listed fees."
    status: workaround
    by: [order.operation.check_out, order.entity.order, order.field.order_id, order.invariant.total_is_prices_plus_fees]
    hole: A1
  # The moves and the final states are declared, and release and checkout start only from ACTIVE; that the seats of a hold that left ACTIVE are no longer held is a rule across the stored holds and tickets.
  P11:
    promise: "A hold moves only from ACTIVE to CONVERTED, RELEASED or EXPIRED, and once it leaves ACTIVE its seats are no longer held by it."
    status: workaround
    by: [hold.field.hold_status, hold.operation.release_hold, order.operation.check_out, hold.error.hold_not_active]
    hole: C1
  # P12 conflicts with P15 and P17 as written: accepting a transfer voids, and an event cancellation refunds, a
  # TRANSFER_PENDING ticket, which P12 does not allow. The moves state P12 exactly; P15 and P17 keep their holes.
  P12:
    promise: "A ticket moves only from ISSUED to TRANSFER_PENDING, USED, REFUNDED or VOID, from TRANSFER_PENDING back to ISSUED, and no ticket ever leaves USED, REFUNDED or VOID."
    status: declared
    by: [ticket.field.ticket_status, transfer.operation.transfer_ticket, transfer.operation.cancel_transfer, ticket.error.invalid_ticket_state]
  # A rule across all stored holds and tickets of an event, and the capacity of a section.
  P13:
    promise: "At any moment a given seat of an event belongs to at most one active hold or one ISSUED, TRANSFER_PENDING or USED ticket, and a standing section never has more held and issued tickets than its stated capacity."
    status: not-declarable
    hole: C1
  # The key is a required field of 8 to 64 characters on hold_request, checkout_request and refund_request.
  # create_hold, check_out and request_refund state idempotency { key: input.idempotency_key, window: 24 hours }
  # and no otherwise: the promise names no owner of the key and no refusal of another body, so a repeat returns the
  # original answer whatever its body. The Postgres extra generates the table "idempotency"."ticketing" and runOnce,
  # which returns the stored answer and runs nothing (no second hold, order or refund, no event) while now < the first
  # call + 24 hours; a refusal is not stored. Scenarios repeat each operation in the window (the same body and,
  # for create_hold and check_out, another body), at 24 hours (the key is free), and after a refused checkout.
  P14:
    promise: "Create-hold, checkout and refund requests carry a client-supplied idempotency key of 8 to 64 characters, and repeating a request with the same key within 24 hours returns the original answer without creating a second hold, order or refund."
    status: declared
    by: [request.field.idempotency_key, hold.entity.hold_request, order.entity.checkout_request, refund.entity.refund_request, hold.operation.create_hold, order.operation.check_out, refund.operation.request_refund]
  # Declared: the request (one ticket code and a recipient email), "only an ISSUED ticket" (changes from ISSUED), and the
  # 72 hours: transfer_ticket ensures offered_at = now and accept_until = offered_at + 72 hours, and accept_transfer
  # requires now <= current.offered_at + 72 hours ("within": at 72 hours still), else transfer_expired; scenarios
  # at 72 hours and a millisecond after. accept_transfer ensures a new ISSUED ticket code, and that its one
  # TicketTransferred names the new code and the old one as void.
  # Not declared: (1) "only by that recipient" needs a caller (D2): ticketing has no caller header, and one would make
  # each operation state callers, while the rest of this promise still fails, so it is not added here; (2) the old
  # ticket becoming VOID is not a change of the stored ticket: accept_transfer reads the transfer, and P12 does not allow
  # TRANSFER_PENDING to VOID; (3) "the same seat": the transfer does not carry the place, so no rule ties the new
  # ticket's place to the old one's (A2), and no record names the recipient as the new ticket's holder.
  P15:
    promise: "A transfer names one ISSUED ticket and a recipient email address, may be accepted only by that recipient within 72 hours, and on acceptance the old ticket code becomes VOID and the recipient receives a new ticket code for the same seat."
    status: workaround
    by: [transfer.operation.transfer_ticket, transfer.operation.accept_transfer, transfer.entity.transfer_request, transfer.field.recipient_email, transfer.field.offered_at, transfer.field.accept_until, transfer.error.transfer_expired, ticket.event.ticket_transferred, ticket.error.invalid_ticket_state]
    hole: D2
  # The refusal is declared; the refund at most the amount paid is not stated, and a refund names many tickets, so the states that refuse it cannot be a change of one stored ticket.
  P16:
    promise: "A refund is never more than the amount paid for the refunded tickets, and requesting a refund for a ticket that is USED, REFUNDED or VOID is refused with TICKET_NOT_REFUNDABLE."
    status: workaround
    by: [refund.operation.request_refund, refund.error.ticket_not_refundable]
    hole: A2
  # The cancellation and its events are declared; the full refund of every ISSUED or TRANSFER_PENDING ticket, and the publication of the cancellation before the refunds, are not.
  P17:
    promise: "When an organizer cancels an event, every ISSUED or TRANSFER_PENDING ticket of that event is refunded in full including fees, and the cancellation is published before the refunds."
    status: workaround
    by: [show.operation.cancel_event, show.event.event_cancelled, ticket.event.ticket_refunded]
    hole: D4
  # The four answers are an enum and the moves of a ticket are declared; "ADMIT exactly once, for an ISSUED ticket" answers the other states with a verdict, not with a refusal, so no change of the ticket states it.
  P18:
    promise: "Validating a ticket at entry answers ADMIT exactly once for an ISSUED ticket, and answers ALREADY_USED, NOT_VALID or WRONG_EVENT otherwise."
    status: workaround
    by: [entry.operation.validate_ticket, entry.field.verdict, ticket.event.ticket_used]
    hole: C3
  # Each event and its fields are declared, each has an operation that emits it, and a scenario shows each. HoldExpired
  # is emitted by expire_hold, which the shell's clock calls (due: now > current.expires_at, after the last instant
  # check_out allows); the hold is a Postgres table, so selectHoldExpireHoldDue finds the holds that are due.
  # create_hold, expire_hold, accept_transfer and validate_ticket emit one event ({ event }, validate_ticket when ADMIT)
  # and ensure that it names its hold or tickets and event, with occurred_at = now.
  # Not declared: check_out (OrderPlaced and a TicketIssued per ticket), request_refund (a TicketRefunded per ticket) and
  # cancel_event (EventCancelled and TicketRefunded) emit several events, and ensures with event. needs exactly one, so
  # nothing ties their ids or their time to the change; the time of those events is a value of the core (A2).
  # EventCancelled names no ticket.
  P19:
    promise: "The domain publishes HoldCreated, HoldExpired, OrderPlaced, TicketIssued, TicketTransferred, TicketRefunded, TicketUsed and EventCancelled events, each carrying an event id, the event's id, the affected ticket or hold ids, and the time it occurred."
    status: workaround
    by: [hold.event.hold_created, hold.event.hold_expired, order.event.order_placed, ticket.event.ticket_issued, ticket.event.ticket_transferred, ticket.event.ticket_refunded, ticket.event.ticket_used, show.event.event_cancelled, notice.field.message_id, notice.field.occurred_at, hold.operation.create_hold, hold.operation.expire_hold, transfer.operation.accept_transfer, entry.operation.validate_ticket]
    hole: A2
  # Each event has a delivery with id message_id, which the shell gives (newEventId), and the outbox of the Postgres
  # extra keeps the unique id (primary key), no lost event and at least once (a row stays until markPublished). The
  # order per ticket is not stated: the outbox orders by one orderBy value of each event, and OrderPlaced names
  # several tickets (ordered by the order), TicketTransferred two (ordered by the new code, not with the events of
  # the voided code), so the events of one ticket are not in one order.
  P20:
    promise: "Published events are delivered at least once and in order per ticket, and each carries a unique event id so consumers can discard duplicates."
    status: workaround
    by: [notice.field.message_id, hold.event.hold_created, hold.event.hold_expired, order.event.order_placed, ticket.event.ticket_issued, ticket.event.ticket_transferred, ticket.event.ticket_refunded, ticket.event.ticket_used, show.event.event_cancelled]
    hole: D4
  # Not declarable with callers: "staff assigned to the event" needs the caller to hold the list of its events and a rule of membership, which the rule language lacks; one assigned event id would not fit staff assigned to several events. Also no record holds the owner or the organizer: the hold and the ticket have no buyer, request_refund and cancel_event read no record, and no event entity names its organizer.
  P21:
    promise: "Only the buyer who owns an order may check it out, request its refund or transfer its tickets; only the event's organizer may cancel the event; only box-office staff assigned to the event may validate its tickets."
    status: not-declarable
    hole: D2
  # All times are UTC timestamps; the start time of an event in the IANA time zone of its venue is not stated.
  P22:
    promise: "All times are exchanged in UTC as ISO 8601 timestamps, while each event also states its start time in its venue's IANA time zone."
    status: workaround
    by: [hold.field.created_at, hold.field.expires_at, notice.field.occurred_at, transfer.field.offered_at, show.field.cancelled_at]
    hole: D3
  # The start of the event (UTC) is on the order, the ticket and the transfer, which the shell loads with the event's start as it is now. request_refund reads the order and requires now < current.starts_at - 48 hours; transfer_ticket changes the ticket and accept_transfer reads the transfer, and each requires now < current.starts_at - 2 hours, so a transfer is neither offered nor accepted later ("until" excludes the edge). Scenarios a millisecond before each edge, at it, and after the start.
  P23:
    promise: "Buyer-requested refunds are accepted only until 48 hours before the event's start time, and transfers are accepted only until 2 hours before the event's start time."
    status: declared
    by: [show.field.starts_at, refund.operation.request_refund, order.entity.order, refund.error.refund_window_closed, transfer.operation.transfer_ticket, ticket.entity.ticket, transfer.operation.accept_transfer, transfer.entity.transfer, transfer.error.transfer_window_closed]
  # Within the major version, urn-forge diff refuses a removal or a rename, and compatibility.callers lets it accept a
  # new field or refusal code. The 180 days of notice for a new major version is how long the operator runs the old
  # one, which nothing that urn-forge builds can check.
  P24:
    promise: "Within one major version, fields and refusal codes are only added and never removed or renamed, callers must ignore unknown fields, and a new major version is announced at least 180 days before the old one is retired."
    status: workaround
    by: [manifest.compatibility, manifest.version]
    hole: E4
