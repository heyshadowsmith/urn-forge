contract: subscriptions
description: "Manages customer subscriptions to priced plans with monthly or yearly billing periods, trials, plan changes, pauses, cancellation and per-period invoices, for merchant back-office systems and their customers."
promises:
  # Declared: the pattern rules of the definitions subscription_id ('^sub_[a-z0-9]{24}$') and plan_id
  # ('^plan_[a-z0-9-]{1,40}$'). Every subscription id and plan id in a request, an answer, a stored record
  # (scheduled_plan_id is a plan_id) and the SQL CHECK of the tables is one of these definitions.
  P01:
    promise: "A subscription id is the prefix \"sub_\" followed by exactly 24 lowercase letters or digits, and a plan id is the prefix \"plan_\" followed by 1 to 40 lowercase letters, digits or hyphens."
    status: declared
    by: [definitions.subscription_id, definitions.plan_id]
  # Declared: billing_period has enum [month, year]; interval_count has minimum 1 and maximum 12; the plan
  # object applies yearly_interval_is_one (self.billing_period != 'year' || self.interval_count == 1).
  P02:
    promise: "A billing period is either \"month\" or \"year\", and a plan's interval count is a whole number from 1 to 12 for \"month\" and exactly 1 for \"year\"."
    status: declared
    by: [definitions.billing_period, definitions.interval_count, definitions.plan, rules.yearly_interval_is_one]
  # Declared: every money amount (a plan's price, an invoice line's amount and an invoice's total) has the type
  # money, an object that requires amount_minor (an integer, minimum 0, maximum 99999999) and currency (enum
  # [EUR, GBP, USD], the ISO 4217 codes that the domain accepts).
  P03:
    promise: "Every money amount is an integer number of minor currency units from 0 to 99999999 paired with a three-letter uppercase ISO 4217 currency code."
    status: declared
    by: [definitions.money, definitions.amount_minor, definitions.currency, definitions.price, definitions.amount, definitions.total]
  # Declared: subscription_status has enum [trialing, active, past_due, paused, canceled, expired], and the
  # subscription requires it.
  P04:
    promise: "A subscription's status is exactly one of \"trialing\", \"active\", \"past_due\", \"paused\", \"canceled\" or \"expired\"."
    status: declared
    by: [definitions.subscription_status, definitions.subscription]
  # Declared: create_request, the input of create_subscription, requires customer_id, plan_id and quantity
  # (an integer, minimum 1, maximum 10000), and has an optional trial_days (minimum 0, maximum 730).
  P05:
    promise: "A create-subscription request must contain a customer id, a plan id and a quantity that is a whole number from 1 to 10000, and may contain trial days from 0 to 730."
    status: declared
    by: [operations.create_subscription, definitions.create_request, definitions.customer_id, definitions.plan_id, definitions.quantity, definitions.trial_days]
  # Declared: the rules of create_request. trial_days_or_trial_end (!has(trial_days) || !has(trial_end)) refuses
  # both. trial_end_in_window compares the trial end at midnight UTC with now, the time of the call that the
  # shell gives in the input: after now is a day after today, and less 730 days (17520h) at now or before is at
  # most 730 days after today. The harness rejects the input before the core runs. Scenarios at each edge, at
  # 10:00, just before and at midnight UTC.
  P06:
    promise: "A create-subscription request may contain either trial days or an explicit trial end date but never both, and an explicit trial end must be in the future and at most 730 days after the request."
    status: declared
    by: [definitions.create_request, rules.trial_days_or_trial_end, rules.trial_end_in_window, definitions.trial_end, definitions.now]
  # Declared: the operations of the manifest.
  P07:
    promise: "Callers can create, read, list, change plan, pause, resume and cancel a subscription, and read and list its invoices."
    status: declared
    by: [operations.create_subscription, operations.read_subscription, operations.list_subscriptions, operations.change_plan, operations.pause_subscription, operations.resume_subscription, operations.cancel_subscription, operations.read_invoice, operations.list_invoices]
  # Workaround: the output subscription_change holds the full subscription, and create_status ties its status to
  # the request (trialing with more than 0 trial days or a trial end, active otherwise). The status code 201 is
  # the shell's HTTP answer, which no construct states, so a 200 passes every check. The promise also says
  # "active" for a request with an explicit trial end (P06), where the contract answers trialing.
  P08:
    promise: "A successful create returns 201 with the full subscription, whose status is \"trialing\" if the request asked for more than 0 trial days and \"active\" otherwise."
    status: workaround
    by: [operations.create_subscription, definitions.subscription_change, rules.create_status]
    hole: A2
  # Workaround: each refusal of the core is an output object with its own name (subscription_not_found,
  # invoice_not_found, conflict, invalid_state_transition, currency_mismatch, forbidden), and an input that
  # breaks a rule is InputRejected with each rule's name and message. The codes are not the promised names
  # (not_found, invalid_request), the refusal objects carry no message, rate_limited is the shell's, and no
  # answer carries the request id: a refusal without a request id passes every check.
  P09:
    promise: "Every refused request returns one named error code from \"invalid_request\", \"not_found\", \"forbidden\", \"conflict\", \"invalid_state_transition\", \"currency_mismatch\" or \"rate_limited\" together with a human-readable message and the request id."
    status: workaround
    by: [definitions.subscription_not_found, definitions.invoice_not_found, definitions.conflict, definitions.invalid_state_transition, definitions.currency_mismatch, definitions.forbidden]
    hole: A2
  # Declared: the shell loads the new plan into the input (new_plan), and names_the_new_plan ties it to the
  # plan id of the request. The output subscription_change of change_plan applies same_currency (the new plan's
  # currency is the stored subscription's plan's), and the output currency_mismatch applies other_currency and
  # currency_mismatch_names_the_currencies. With a live subscription in another currency, no other output's
  # rules hold, except forbidden for a caller who may not change plans (P22).
  P10:
    promise: "A change-plan request must name a plan whose currency equals the subscription's current currency, otherwise it is refused with \"currency_mismatch\"."
    status: declared
    by: [operations.change_plan, definitions.change_plan_request, definitions.new_plan, rules.names_the_new_plan, rules.same_currency, rules.other_currency, definitions.currency_mismatch, rules.currency_mismatch_names_the_currencies]
  # Declared: change_plan_request requires proration, an enum [immediate, none, at_period_end]. The rule
  # changes_the_plan on the answer: with at_period_end, output.subscription.plan == the stored plan (the whole
  # embedded object) and scheduled_plan_id == the plan id of the request.
  P11:
    promise: "A change-plan request must state a proration mode of \"immediate\", \"none\" or \"at_period_end\", and with \"at_period_end\" the answer shows the new plan as scheduled and the current plan as unchanged."
    status: declared
    by: [definitions.proration, definitions.change_plan_request, operations.change_plan, rules.changes_the_plan]
  # Workaround: the resume date and stored_may_pause state one call exactly, but a pause and an immediate cancel that load the same active subscription at once both pass, and the pause, stored second, makes the canceled subscription paused: it was paused while canceled.
  P12:
    promise: "A pause request may contain a resume date that is at least 1 day and at most 90 days after the request, and a subscription may only be paused while \"active\" or \"trialing\"."
    status: workaround
    by: [operations.pause_subscription, definitions.pause_request, definitions.resume_on, rules.resume_on_in_window, rules.stored_may_pause, rules.stored_may_not_pause, rules.pauses, definitions.invalid_state_transition, rules.create_status, rules.changes_the_plan, rules.resumes, rules.cancels, rules.announces_the_trial_end]
    hole: C3
  # Workaround: the rules state one call exactly, but a cancel and a pause (or a change of plan) that load the same active subscription at once both pass stored_is_live or stored_may_pause, and the second write moves the canceled subscription back to paused or active.
  P13:
    promise: "A cancel request states either \"immediately\" or \"at_period_end\", and a canceled or expired subscription can never move to any other status, so any further change request on it is refused with \"invalid_state_transition\"."
    status: workaround
    by: [definitions.cancel_mode, definitions.cancel_request, rules.names_the_subscription, rules.stored_is_live, rules.stored_is_ended, rules.stored_may_pause, rules.stored_may_not_pause, rules.stored_is_paused, rules.stored_is_not_paused, rules.trial_end_is_due, rules.trial_end_is_not_due, rules.names_the_stored_state, definitions.invalid_state_transition, operations.change_plan, operations.pause_subscription, operations.resume_subscription, operations.cancel_subscription, operations.announce_trial_end]
    hole: C3
  # Workaround: invoice_period_ends_after_start is declared (and a CHECK of the invoice table). No overlap and no
  # gap between the invoices of one subscription are rules across stored records: two stored invoices of one
  # subscription with overlapping periods pass every check.
  P14:
    promise: "Within one subscription, invoice periods never overlap, each invoice's period end is after its period start, and each invoice's period start equals the previous invoice's period end."
    status: workaround
    by: [definitions.invoice, rules.invoice_period_ends_after_start]
    hole: C1
  # Declared: the invoice requires lines and total and applies total_is_sum (total.amount_minor ==
  # lines.map(l, l.amount.amount_minor).sum()) and lines_in_total_currency; line_quantity has minimum 1, and the
  # total's amount_minor minimum 0. SQL cannot say the two list rules (the schema's comment names them), but
  # every invoice that leaves the domain crosses the harness: read_invoice and list_invoices check the stored
  # invoices of their input and the invoices of their answer.
  P15:
    promise: "Every invoice's total equals the sum of its line amounts, each line has a quantity of at least 1, and no invoice has a negative total."
    status: declared
    by: [definitions.invoice, rules.total_is_sum, rules.lines_in_total_currency, definitions.line, definitions.line_quantity, definitions.total, definitions.amount_minor, operations.read_invoice, operations.list_invoices]
  # Workaround: invoice_status has the enum. No operation changes an invoice, so no rule compares an invoice
  # before and after: read_invoice can answer paid, then open, for one invoice.
  P16:
    promise: "An invoice's status is exactly one of \"draft\", \"open\", \"paid\", \"void\" or \"uncollectible\", and a \"paid\" or \"void\" invoice never changes status again."
    status: workaround
    by: [definitions.invoice_status]
    hole: C3
  # Workaround: the shell loads the customer's live subscription to the plan, if any, into the input
  # (existing_subscription, which existing_is_the_customers_live_one checks); create_subscription answers
  # conflict (has_live_subscription, conflict_names_the_request) with one, and a subscription only without one
  # (no_live_subscription). But the uniqueness is across stored records: a shell that finds none (two creates at
  # once) passes every check, and the SQL schema has no unique index, as the config's unique has no condition
  # (not canceled, not expired).
  P17:
    promise: "A customer has at most one non-canceled, non-expired subscription per plan, and a second create for the same customer and plan is refused with \"conflict\"."
    status: workaround
    by: [operations.create_subscription, definitions.create_request, definitions.existing_subscription, rules.existing_is_the_customers_live_one, rules.no_live_subscription, rules.has_live_subscription, definitions.conflict, rules.conflict_names_the_request]
    hole: C1
  # Workaround: the idempotency key (1 to 255 characters) is an optional property of every write request. A
  # repeat within 24 hours is behaviour across calls, not data: nothing keeps the first answer, and a repeat
  # passes every check with a second effect. No output is the conflict of a key sent with another body.
  P18:
    promise: "Every write request may carry an idempotency key of 1 to 255 characters, and a repeat of the same key with the same body within 24 hours returns the original answer without a second effect, while the same key with a different body is refused with \"conflict\"."
    status: workaround
    by: [definitions.idempotency_key, definitions.create_request, definitions.change_plan_request, definitions.pause_request, definitions.resume_request, definitions.cancel_request]
    hole: C2
  # Workaround: the events are part of the output subscription_change. An event requires event_id (a UUID),
  # event_type (enum of the six names), subscription_id and occurred_at; events_name_the_subscription ties each
  # to the subscription of the answer, events_occur_now its time to now, and event_ids_differ makes the ids of
  # one answer differ. The rules of each operation count its events: create_events, create_trial_notice,
  # one_updated_event, one_canceled_event and one_trial_will_end_event. Still missing: invoice.created for each
  # later period and invoice.paid when a customer pays have no operation (only the first invoice, at create,
  # is published), and an event id is unique only within one answer: two calls can publish one id.
  P19:
    promise: "The domain publishes the events subscription.created, subscription.updated, subscription.canceled, subscription.trial_will_end, invoice.created and invoice.paid, each carrying a unique event id, the event type, the subscription id and the occurrence time."
    status: workaround
    by: [definitions.event, definitions.event_id, definitions.event_type, definitions.occurred_at, definitions.events, definitions.subscription_change, rules.event_ids_differ, rules.events_name_the_subscription, rules.events_occur_now, rules.create_events, rules.create_trial_notice, rules.one_updated_event, rules.one_canceled_event, rules.one_trial_will_end_event]
    hole: E3
  # Workaround: the event id that a consumer drops a repeat by is declared. Delivery at least once and in order
  # per subscription is behaviour of the transport, not data: the manifest has no outbox and the Postgres schema
  # has no event table, so a lost or reordered event passes every check.
  P20:
    promise: "Events are delivered at least once and in order per subscription, so consumers must ignore an event id they have already processed."
    status: workaround
    by: [definitions.event_id, definitions.events]
    hole: D4
  # Workaround: create_trial_notice announces a trial that ends less than 3 days after today at once (one
  # trial_will_end event, and the mark trial_will_end_sent_at = now), and marks no other. announce_trial_end
  # answers a change only when trial_end_is_due (trialing, not marked, today at or after 3 days before the end),
  # with one trial_will_end event and the mark; keeps_the_trial stops the other changes from setting or clearing
  # the mark. Being called on time is not data: a clock that calls 20 days late, or never, passes every check.
  P21:
    promise: "subscription.trial_will_end is published 3 days before a trial ends, or immediately on creation if the trial is shorter than 3 days."
    status: workaround
    by: [operations.create_subscription, rules.create_trial_notice, operations.announce_trial_end, rules.trial_end_is_due, rules.announces_the_trial_end, rules.one_trial_will_end_event, rules.keeps_the_trial, definitions.trial_will_end_sent_at]
    hole: E3
  # Declared: the caller, as the shell authenticated it, is a property of every input (caller_kind customer,
  # staff or clock; a customer has a customer_id, only staff have staff_roles). create_subscription and
  # change_plan answer a change only with caller_is_billing_admin, and forbidden otherwise. A customer reads,
  # pauses, resumes and cancels only with caller_holds_the_stored (the stored subscription is theirs), lists only
  # with caller_may_list, and may not call announce_trial_end (caller_is_not_a_customer). No operation voids an
  # invoice. Read and list of invoices also hold a customer to their own subscriptions.
  P22:
    promise: "A customer may only read, list, pause, resume and cancel their own subscriptions, while only merchant staff with the billing-admin role may create subscriptions, change plans or void invoices."
    status: declared
    by: [definitions.caller, rules.customer_has_id, rules.roles_are_for_staff, rules.caller_is_billing_admin, rules.caller_is_not_billing_admin, rules.caller_holds_the_stored, rules.caller_does_not_hold_the_stored, rules.caller_may_list, rules.caller_may_not_list, rules.caller_is_not_a_customer, rules.caller_is_a_customer, definitions.forbidden, operations.create_subscription, operations.change_plan, operations.read_subscription, operations.list_subscriptions, operations.pause_subscription, operations.resume_subscription, operations.cancel_subscription, operations.announce_trial_end]
  # Workaround: every timestamp (now, current_period_start/end, trial_will_end_sent_at, period_start/end of an
  # invoice, occurred_at of an event) has the type utc_time: format date-time and the pattern 'Z$'. The monthly
  # period is not stated: the rule language has no calendar months and a duration is a literal, so no rule says
  # that a period ends interval_count calendar months after it starts, on the last day of a shorter month. Only
  # period_ends_after_start and invoice_period_ends_after_start hold; a monthly period of 40 days passes every
  # check. Scenarios start periods on Jan 31 (Feb 28), Jan 31 2028 (Feb 29), Mar 31 (Apr 30), Dec 31 (Jan 31),
  # Nov 30 quarterly (Feb 28) and Feb 29 yearly (Feb 28).
  P23:
    promise: "All timestamps in requests, answers and events are ISO 8601 in UTC with a trailing \"Z\", and a monthly period that starts on a day missing from the next month ends on that month's last day."
    status: workaround
    by: [definitions.utc_time, definitions.now, definitions.current_period_start, definitions.current_period_end, definitions.trial_will_end_sent_at, definitions.period_start, definitions.period_end, definitions.occurred_at, rules.period_ends_after_start, rules.invoice_period_ends_after_start]
    hole: D3
  # Workaround: within the major version, urn-forge diff refuses a removal or a rename, and compatibility.callers
  # lets it accept a new property or choice. The 12 months for which a removed version keeps working is how long
  # the operator runs it, which nothing that urn-forge builds can check.
  P24:
    promise: "Within one major API version, fields and enum values are only added and never removed or renamed, callers must ignore unknown fields, and a removed version keeps working for at least 12 months after its deprecation is announced."
    status: workaround
    by: [manifest.compatibility, manifest.version]
    hole: E4
