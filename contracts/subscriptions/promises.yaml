contract: subscriptions
description: "Manages customer subscriptions to priced plans with monthly or yearly billing periods, trials, plan changes, pauses, cancellation and per-period invoices, for merchant back-office systems and their customers."
promises:
  P01:
    promise: "A subscription id is the prefix \"sub_\" followed by exactly 24 lowercase letters or digits, and a plan id is the prefix \"plan_\" followed by 1 to 40 lowercase letters, digits or hyphens."
    status: declared
    by: [subscription.field.subscription_id, plan.field.plan_id]
  P02:
    promise: "A billing period is either \"month\" or \"year\", and a plan's interval count is a whole number from 1 to 12 for \"month\" and exactly 1 for \"year\"."
    status: declared
    by: [plan.field.billing_period, plan.field.interval_count, plan.invariant.yearly_interval_is_one]
  # The currency is any three uppercase letters; nothing limits it to the ISO 4217 codes.
  P03:
    promise: "Every money amount is an integer number of minor currency units from 0 to 99999999 paired with a three-letter uppercase ISO 4217 currency code."
    status: workaround
    by: [money.entity.money, money.field.amount_minor, money.field.currency]
    hole: B4
  P04:
    promise: "A subscription's status is exactly one of \"trialing\", \"active\", \"past_due\", \"paused\", \"canceled\" or \"expired\"."
    status: declared
    by: [subscription.field.status]
  P05:
    promise: "A create-subscription request must contain a customer id, a plan id and a quantity that is a whole number from 1 to 10000, and may contain trial days from 0 to 730."
    status: declared
    by: [subscription.operation.create_subscription, subscription.entity.create_request, customer.field.customer_id, plan.field.plan_id, subscription.field.quantity, subscription.field.trial_days]
  # Never both: the invariant trial_days_or_trial_end on the request (trial days and trial end are two optional fields, and the rule refuses both). The window: a requires on create_subscription, input.trial_end is absent or input.trial_end > today and input.trial_end <= today + 730, answers invalid_trial_end; today is the UTC date of now, the time of the call that the shell gives (no more requested_on in the request). trial_end is a date, so "in the future" is a day after today. Scenarios at each edge, at 10:00, just before and at midnight UTC.
  P06:
    promise: "A create-subscription request may contain either trial days or an explicit trial end date but never both, and an explicit trial end must be in the future and at most 730 days after the request."
    status: declared
    by: [subscription.invariant.trial_days_or_trial_end, subscription.operation.create_subscription, subscription.field.trial_end, subscription.error.invalid_trial_end]
  P07:
    promise: "Callers can create, read, list, change plan, pause, resume and cancel a subscription, and read and list its invoices."
    status: declared
    by: [subscription.operation.create_subscription, subscription.operation.read_subscription, subscription.operation.list_subscriptions, subscription.operation.change_plan, subscription.operation.pause_subscription, subscription.operation.resume_subscription, subscription.operation.cancel_subscription, invoice.operation.read_invoice, invoice.operation.list_invoices]
  # The output is the full subscription, and ensures on create_subscription tie its status to the trial days (and an explicit trial end) of the request. The status code 201 is for the shell.
  P08:
    promise: "A successful create returns 201 with the full subscription, whose status is \"trialing\" if the request asked for more than 0 trial days and \"active\" otherwise."
    status: workaround
    by: [subscription.operation.create_subscription, subscription.entity.subscription, subscription.field.status]
    hole: A2
  # Only the errors that the core or a requires rule returns are declared, each with a message; invalid_trial_end and invalid_resume_date are validation errors, which the shell answers as invalid_request. The other invalid_request answers, forbidden and rate_limited come from the shell, and no refusal carries the request id.
  P09:
    promise: "Every refused request returns one named error code from \"invalid_request\", \"not_found\", \"forbidden\", \"conflict\", \"invalid_state_transition\", \"currency_mismatch\" or \"rate_limited\" together with a human-readable message and the request id."
    status: workaround
    by: [subscription.error.not_found, invoice.error.not_found, subscription.error.conflict, subscription.error.invalid_state_transition, subscription.error.currency_mismatch]
    hole: A2
  # The error is declared, but the rule that compares the currency of the new plan with the currency of the subscription is in the core.
  P10:
    promise: "A change-plan request must name a plan whose currency equals the subscription's current currency, otherwise it is refused with \"currency_mismatch\"."
    status: workaround
    by: [subscription.operation.change_plan, subscription.error.currency_mismatch]
    hole: A1
  # The proration mode is a required enum, and two ensures on change_plan state that an at_period_end answer shows the new plan as scheduled and the plan of the record unchanged.
  P11:
    promise: "A change-plan request must state a proration mode of \"immediate\", \"none\" or \"at_period_end\", and with \"at_period_end\" the answer shows the new plan as scheduled and the current plan as unchanged."
    status: declared
    by: [subscription.field.proration, subscription.entity.change_plan_request, subscription.entity.subscription, subscription.operation.change_plan]
  # The resume window: a requires on pause_subscription, input.resume_on is absent or input.resume_on >= today + 1 and input.resume_on <= today + 90, answers invalid_resume_date; today is the UTC date of now, the time of the call that the shell gives (no more requested_on in the request). Pausing only from active or trialing: changes from [active, trialing] to paused, otherwise invalid_state_transition. Scenarios at each edge, at 10:00, just before and at midnight UTC.
  P12:
    promise: "A pause request may contain a resume date that is at least 1 day and at most 90 days after the request, and a subscription may only be paused while \"active\" or \"trialing\"."
    status: declared
    by: [subscription.operation.pause_subscription, subscription.field.resume_on, subscription.error.invalid_resume_date, subscription.field.status, subscription.error.invalid_state_transition]
  P13:
    promise: "A cancel request states either \"immediately\" or \"at_period_end\", and a canceled or expired subscription can never move to any other status, so any further change request on it is refused with \"invalid_state_transition\"."
    status: declared
    by: [subscription.field.cancel_mode, subscription.field.status, subscription.operation.change_plan, subscription.operation.pause_subscription, subscription.operation.resume_subscription, subscription.operation.cancel_subscription, subscription.error.invalid_state_transition]
  # Only "the period end is after the period start" is declared. No overlap and no gap between the invoices of one subscription are rules across stored records.
  P14:
    promise: "Within one subscription, invoice periods never overlap, each invoice's period end is after its period start, and each invoice's period start equals the previous invoice's period end."
    status: workaround
    by: [invoice.invariant.period_end_after_start]
    hole: C1
  # A line quantity of at least 1, a total of 0 or more, and a total in minor units that is the sum of the line amounts in minor units are declared. That each line is in the currency of the total is not: it is a rule on each item, which no construct states, so an invoice whose lines are in another currency than its total still passes.
  P15:
    promise: "Every invoice's total equals the sum of its line amounts, each line has a quantity of at least 1, and no invoice has a negative total."
    status: workaround
    by: [invoice.entity.invoice, invoice.invariant.total_is_sum, invoice.field.line_quantity, money.field.amount_minor]
    hole: A1
  P16:
    promise: "An invoice's status is exactly one of \"draft\", \"open\", \"paid\", \"void\" or \"uncollectible\", and a \"paid\" or \"void\" invoice never changes status again."
    status: declared
    by: [invoice.field.status]
  # Declared: the subscription (a table of the postgres plugin) has plan_id as its own column (plan.field.plan_id, with the invariant plan_id_is_plan: plan_id = plan.plan_id) and unique [{ by: [customer_id, plan_id], when: status != 'canceled' and status != 'expired', otherwise: subscription.error.conflict }]. The schema has the partial unique index subscription_customer_id_plan_id_unique, and commitOnce answers a clash with conflict, filled by name (customer_id, plan_id) from the answer, and writes nothing. create_subscription ensures output.customer_id = input.customer_id and output.plan_id = input.plan_id, so a second create for the same customer and plan is the clash. The core has no check of its own (it sees one call). Scenarios: a stored trialing, active, past_due or paused subscription of the customer to the plan → conflict, nothing changes; a stored canceled or expired one → created; another plan or another customer → created. change_plan also declares conflict, for a move to a plan that the customer has a live subscription to. Readings: the invariant plan_id = plan.plan_id reads the child table of the plan, so the SQL does not check it (unenforced-in-sql); the Valibot schema of the output does, before commitOnce.
  P17:
    promise: "A customer has at most one non-canceled, non-expired subscription per plan, and a second create for the same customer and plan is refused with \"conflict\"."
    status: declared
    by: [subscription.entity.subscription, plan.field.plan_id, subscription.invariant.plan_id_is_plan, subscription.operation.create_subscription, subscription.error.conflict]
  # Declared: request.field.idempotency_key (1 to 255 characters) is an optional field of every write request (create, change_plan, pause, resume and cancel), and each of these operations has idempotency with that key, a window of 24 hours and otherwise request.error.conflict (category conflict). With the postgres plugin the store file has runOnce and the table "idempotency"."subscriptions": a repeat with the same key and body in 24 hours returns the stored answer and runs nothing (no change, no event); another body gets the conflict; a refusal is not stored. The scenarios repeat each write with the same body (the first answer, no event), with another body (conflict), after 24 hours (runs again), and without a key (runs again). Readings: announce_trial_end is not a write request that a client sends but the shell's clock, with the read-only lookup as input; it runs once by its due rule (P21), so it has no key. A key is owned by its operation, as each repeat is of one request: the same key on another operation is another request.
  P18:
    promise: "Every write request may carry an idempotency key of 1 to 255 characters, and a repeat of the same key with the same body within 24 hours returns the original answer without a second effect, while the same key with a different body is refused with \"conflict\"."
    status: declared
    by: [request.field.idempotency_key, request.error.conflict, subscription.operation.create_subscription, subscription.operation.change_plan, subscription.operation.pause_subscription, subscription.operation.resume_subscription, subscription.operation.cancel_subscription]
  # Each operation now publishes counted events: create_subscription exactly one created, one trial_will_end when the trial ends less than 3 days after the request, and one invoice.created and one invoice.paid when there is no trial; change_plan, pause and resume exactly one updated; cancel exactly one canceled. The shell gives each event id (newEventId), and the outbox's primary key refuses an id twice. ensures state that the event of change_plan, pause, resume and cancel carries the subscription's id. trial_will_end for a trial of 3 days or more is now published by the timed operation announce_trial_end (due 3 days before the trial end, see P21), exactly one, with an ensures that it carries the subscription's id. Still missing: (1) invoice.created for each later period and invoice.paid when a customer pays have no operation either: the only invoices published are the first, at create; (2) create_subscription emits two or three events, and an ensures that reads event. needs exactly one, so nothing ties the subscription id of its events to the new subscription; (3) the occurrence time is a value of the core, not a clock (E2); and the type is the kind URN (urn:corpus:subscriptions:subscription:event:created), not the name subscription.created.
  P19:
    promise: "The domain publishes the events subscription.created, subscription.updated, subscription.canceled, subscription.trial_will_end, invoice.created and invoice.paid, each carrying a unique event id, the event type, the subscription id and the occurrence time."
    status: workaround
    by: [subscription.event.created, subscription.event.updated, subscription.event.canceled, subscription.event.trial_will_end, invoice.event.created, invoice.event.paid, event.field.event_id, event.field.occurred_at, subscription.operation.create_subscription, subscription.operation.change_plan, subscription.operation.pause_subscription, subscription.operation.resume_subscription, subscription.operation.cancel_subscription, subscription.operation.announce_trial_end]
    hole: E3
  # Each of the six events has delivery { id: event_id, orderBy: subscription_id }, and the contract uses the Postgres plugin, which writes the outbox: the events commit with the change (none is lost), a row stays until markPublished (at least once), the event id is the primary key (unique, so a consumer can drop one it has seen), and nextEvents gives each subscription's events in the order they were written. The transport is the user's.
  P20:
    promise: "Events are delivered at least once and in order per subscription, so consumers must ignore an event id they have already processed."
    status: declared
    by: [subscription.event.created, subscription.event.updated, subscription.event.canceled, subscription.event.trial_will_end, invoice.event.created, invoice.event.paid, event.field.event_id, subscription.field.subscription_id]
  # On creation: create_subscription emits exactly one trial_will_end when output.trial_end < today + 3 (none otherwise), and ensures tie trial_end to the request (input.trial_end, or today + input.trial_days) so the length of the trial is stated, not computed in the core. Later: the timed operation announce_trial_end (changes from [trialing] with no to, so the status stays) has due: current.trial_will_end_sent_at is absent and current.trial_end is present and today >= current.trial_end - 3; the runtime refuses a call that is not due, it emits exactly one trial_will_end carrying the subscription's id, and ensures set the mark trial_will_end_sent_at = now and keep trial_end. Published once: create sets the mark when it publishes at creation and leaves it absent otherwise (two ensures), and change_plan and cancel_subscription, which keep a trialing status, ensure they keep the mark and the trial end. The subscription is a Postgres table, so the store file has selectSubscriptionAnnounceTrialEndDue(now, limit), from the same rule, that the shell's clock runs (urn-forge does not run the clock; a sweep that runs late publishes late). Scenarios at the edge (00:00 of trial_end - 3, just before, the last instant of the day before the end, after), not due before, not due after the mark, never due with no trial end, not trialing, the mark kept by create, change_plan and cancel.
  P21:
    promise: "subscription.trial_will_end is published 3 days before a trial ends, or immediately on creation if the trial is shorter than 3 days."
    status: declared
    by: [subscription.event.trial_will_end, subscription.operation.create_subscription, subscription.operation.announce_trial_end, subscription.field.trial_will_end_sent_at, subscription.field.trial_end, subscription.operation.change_plan, subscription.operation.cancel_subscription]
  P22:
    promise: "A customer may only read, list, pause, resume and cancel their own subscriptions, while only merchant staff with the billing-admin role may create subscriptions, change plans or void invoices."
    status: not-declarable
    hole: D2
  # Every timestamp (current_period_start/end and trial_will_end_sent_at of a subscription, period_start/end of an invoice, occurred_at of each of the six events) is the timestamp primitive, which accepts only ISO 8601 in UTC with a trailing Z in answers and events and in a stored record; no request carries a timestamp (trial_end and resume_on are dates). Periods: every operation that answers a subscription (create, read, list, change_plan, pause, resume, cancel, announce_trial_end) ensures that a plan billed in months has current_period_end = current_period_start + interval_count months (so a monthly plan's period ends 1 calendar month on, on the last day of a month that lacks the start's day) and a yearly plan + 12 months; create ensures the first period starts now, and change_plan keeps the period for a plan with the same period and starts one now otherwise. An invoice carries billing_period and interval_count, and invariants state the same rule on its period. No event carries a period. Scenarios start periods on Jan 31 (Feb 28), Jan 31 2028 (Feb 29), Mar 31 (Apr 30), May 31, Dec 31 (Jan 31), Nov 30 quarterly (Feb 28) and Feb 29 yearly, in create, change_plan and read_invoice. The rule is an ensures, not an invariant of the subscription, because the Postgres plugin crashes on a path into the embedded plan in a CHECK.
  P23:
    promise: "All timestamps in requests, answers and events are ISO 8601 in UTC with a trailing \"Z\", and a monthly period that starts on a day missing from the next month ends on that month's last day."
    status: declared
    by: [billing.field.period_start, billing.field.period_end, event.field.occurred_at, subscription.field.trial_will_end_sent_at, subscription.operation.create_subscription, subscription.operation.change_plan, subscription.operation.read_subscription, subscription.operation.list_subscriptions, subscription.operation.pause_subscription, subscription.operation.resume_subscription, subscription.operation.cancel_subscription, subscription.operation.announce_trial_end, invoice.invariant.monthly_period, invoice.invariant.yearly_period]
  # Within the major version, urn-forge diff refuses a removal or a rename, and compatibility.callers lets it accept a
  # new field or enum value. The 12 months for which a removed version keeps working is how long the operator runs it,
  # which nothing that urn-forge builds can check.
  P24:
    promise: "Within one major API version, fields and enum values are only added and never removed or renamed, callers must ignore unknown fields, and a removed version keeps working for at least 12 months after its deprecation is announced."
    status: workaround
    by: [manifest.compatibility, manifest.version]
    hole: E4
