# Payments: a merchant takes payments from buyers by card or bank transfer, captures or voids them,
# and refunds them.
#
# Each call's input holds what the shell gives besides the request: the caller (the kind of the API
# key that the shell authenticated, and its merchant), the time of the call (now), the id of the
# event that the call publishes (event_id), and the stored record that the call reads or moves
# (stored_payment, stored_refund), which the shell loads by the id of the request. A payment id or
# refund id that names no stored record is the shell's not_found. Each answer that creates or changes
# a payment carries the payment as it is after the call and the one event of the change; the shell
# stores the records of the answer as they are and publishes the event.
manifest:
  namespace: corpus
  domain: payments
  version: 1.0.0
  # Callers tolerate a new optional property or a new choice in an answer, such as a new event type.
  compatibility:
    callers: ignore-unknown

definitions:
  # Values

  payment_id:
    description: The id of a payment
    type: string
    rules:
      - pattern: '^pay_[a-z0-9]{24}$'

  refund_id:
    description: The id of a refund
    type: string
    rules:
      - pattern: '^re_[a-z0-9]{24}$'

  merchant_id:
    description: The id of the merchant that a payment belongs to, or that an API key belongs to
    type: string

  amount:
    description: An amount in minor units of its currency, for example cents
    type: integer
    rules:
      - minimum: 1
      - maximum: 99999999

  # The currencies that the domain takes, each an active ISO 4217 code. A merchant may take fewer of
  # them (unsupported_currency).
  currency:
    description: The ISO 4217 code of the currency of an amount, one of those that the domain takes
    type: string
    rules:
      - enum: [AUD, CAD, CHF, DKK, EUR, GBP, JPY, NOK, SEK, USD]

  method:
    description: How the buyer pays
    type: string
    rules:
      - enum: [card, bank_transfer]

  # "Printable" is read as "no Unicode control, format, private-use or unassigned character" (\P{C}).
  idempotency_key:
    description: A key that the caller chooses, so that a repeated request has the effect of one
    type: string
    rules:
      - minLength: 1
      - maxLength: 64
      - pattern: '^\P{C}*$'

  description:
    description: Free text about the payment
    type: string
    rules:
      - maxLength: 255

  metadata_key:
    description: The key of a metadata entry
    type: string

  metadata_value:
    description: The value of a metadata entry
    type: string

  quantity:
    description: How many units a line item has
    type: integer
    rules:
      - minimum: 1

  unit_amount:
    description: The amount of one unit of a line item, in minor units
    type: integer
    rules:
      - minimum: 0

  iban:
    description: The IBAN of the account that pays by bank transfer
    type: string
    rules:
      - pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}$'

  status:
    description: Where a payment is in its life
    type: string
    rules:
      - enum: [pending, authorized, failed, captured, voided, expired, partially_refunded, refunded]

  previous_status:
    description: The status of a payment before a change
    type: status

  new_status:
    description: The status of a payment after a change
    type: status

  authorized_amount:
    description: The amount that the buyer authorized, in minor units
    type: amount

  total:
    description: A sum of amounts in minor units, 0 or more
    type: integer
    rules:
      - minimum: 0
      - maximum: 99999999

  captured_amount:
    description: The amount captured from the buyer, in minor units
    type: total

  refunded_amount:
    description: The sum of all refunds of a payment, in minor units
    type: total

  refunded_total:
    description: The sum of all refunds of a payment, this one included, in minor units
    type: total

  time:
    description: A time in UTC, in ISO 8601 with a trailing Z
    type: string
    rules:
      - format: date-time
      - pattern: 'Z$'

  now:
    description: The time of the call, which the shell gives
    type: time

  created_at:
    description: When the payment or refund was created
    type: time

  captured_at:
    description: When the payment was captured
    type: time

  occurred_at:
    description: When the status of the payment changed
    type: time

  event_id:
    description: The id of an event, which the shell gives, so that a consumer can discard a duplicate
    type: string
    rules:
      - pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

  event_type:
    description: The name of an event, payment.<new_status>
    type: string
    rules:
      - enum: [payment.pending, payment.authorized, payment.failed, payment.captured, payment.voided, payment.expired, payment.partially_refunded, payment.refunded]

  transfer_outcome:
    description: What the bank reported of a bank transfer
    type: string
    rules:
      - enum: [arrived, failed]

  card_number:
    description: The number of a card
    type: string
    rules:
      - pattern: '^[0-9]{12,19}$'

  exp_month:
    description: The month in which a card expires
    type: integer
    rules:
      - minimum: 1
      - maximum: 12

  exp_year:
    description: The year in which a card expires, four digits
    type: integer
    rules:
      - minimum: 1000
      - maximum: 9999

  security_code:
    description: The security code of a card
    type: string
    rules:
      - pattern: '^[0-9]{3,4}$'

  brand:
    description: The brand of a card
    type: string
    rules:
      - enum: [visa, mastercard, amex, other]

  last4:
    description: The last 4 digits of a card number
    type: string
    rules:
      - pattern: '^[0-9]{4}$'

  key_kind:
    description: >-
      The kind of the API key of the caller, as the shell authenticated it: secret or read_only, a
      merchant's key; clock, the shell's clock; bank, the shell when the bank reports a transfer;
      none, no key or a key that is not valid
    type: string
    rules:
      - enum: [secret, read_only, clock, bank, none]

  # Shapes

  caller:
    description: Who calls; a key belongs to one merchant, and the clock, the bank and no key to none
    type: object
    properties: [key_kind, merchant_id]
    rules:
      - required: [key_kind]
      - key_has_merchant

  card:
    description: The details of a card that pays
    type: object
    properties: [card_number, exp_month, exp_year, security_code]
    rules:
      - required: [card_number, exp_month, exp_year, security_code]
      - security_code_fits_the_brand

  card_summary:
    description: What an answer shows of a card
    type: object
    properties: [brand, last4, exp_month, exp_year]
    rules:
      - required: [brand, last4, exp_month, exp_year]

  metadata_entry:
    description: One entry of the metadata of a payment
    type: object
    identifier: metadata_key
    properties: [metadata_key, metadata_value]
    rules:
      - required: [metadata_key, metadata_value]

  metadata:
    description: The metadata of a payment, at most one entry for each key
    type: array
    items: metadata_entry
    rules:
      - maxItems: 20
      - one_entry_for_each_key

  line_item:
    description: One line of what the buyer pays for
    type: object
    properties: [quantity, unit_amount]
    rules:
      - required: [quantity, unit_amount]

  line_items:
    description: What the buyer pays for
    type: array
    items: line_item
    rules:
      - minItems: 1
      - maxItems: 100

  payment:
    description: A payment as it is stored and as a caller can read it
    type: object
    identifier: payment_id
    properties: [payment_id, merchant_id, amount, currency, method, status, captured_amount, refunded_amount, card_summary, created_at, captured_at]
    rules:
      - required: [payment_id, merchant_id, amount, currency, method, status, captured_amount, refunded_amount, created_at]
      - amounts_within_payment
      - captured_payment_has_capture_time
      - pending_only_for_bank_transfer

  stored_payment:
    description: The payment that the request names, as the shell loaded it before the call
    type: payment

  refund:
    description: A refund of a payment
    type: object
    identifier: refund_id
    properties: [refund_id, payment_id, merchant_id, amount, currency, captured_amount, refunded_total, created_at]
    rules:
      - required: [refund_id, payment_id, merchant_id, amount, currency, captured_amount, refunded_total, created_at]
      - refunds_within_captured

  stored_refund:
    description: The refund that the request names, as the shell loaded it before the call
    type: refund

  payment_event:
    description: The event of a change of the status of a payment, which the shell publishes
    type: object
    properties: [event_id, event_type, payment_id, merchant_id, amount, currency, previous_status, new_status, occurred_at]
    rules:
      - required: [event_id, event_type, payment_id, merchant_id, amount, currency, new_status, occurred_at]
      - event_type_names_the_status

  # Requests

  create_payment_request:
    description: A request to take a payment from a buyer
    type: object
    properties: [merchant_id, amount, currency, method, idempotency_key, description, metadata, line_items, card, iban, caller, now, event_id]
    rules:
      - required: [merchant_id, amount, currency, method, idempotency_key, caller, now, event_id]
      - card_payment_has_card
      - bank_transfer_has_iban_and_no_card

  capture_request:
    description: A request to capture an authorized payment, in full when it has no amount
    type: object
    properties: [merchant_id, payment_id, amount, stored_payment, caller, now, event_id]
    rules:
      - required: [merchant_id, payment_id, stored_payment, caller, now, event_id]
      - names_the_payment

  void_request:
    description: A request to cancel an authorized payment that was not captured
    type: object
    properties: [merchant_id, payment_id, stored_payment, caller, now, event_id]
    rules:
      - required: [merchant_id, payment_id, stored_payment, caller, now, event_id]
      - names_the_payment

  expiry:
    description: The shell's clock expires a payment that it found due
    type: object
    properties: [payment_id, stored_payment, caller, now, event_id]
    rules:
      - required: [payment_id, stored_payment, caller, now, event_id]
      - names_the_payment

  settlement:
    description: The shell reports what the bank said of a bank transfer
    type: object
    properties: [payment_id, transfer_outcome, stored_payment, caller, now, event_id]
    rules:
      - required: [payment_id, transfer_outcome, stored_payment, caller, now, event_id]
      - names_the_payment

  payment_lookup:
    description: A request that names one payment of a merchant
    type: object
    properties: [merchant_id, payment_id, stored_payment, caller]
    rules:
      - required: [merchant_id, payment_id, stored_payment, caller]
      - names_the_payment

  refund_request:
    description: A request to give back a part or all of a captured payment
    type: object
    properties: [merchant_id, payment_id, amount, idempotency_key, stored_payment, caller, now, event_id]
    rules:
      - required: [merchant_id, payment_id, amount, idempotency_key, stored_payment, caller, now, event_id]
      - names_the_payment

  refund_lookup:
    description: A request that names one refund of a merchant
    type: object
    properties: [merchant_id, refund_id, stored_refund, caller]
    rules:
      - required: [merchant_id, refund_id, stored_refund, caller]
      - names_the_refund

  # Answers

  payment_changed:
    description: A payment as it is after its creation or a change of its status, which the shell stores, and the event of the change
    type: object
    properties: [payment, payment_event]
    rules:
      - required: [payment, payment_event]

  refund_made:
    description: A refund that was made and its payment as it is after it, which the shell stores, and the event of the change of the status of the payment
    type: object
    properties: [refund, payment, payment_event]
    rules:
      - required: [refund, payment, payment_event]

  # Refusals

  invalid_request:
    description: The request breaks a rule that its values alone do not show, such as line items that do not add up to the amount
    type: object
    properties: []

  card_declined:
    description: The issuer of the card declined the payment
    type: object
    properties: []

  insufficient_funds:
    description: The account of the card does not hold enough money
    type: object
    properties: []

  expired_card:
    description: The card has expired
    type: object
    properties: []

  fraud_suspected:
    description: The payment was refused as suspected fraud
    type: object
    properties: []

  unsupported_currency:
    description: The currency is not one that the merchant can take
    type: object
    properties: [currency]
    rules:
      - required: [currency]

  idempotency_conflict:
    description: The idempotency key was used before with a different request
    type: object
    properties: [idempotency_key]
    rules:
      - required: [idempotency_key]

  not_found:
    description: The request names a merchant other than the one of the key, or a payment or refund of another merchant
    type: object
    properties: []

  unauthorized:
    description: The caller presented no API key, or one that is not valid
    type: object
    properties: []

  forbidden:
    description: The key of the caller may not make this call
    type: object
    properties: []

  invalid_state:
    description: The payment is in a status that does not allow the requested move
    type: object
    properties: [status]
    rules:
      - required: [status]

  capture_exceeds_authorized:
    description: The capture amount is more than the authorized amount
    type: object
    properties: [amount, currency, authorized_amount]
    rules:
      - required: [amount, currency, authorized_amount]

  amount_exceeds_captured:
    description: The refund would make the refunds of the payment more than its captured amount
    type: object
    properties: [amount, currency, captured_amount, refunded_amount]
    rules:
      - required: [amount, currency, captured_amount, refunded_amount]

  refund_window_closed:
    description: The payment was captured more than 180 days ago
    type: object
    properties: []

rules:
  # Rules of values

  key_has_merchant:
    description: A merchant's key belongs to one merchant; the clock, the bank and no key to none
    rule: >-
      ((self.key_kind == 'secret' || self.key_kind == 'read_only') && has(self.merchant_id)) ||
      (self.key_kind != 'secret' && self.key_kind != 'read_only' && !has(self.merchant_id))
    message: A merchant's key belongs to one merchant, and no other caller to any

  security_code_fits_the_brand:
    description: The security code of an American Express card (a number that starts with 34 or 37) is 4 digits, and of any other card 3
    rule: >-
      (self.card_number.matches('^3[47]') && self.security_code.matches('^[0-9]{4}$')) ||
      (!self.card_number.matches('^3[47]') && self.security_code.matches('^[0-9]{3}$'))
    message: The security code is 4 digits for American Express and 3 for any other card

  one_entry_for_each_key:
    description: No two metadata entries have the same key
    rule: self.all(e, self.exists_one(f, f.metadata_key == e.metadata_key))
    message: Each metadata key may occur once

  amounts_within_payment:
    description: A payment captures at most its amount, and refunds at most what it captured
    rule: self.captured_amount <= self.amount && self.refunded_amount <= self.captured_amount
    message: The captured amount must be at most the amount, and the refunded amount at most the captured amount

  # A captured payment holds the time of its capture, which the refund window counts from.
  captured_payment_has_capture_time:
    description: A captured or refunded payment holds when it was captured
    rule: "!(self.status in ['captured', 'partially_refunded', 'refunded']) || has(self.captured_at)"
    message: A captured or refunded payment needs the time of its capture

  pending_only_for_bank_transfer:
    description: Only a bank transfer payment can be pending
    rule: self.status != 'pending' || self.method == 'bank_transfer'
    message: Only a bank transfer payment can be pending

  refunds_within_captured:
    description: The sum of all refunds of a payment, this one included, is at most the captured amount
    rule: self.amount <= self.refunded_total && self.refunded_total <= self.captured_amount
    message: The refunds of a payment must not exceed the captured amount

  event_type_names_the_status:
    description: An event is named payment.<new_status>
    rule: self.event_type == 'payment.' + self.new_status
    message: The event type must be payment.<new_status>

  card_payment_has_card:
    description: A card payment carries card details
    rule: self.method != 'card' || has(self.card)
    message: A card payment needs card details

  bank_transfer_has_iban_and_no_card:
    description: A bank transfer payment carries an IBAN and no card details
    rule: self.method != 'bank_transfer' || (has(self.iban) && !has(self.card))
    message: A bank transfer payment needs an IBAN and no card details

  names_the_payment:
    description: The stored payment is the one that the request names
    rule: self.stored_payment.payment_id == self.payment_id
    message: The stored payment is not the one that the request names

  names_the_refund:
    description: The stored refund is the one that the request names
    rule: self.stored_refund.refund_id == self.refund_id
    message: The stored refund is not the one that the request names

  # Who calls

  has_no_key:
    description: The caller has no valid API key
    rule: input.caller.key_kind == 'none'
    message: The caller has a valid key

  is_not_a_secret_key:
    description: The caller has a valid key that is not a merchant's secret key
    rule: input.caller.key_kind != 'none' && input.caller.key_kind != 'secret'
    message: The caller has a secret key, or no key

  is_not_a_merchant_key:
    description: The caller has a valid key that is not a merchant's
    rule: input.caller.key_kind == 'clock' || input.caller.key_kind == 'bank'
    message: The caller has a merchant's key, or no key

  is_not_the_clock:
    description: The caller has a valid key that is not the shell's clock
    rule: input.caller.key_kind != 'none' && input.caller.key_kind != 'clock'
    message: The caller is the clock, or has no key

  is_the_clock:
    description: The caller is the shell's clock
    rule: input.caller.key_kind == 'clock'
    message: Only the shell's clock may expire a payment

  is_not_the_bank:
    description: The caller has a valid key that is not the bank's
    rule: input.caller.key_kind != 'none' && input.caller.key_kind != 'bank'
    message: The caller is the bank, or has no key

  is_the_bank:
    description: The caller is the shell, reporting for the bank
    rule: input.caller.key_kind == 'bank'
    message: Only the bank may settle a payment

  is_the_merchants_secret_key:
    description: The caller has the secret key of the merchant that the request names
    rule: input.caller.key_kind == 'secret' && has(input.caller.merchant_id) && input.caller.merchant_id == input.merchant_id
    message: Only the merchant's secret key may make this call

  is_the_merchants_key:
    description: The caller has a key, secret or read-only, of the merchant that the request names
    rule: >-
      (input.caller.key_kind == 'secret' || input.caller.key_kind == 'read_only') &&
      has(input.caller.merchant_id) && input.caller.merchant_id == input.merchant_id
    message: Only a key of the merchant may make this call

  is_another_merchants_secret_key:
    description: The caller has a secret key of a merchant other than the one that the request names
    rule: >-
      input.caller.key_kind == 'secret' &&
      (!has(input.caller.merchant_id) || input.caller.merchant_id != input.merchant_id)
    message: The key is of the merchant that the request names

  names_the_merchants_payment:
    description: The stored payment belongs to the merchant that the request names
    rule: input.stored_payment.merchant_id == input.merchant_id
    message: The payment belongs to another merchant

  is_not_the_merchants_payment_to_change:
    description: A secret key of another merchant, or a payment of another merchant
    rule: >-
      input.caller.key_kind == 'secret' &&
      (!has(input.caller.merchant_id) || input.caller.merchant_id != input.merchant_id ||
      input.stored_payment.merchant_id != input.merchant_id)
    message: The key and the payment are of the merchant that the request names

  is_not_the_merchants_payment_to_read:
    description: A merchant's key of another merchant, or a payment of another merchant
    rule: >-
      (input.caller.key_kind == 'secret' || input.caller.key_kind == 'read_only') &&
      (!has(input.caller.merchant_id) || input.caller.merchant_id != input.merchant_id ||
      input.stored_payment.merchant_id != input.merchant_id)
    message: The key and the payment are of the merchant that the request names

  names_the_merchants_refund:
    description: The stored refund belongs to the merchant that the request names
    rule: input.stored_refund.merchant_id == input.merchant_id
    message: The refund belongs to another merchant

  is_not_the_merchants_refund:
    description: A merchant's key of another merchant, or a refund of another merchant
    rule: >-
      (input.caller.key_kind == 'secret' || input.caller.key_kind == 'read_only') &&
      (!has(input.caller.merchant_id) || input.caller.merchant_id != input.merchant_id ||
      input.stored_refund.merchant_id != input.merchant_id)
    message: The key and the refund are of the merchant that the request names

  # Creating a payment

  line_items_add_up:
    description: When the request has line items, the amount is the sum of quantity times unit amount over all lines
    rule: '!has(input.line_items) || input.amount == input.line_items.map(i, i.quantity * i.unit_amount).sum()'
    message: The line items do not add up to the amount

  line_items_do_not_add_up:
    description: The request has line items that do not add up to the amount
    rule: has(input.line_items) && input.amount != input.line_items.map(i, i.quantity * i.unit_amount).sum()
    message: The line items add up to the amount

  pays_by_card:
    description: The request pays by card
    rule: input.method == 'card'
    message: Only a card payment can be refused by the issuer of the card

  creates_the_payment:
    description: >-
      The new payment has the merchant, amount, currency and method of the request, was created at
      the time of the call, is authorized or pending, and has nothing captured or refunded
    rule: >-
      output.payment.merchant_id == input.merchant_id && output.payment.amount == input.amount &&
      output.payment.currency == input.currency && output.payment.method == input.method &&
      output.payment.created_at == input.now &&
      output.payment.status in ['authorized', 'pending'] &&
      output.payment.captured_amount == 0 && output.payment.refunded_amount == 0 &&
      !has(output.payment.captured_at)
    message: The new payment differs from the request

  # The answer shows of a card only its brand, the last 4 digits of its number and its expiry,
  # and its payment id does not hold the card number.
  shows_the_card:
    description: The answer shows the last 4 digits and the expiry of the card of the request, and nothing of a payment without a card
    rule: >-
      (!has(input.card) && !has(output.payment.card_summary)) ||
      (has(input.card) && has(output.payment.card_summary) &&
      input.card.card_number.matches(output.payment.card_summary.last4 + '$') &&
      output.payment.card_summary.exp_month == input.card.exp_month &&
      output.payment.card_summary.exp_year == input.card.exp_year &&
      !output.payment.payment_id.matches(input.card.card_number))
    message: The answer must show the last 4 digits and the expiry of the card, and nothing else of it

  announces_the_new_payment:
    description: The event of a new payment has the event id of the call, the payment's id, merchant, amount, currency and status, no previous status, and the time of the call
    rule: >-
      output.payment_event.event_id == input.event_id &&
      output.payment_event.payment_id == output.payment.payment_id &&
      output.payment_event.merchant_id == output.payment.merchant_id &&
      output.payment_event.amount == output.payment.amount &&
      output.payment_event.currency == output.payment.currency &&
      !has(output.payment_event.previous_status) &&
      output.payment_event.new_status == output.payment.status &&
      output.payment_event.occurred_at == input.now
    message: The event does not describe the new payment

  names_the_currency:
    description: The refusal names the currency of the request
    rule: output.currency == input.currency
    message: The refusal names another currency

  names_the_key:
    description: The refusal names the idempotency key of the request
    rule: output.idempotency_key == input.idempotency_key
    message: The refusal names another idempotency key

  # Moving a payment

  was_authorized:
    description: The stored payment is authorized
    rule: input.stored_payment.status == 'authorized'
    message: The payment is not authorized

  # A card payment is authorized when it is created (only a bank transfer can be pending), so its
  # created_at is the time of its authorization.
  is_within_7_days:
    description: A card payment is less than 7 days past its authorization
    rule: input.stored_payment.method != 'card' || timestamp(input.now) < timestamp(input.stored_payment.created_at) + duration('168h')
    message: A card payment can no longer be captured or voided 7 days after its authorization

  cannot_capture_or_void:
    description: The stored payment is not authorized, or it is a card payment 7 days or more past its authorization
    rule: >-
      input.stored_payment.status != 'authorized' ||
      (input.stored_payment.method == 'card' &&
      timestamp(input.now) >= timestamp(input.stored_payment.created_at) + duration('168h'))
    message: The payment can be captured or voided

  names_the_status:
    description: The refusal names the status of the stored payment
    rule: output.status == input.stored_payment.status
    message: The refusal names another status

  capture_within_authorized:
    description: A capture amount, when the request has one, is at most the authorized amount
    rule: '!has(input.amount) || input.amount <= input.stored_payment.amount'
    message: The capture amount is more than the authorized amount

  capture_exceeds_authorized_amount:
    description: The capture amount is more than the authorized amount
    rule: has(input.amount) && input.amount > input.stored_payment.amount
    message: The capture amount is at most the authorized amount

  captures_the_amount:
    description: >-
      The capture takes the amount of the request, or the full authorized amount when it has none,
      at the time of the call, and changes nothing else of the payment
    rule: >-
      output.payment.payment_id == input.stored_payment.payment_id &&
      output.payment.merchant_id == input.stored_payment.merchant_id &&
      output.payment.amount == input.stored_payment.amount &&
      output.payment.currency == input.stored_payment.currency &&
      output.payment.method == input.stored_payment.method &&
      output.payment.refunded_amount == input.stored_payment.refunded_amount &&
      output.payment.created_at == input.stored_payment.created_at &&
      ((has(output.payment.card_summary) && has(input.stored_payment.card_summary) &&
      output.payment.card_summary == input.stored_payment.card_summary) ||
      (!has(output.payment.card_summary) && !has(input.stored_payment.card_summary))) &&
      output.payment.status == 'captured' &&
      has(output.payment.captured_at) && output.payment.captured_at == input.now &&
      ((has(input.amount) && output.payment.captured_amount == input.amount) ||
      (!has(input.amount) && output.payment.captured_amount == input.stored_payment.amount))
    message: The capture differs from the request or the payment

  names_the_excess:
    description: The refusal names the capture amount, the currency and the authorized amount
    rule: >-
      has(input.amount) && output.amount == input.amount &&
      output.currency == input.stored_payment.currency &&
      output.authorized_amount == input.stored_payment.amount
    message: The refusal names other amounts

  keeps_the_payment:
    description: A change of status changes the status of the stored payment only
    rule: >-
      output.payment.payment_id == input.stored_payment.payment_id &&
      output.payment.merchant_id == input.stored_payment.merchant_id &&
      output.payment.amount == input.stored_payment.amount &&
      output.payment.currency == input.stored_payment.currency &&
      output.payment.method == input.stored_payment.method &&
      output.payment.captured_amount == input.stored_payment.captured_amount &&
      output.payment.refunded_amount == input.stored_payment.refunded_amount &&
      output.payment.created_at == input.stored_payment.created_at &&
      ((has(output.payment.card_summary) && has(input.stored_payment.card_summary) &&
      output.payment.card_summary == input.stored_payment.card_summary) ||
      (!has(output.payment.card_summary) && !has(input.stored_payment.card_summary))) &&
      ((has(output.payment.captured_at) && has(input.stored_payment.captured_at) &&
      output.payment.captured_at == input.stored_payment.captured_at) ||
      (!has(output.payment.captured_at) && !has(input.stored_payment.captured_at)))
    message: The call may change only the status of the payment

  announces_the_change:
    description: The event of a change describes the stored payment, its status before and after, and the time of the call
    rule: >-
      output.payment_event.event_id == input.event_id &&
      output.payment_event.payment_id == input.stored_payment.payment_id &&
      output.payment_event.merchant_id == input.stored_payment.merchant_id &&
      output.payment_event.amount == input.stored_payment.amount &&
      output.payment_event.currency == input.stored_payment.currency &&
      has(output.payment_event.previous_status) &&
      output.payment_event.previous_status == input.stored_payment.status &&
      output.payment_event.new_status == output.payment.status &&
      output.payment_event.occurred_at == input.now
    message: The event does not describe the change

  becomes_voided:
    description: The payment is voided
    rule: output.payment.status == 'voided'
    message: The payment is not voided

  is_due:
    description: The stored payment is an authorized card payment 7 days or more past its authorization
    rule: >-
      input.stored_payment.status == 'authorized' && input.stored_payment.method == 'card' &&
      timestamp(input.now) >= timestamp(input.stored_payment.created_at) + duration('168h')
    message: The payment is not due to expire

  is_not_due:
    description: The stored payment is not an authorized card payment 7 days or more past its authorization
    rule: >-
      input.stored_payment.status != 'authorized' || input.stored_payment.method != 'card' ||
      timestamp(input.now) < timestamp(input.stored_payment.created_at) + duration('168h')
    message: The payment is due to expire

  becomes_expired:
    description: The payment is expired
    rule: output.payment.status == 'expired'
    message: The payment is not expired

  was_pending:
    description: The stored payment is pending
    rule: input.stored_payment.status == 'pending'
    message: The payment is not pending

  was_not_pending:
    description: The stored payment is not pending
    rule: input.stored_payment.status != 'pending'
    message: The payment is pending

  settles_the_transfer:
    description: A transfer that arrived authorizes the payment, and one that failed fails it
    rule: >-
      (input.transfer_outcome == 'arrived' && output.payment.status == 'authorized') ||
      (input.transfer_outcome == 'failed' && output.payment.status == 'failed')
    message: The status does not follow what the bank reported

  # Refunding a payment

  was_captured:
    description: The stored payment is captured or partially refunded
    rule: input.stored_payment.status in ['captured', 'partially_refunded']
    message: The payment is not captured

  was_not_captured:
    description: The stored payment is neither captured nor partially refunded
    rule: "!(input.stored_payment.status in ['captured', 'partially_refunded'])"
    message: The payment is captured

  # At most 180 days after the capture, to the millisecond: on the instant 180 days after it a
  # refund is allowed.
  is_within_refund_window:
    description: The time of the call is at most 180 days after the capture
    rule: has(input.stored_payment.captured_at) && timestamp(input.now) <= timestamp(input.stored_payment.captured_at) + duration('4320h')
    message: The payment was captured more than 180 days ago

  refund_window_is_closed:
    description: The time of the call is more than 180 days after the capture
    rule: '!has(input.stored_payment.captured_at) || timestamp(input.now) > timestamp(input.stored_payment.captured_at) + duration(''4320h'')'
    message: The payment was captured at most 180 days ago

  refund_within_captured:
    description: The refunds of the payment, this one included, are at most its captured amount
    rule: input.stored_payment.refunded_amount + input.amount <= input.stored_payment.captured_amount
    message: The refund is more than is left of the captured amount

  refund_exceeds_captured:
    description: The refunds of the payment, this one included, would be more than its captured amount
    rule: input.stored_payment.refunded_amount + input.amount > input.stored_payment.captured_amount
    message: The refund is at most what is left of the captured amount

  makes_the_refund:
    description: The refund has the amount of the request, the payment's merchant, currency and captured amount, the new total of its refunds, and the time of the call
    rule: >-
      output.refund.payment_id == input.payment_id &&
      output.refund.merchant_id == input.stored_payment.merchant_id &&
      output.refund.amount == input.amount &&
      output.refund.currency == input.stored_payment.currency &&
      output.refund.captured_amount == input.stored_payment.captured_amount &&
      output.refund.refunded_total == input.stored_payment.refunded_amount + input.amount &&
      output.refund.created_at == input.now
    message: The refund differs from the request or the payment

  refunds_the_payment:
    description: >-
      The payment adds the refund to its refunded amount, is refunded when that is all it captured
      and partially refunded otherwise, and changes nothing else
    rule: >-
      output.payment.payment_id == input.stored_payment.payment_id &&
      output.payment.merchant_id == input.stored_payment.merchant_id &&
      output.payment.amount == input.stored_payment.amount &&
      output.payment.currency == input.stored_payment.currency &&
      output.payment.method == input.stored_payment.method &&
      output.payment.captured_amount == input.stored_payment.captured_amount &&
      output.payment.created_at == input.stored_payment.created_at &&
      ((has(output.payment.card_summary) && has(input.stored_payment.card_summary) &&
      output.payment.card_summary == input.stored_payment.card_summary) ||
      (!has(output.payment.card_summary) && !has(input.stored_payment.card_summary))) &&
      has(output.payment.captured_at) && has(input.stored_payment.captured_at) &&
      output.payment.captured_at == input.stored_payment.captured_at &&
      output.payment.refunded_amount == output.refund.refunded_total &&
      ((output.payment.refunded_amount < output.payment.captured_amount && output.payment.status == 'partially_refunded') ||
      (output.payment.refunded_amount == output.payment.captured_amount && output.payment.status == 'refunded'))
    message: The payment after the refund differs from the stored payment and the refund

  names_the_shortfall:
    description: The refusal names the refund amount, the currency, and the captured and refunded amounts of the payment
    rule: >-
      output.amount == input.amount && output.currency == input.stored_payment.currency &&
      output.captured_amount == input.stored_payment.captured_amount &&
      output.refunded_amount == input.stored_payment.refunded_amount
    message: The refusal names other amounts

  # Reading

  returns_the_payment:
    description: The answer is the stored payment
    rule: output == input.stored_payment
    message: The answer is not the stored payment

  returns_the_refund:
    description: The answer is the stored refund
    rule: output == input.stored_refund
    message: The answer is not the stored refund

operations:
  create_payment:
    description: Create a payment and ask the buyer's bank to authorize it
    input: create_payment_request
    output:
      - payment_changed: [is_the_merchants_secret_key, line_items_add_up, creates_the_payment, shows_the_card, announces_the_new_payment]
      - invalid_request: [is_the_merchants_secret_key, line_items_do_not_add_up]
      - card_declined: [is_the_merchants_secret_key, line_items_add_up, pays_by_card]
      - insufficient_funds: [is_the_merchants_secret_key, line_items_add_up, pays_by_card]
      - expired_card: [is_the_merchants_secret_key, line_items_add_up, pays_by_card]
      - fraud_suspected: [is_the_merchants_secret_key, line_items_add_up]
      - unsupported_currency: [is_the_merchants_secret_key, line_items_add_up, names_the_currency]
      - idempotency_conflict: [is_the_merchants_secret_key, names_the_key]
      - not_found: [is_another_merchants_secret_key]
      - forbidden: [is_not_a_secret_key]
      - unauthorized: [has_no_key]

  capture_payment:
    description: Capture an authorized payment, in full or in part
    input: capture_request
    output:
      - payment_changed: [is_the_merchants_secret_key, names_the_merchants_payment, was_authorized, is_within_7_days, capture_within_authorized, captures_the_amount, announces_the_change]
      - capture_exceeds_authorized: [is_the_merchants_secret_key, names_the_merchants_payment, was_authorized, is_within_7_days, capture_exceeds_authorized_amount, names_the_excess]
      - invalid_state: [is_the_merchants_secret_key, names_the_merchants_payment, cannot_capture_or_void, names_the_status]
      - not_found: [is_not_the_merchants_payment_to_change]
      - forbidden: [is_not_a_secret_key]
      - unauthorized: [has_no_key]

  void_payment:
    description: Cancel an authorized payment that was not captured
    input: void_request
    output:
      - payment_changed: [is_the_merchants_secret_key, names_the_merchants_payment, was_authorized, is_within_7_days, keeps_the_payment, becomes_voided, announces_the_change]
      - invalid_state: [is_the_merchants_secret_key, names_the_merchants_payment, cannot_capture_or_void, names_the_status]
      - not_found: [is_not_the_merchants_payment_to_change]
      - forbidden: [is_not_a_secret_key]
      - unauthorized: [has_no_key]

  # The shell's clock calls it for a payment that it finds due.
  expire_payment:
    description: Expire an authorized card payment that was not captured within 7 days of its authorization
    input: expiry
    output:
      - payment_changed: [is_the_clock, is_due, keeps_the_payment, becomes_expired, announces_the_change]
      - invalid_state: [is_the_clock, is_not_due, names_the_status]
      - forbidden: [is_not_the_clock]
      - unauthorized: [has_no_key]

  # The shell calls it when the bank reports that a bank transfer arrived or failed.
  settle_payment:
    description: Authorize a pending bank transfer payment whose money arrived, or fail one whose transfer failed
    input: settlement
    output:
      - payment_changed: [is_the_bank, was_pending, keeps_the_payment, settles_the_transfer, announces_the_change]
      - invalid_state: [is_the_bank, was_not_pending, names_the_status]
      - forbidden: [is_not_the_bank]
      - unauthorized: [has_no_key]

  get_payment:
    description: Read a payment by its id
    input: payment_lookup
    output:
      - payment: [is_the_merchants_key, names_the_merchants_payment, returns_the_payment]
      - not_found: [is_not_the_merchants_payment_to_read]
      - forbidden: [is_not_a_merchant_key]
      - unauthorized: [has_no_key]

  refund_payment:
    description: Give back a part or all of a captured payment
    input: refund_request
    output:
      - refund_made: [is_the_merchants_secret_key, names_the_merchants_payment, was_captured, is_within_refund_window, refund_within_captured, makes_the_refund, refunds_the_payment, announces_the_change]
      - amount_exceeds_captured: [is_the_merchants_secret_key, names_the_merchants_payment, was_captured, is_within_refund_window, refund_exceeds_captured, names_the_shortfall]
      - refund_window_closed: [is_the_merchants_secret_key, names_the_merchants_payment, was_captured, refund_window_is_closed]
      - invalid_state: [is_the_merchants_secret_key, names_the_merchants_payment, was_not_captured, names_the_status]
      - idempotency_conflict: [is_the_merchants_secret_key, names_the_key]
      - not_found: [is_not_the_merchants_payment_to_change]
      - forbidden: [is_not_a_secret_key]
      - unauthorized: [has_no_key]

  get_refund:
    description: Read a refund by its id
    input: refund_lookup
    output:
      - refund: [is_the_merchants_key, names_the_merchants_refund, returns_the_refund]
      - not_found: [is_not_the_merchants_refund]
      - forbidden: [is_not_a_merchant_key]
      - unauthorized: [has_no_key]
