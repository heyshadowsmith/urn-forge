contract: payments
description: "Takes payments from buyers on behalf of merchants by card or bank transfer, captures or voids them, and refunds them."
promises:
  # The amount and its currency are two fields: no type pairs them. The currency is checked
  # for its form only (three uppercase letters), not against the list of ISO 4217 codes.
  P01:
    promise: "An amount is a whole number of minor currency units (for example cents) from 1 to 99999999, paired with an ISO 4217 currency code of three uppercase letters."
    status: workaround
    by: [payment.field.amount, payment.field.currency]
    hole: B4
  P02:
    promise: "A payment id is the prefix \"pay_\" followed by 24 lowercase letters or digits, and a refund id is the prefix \"re_\" followed by 24 lowercase letters or digits."
    status: declared
    by: [payment.field.payment_id, refund.field.refund_id]
  # The method is an enum and each shape is an invariant over optional properties: the
  # generated type is not a union of a card payment and a bank transfer payment.
  P03:
    promise: "A payment method is exactly one of \"card\" or \"bank_transfer\", and a card payment must carry card details while a bank transfer payment must carry an IBAN and must not carry card details."
    status: workaround
    by: [payment.field.method, payment.entity.create_payment_request, payment.invariant.card_payment_has_card, payment.invariant.bank_transfer_has_iban_and_no_card]
    hole: B1
  # The Luhn check is missing. The security code is 3 or 4 digits for any card: that 4 digits
  # are only for American Express depends on the card number, which no rule can read.
  P04:
    promise: "A card number is 12 to 19 digits that pass the Luhn check, its expiry month is 1 to 12, its expiry year is four digits, and its security code is 3 digits, or 4 digits for American Express."
    status: workaround
    by: [card.entity.card_details, card.field.card_number, card.field.exp_month, card.field.exp_year, card.field.security_code]
    hole: E1
  # The form and the length are declared; the mod-97 check is missing.
  P05:
    promise: "An IBAN is a two-letter country code, two check digits and up to 30 letters or digits, at most 34 characters in total, and passes the mod-97 check."
    status: workaround
    by: [payment.field.iban]
    hole: E1
  # The metadata is a list of key and value entries, unique by key, not a map. "Printable" is
  # read as "no Unicode control or format character".
  P06:
    promise: "A create-payment request must contain a merchant id, an amount, a currency, a payment method, and an idempotency key of 1 to 64 printable characters, and may contain a description of at most 255 characters and up to 20 metadata entries."
    status: workaround
    by: [payment.entity.create_payment_request, payment.field.merchant_id, payment.field.amount, payment.field.currency, payment.field.method, payment.field.idempotency_key, payment.field.description, payment.entity.metadata_entry]
    hole: B3
  # The sum is a requires rule of create_payment, so a mismatch answers invalid_request.
  P07:
    promise: "When a create-payment request carries line items, there are 1 to 100 of them, each has a quantity of at least 1 and a non-negative unit amount, and the payment amount equals the sum of quantity times unit amount over all lines."
    status: declared
    by: [payment.entity.create_payment_request, payment.entity.line_item, payment.field.quantity, payment.field.unit_amount, payment.operation.create_payment, payment.error.invalid_request]
  P08:
    promise: "A caller can create a payment, capture it, void it, refund it, and read a payment or refund by id."
    status: declared
    by: [payment.operation.create_payment, payment.operation.capture_payment, payment.operation.void_payment, refund.operation.refund_payment, payment.operation.get_payment, refund.operation.get_refund]
  # The statuses of a success, "pending only for a bank transfer", the payload of a success and
  # the refusals of the core are declared. A request that breaks a field limit is refused at the
  # boundary as an input rejection, not as the declared error invalid_request: the manifest
  # cannot give that refusal its name, and the shell must map it.
  P09:
    promise: "Creating a payment answers either \"authorized\", \"pending\" (bank transfers only) or a refusal named one of \"invalid_request\", \"card_declined\", \"insufficient_funds\", \"expired_card\", \"unsupported_currency\" or \"fraud_suspected\", and every success carries the payment id, amount, currency and status."
    status: workaround
    by: [payment.operation.create_payment, payment.entity.created_payment, payment.field.initial_status, payment.invariant.pending_only_for_bank_transfer, payment.error.invalid_request, payment.error.card_declined, payment.error.insufficient_funds, payment.error.expired_card, payment.error.unsupported_currency, payment.error.fraud_suspected]
    hole: A3
  # The authorized amount is the amount of the stored payment.
  P10:
    promise: "A capture request may carry an amount, which must be at least 1 and at most the authorized amount, and if it is omitted the full authorized amount is captured."
    status: declared
    by: [payment.operation.capture_payment, payment.entity.capture_request, payment.field.amount, payment.entity.capture_result, payment.invariant.captured_within_authorized, payment.error.capture_exceeds_authorized]
  # The stored payment holds the sum of its refunds as refunded_amount.
  P11:
    promise: "A refund request carries an amount of at least 1, and the sum of all refunds on a payment never exceeds the captured amount, otherwise the refund is refused as \"amount_exceeds_captured\"."
    status: declared
    by: [refund.operation.refund_payment, refund.entity.refund_request, payment.field.amount, payment.entity.payment, payment.field.refunded_amount, refund.entity.refund, refund.invariant.refunds_within_captured, refund.error.amount_exceeds_captured]
  P12:
    promise: "A refund always has the same currency as the payment it refunds."
    status: declared
    by: [refund.operation.refund_payment, refund.entity.refund, payment.field.currency]
  P13:
    promise: "A payment moves only along these steps: pending to authorized or failed, authorized to captured, voided or expired, captured to partially_refunded or refunded, and partially_refunded to refunded; any other requested move is refused as \"invalid_state\"."
    status: declared
    by: [payment.field.status, payment.operation.capture_payment, payment.operation.void_payment, refund.operation.refund_payment, payment.error.invalid_state]
  P14:
    promise: "Only an authorized payment that has not been captured can be voided, and only a captured or partially refunded payment can be refunded."
    status: declared
    by: [payment.operation.void_payment, refund.operation.refund_payment, payment.field.status, payment.error.invalid_state]
  # Stated: create_payment and refund_payment, the two writes that create a payment or a refund,
  # have idempotency: key input.idempotency_key, scope caller.merchant_id, window
  # 24 hours, otherwise idempotency_conflict. The Postgres plugin generates the
  # answers table "idempotency"."payments" and runOnce: a repeat with the same key, merchant and
  # body before 24 hours have passed gets the stored first answer and runs nothing (no second
  # payment or refund, no event); the same key with another body is idempotency_conflict; the key
  # of another merchant is another scope. The core keeps no keys. Scenarios show the repeat at
  # 24 hours less a millisecond, the new call at 24 hours, the key of another merchant, and the
  # conflict. The runtime answers a repeat only once the caller may call, so a read-only key
  # that repeats a write of its merchant is still refused (P22). A refusal is not stored, so
  # a repeat of a refused request runs again and is refused again on the same rules. The shell
  # must call runOnce in the transaction of the call, as it must call insertEvents.
  P15:
    promise: "A second request with the same idempotency key and the same body from the same merchant within 24 hours returns the original answer without creating a second payment or refund, and one with the same key but a different body is refused as \"idempotency_conflict\"."
    status: declared
    by: [payment.operation.create_payment, refund.operation.refund_payment, payment.field.idempotency_key, payment.field.merchant_id, auth.entity.caller, payment.error.idempotency_conflict]
  # Every payment (and refund) carries exactly one, required merchant id. The manifest names the
  # caller (auth.entity.caller: the merchant and the kind of the API key that the shell
  # authenticated), and each operation has callers with otherwise: not_found. Create allows only
  # caller.merchant_id = input.merchant_id, so a request that names any merchant other than the
  # one of the key, unknown or known, is not found. Capture, void, refund (changes) and the two
  # reads (reads: payment or refund, missing: not_found) also need caller.merchant_id =
  # current.merchant_id, so a payment or refund of another merchant is not found; the runtime
  # checks it before the state and before requires, so the refusal shows nothing of the record.
  # An unknown payment or refund is the missing error, not_found. The core no longer checks the
  # merchant. The shell keeps authentication: that the merchant of the caller is the merchant of
  # a valid key, so a merchant that exists. That is what a caller is, as the plan defines it, not
  # a part of this promise left out of the manifest.
  P16:
    promise: "Every payment belongs to exactly one merchant, and a request naming an unknown merchant or a payment of another merchant is refused as \"not_found\"."
    status: declared
    by: [payment.entity.payment, refund.entity.refund, payment.field.merchant_id, auth.entity.caller, payment.operation.create_payment, payment.operation.capture_payment, payment.operation.void_payment, refund.operation.refund_payment, payment.operation.get_payment, refund.operation.get_refund, payment.error.not_found]
  # The time of the authorization: a card payment is authorized when it is created (its
  # initial_status is authorized or pending, and pending_only_for_bank_transfer allows pending
  # only for a bank transfer; a card that the bank refuses is an error, not a payment), and
  # create_payment ensures output.created_at = now, so the created_at of a card payment is the
  # time of its authorization. The move: expire_payment changes a payment from authorized to
  # expired, with due: current.method = 'card' and now >= current.created_at + 7 days, so a bank
  # transfer payment never expires, and a card payment is due from the instant 7 days after its
  # authorization, to the millisecond. The shell's clock calls it (callers allow only
  # caller.key_kind = 'clock', a caller with no merchant, auth.invariant.key_has_merchant); the
  # payment is a table of the Postgres extra, so selectPaymentExpirePaymentDue(now, limit) gives
  # the keys of the authorized card payments that are due, from the same rule, and the runtime
  # refuses a call for one that is not due (ContractViolation). It emits payment.expired (P20).
  # "Can no longer be captured": capture_payment requires current.method != 'card' or
  # now < current.created_at + 7 days (otherwise invalid_state), so a capture is refused from the
  # same instant, even before the clock runs; after the move, a capture starts only from
  # authorized. void_payment has the same requires, so that nothing but the clock moves a due card
  # payment, and it moves to expired. The scenarios show the day-7 edge both ways (capture, void,
  # expire, not due), bank transfer payments, every other status, and a merchant's key refused.
  # Left to the shell, as for any timed change: that its clock runs, and stores the answer.
  P17:
    promise: "An authorized card payment that is not captured within 7 days moves to expired and can no longer be captured."
    status: declared
    by: [payment.operation.expire_payment, payment.operation.capture_payment, payment.operation.void_payment, payment.operation.create_payment, payment.field.status, payment.field.method, payment.field.created_at, payment.entity.payment, payment.invariant.pending_only_for_bank_transfer, payment.event.expired, auth.field.key_kind, auth.entity.caller, auth.invariant.key_has_merchant, payment.error.invalid_state]
  # The stored payment holds when it was captured (captured_at; an invariant makes it present in
  # captured, partially_refunded and refunded), and capture_payment ensures output.captured_at =
  # now, the time of the capture that the shell gives. refund_payment requires
  # current.captured_at is present and now <= current.captured_at + 180 days, otherwise
  # refund_window_closed: "at most 180 days after" is <=, so a refund on the instant 180 days
  # after the capture is allowed and one a millisecond later is refused. The runtime checks it
  # before the handler, after the state (a payment that is not captured is invalid_state). As
  # for refunded_amount (P11), the shell stores the answer's captured_at in the record.
  P18:
    promise: "A refund can be requested at most 180 days after the payment was captured, after which it is refused as \"refund_window_closed\"."
    status: declared
    by: [refund.operation.refund_payment, payment.operation.capture_payment, payment.entity.payment, payment.entity.capture_result, payment.field.captured_at, payment.invariant.captured_payment_has_capture_time, refund.error.refund_window_closed]
  P19:
    promise: "All timestamps in requests, answers and events are UTC in ISO 8601 format with a trailing \"Z\"."
    status: declared
    by: [payment.field.created_at, payment.field.occurred_at, payment.field.captured_at]
  # Declared for each call that changes the status: create_payment emits exactly one of
  # payment.authorized (when output.status = 'authorized') or payment.pending (when
  # output.status = 'pending'); capture_payment exactly one payment.captured; void_payment
  # exactly one payment.voided; refund_payment exactly one of payment.partially_refunded (when
  # output.refunded_total < output.captured_amount) or payment.refunded (when
  # output.refunded_total = output.captured_amount). Its ensures state the values of the event:
  # the payment id, merchant id, amount and currency of the payment, new_status (the status of
  # the answer, or the one that the event's name says for a refund), previous_status = the
  # stored status (absent on create, which has no earlier status), and the event id comes from
  # the shell (delivery.id, newEventId), and event.occurred_at = now in each of the four
  # operations: the time of the change is the time of the call, which the shell gives (E2 is
  # met). The move authorized to expired now has a call, expire_payment, the timed change of
  # P17, which emits exactly one payment.expired with the same ensures. Lost: the moves pending to
  # authorized and pending to failed (a bank transfer that arrives, or does not) still have no
  # call: they come from the bank, not from a merchant nor from a time that the contract knows,
  # so no event is stated for them, payment.failed does not exist, and nothing states that such a
  # move publishes one (E3).
  P20:
    promise: "Each change of payment status publishes exactly one event named \"payment.<new_status>\" carrying the event id, payment id, merchant id, amount, currency, previous status, new status and the time of the change."
    status: workaround
    by: [payment.operation.create_payment, payment.operation.capture_payment, payment.operation.void_payment, refund.operation.refund_payment, payment.operation.expire_payment, payment.event.pending, payment.event.authorized, payment.event.captured, payment.event.voided, payment.event.partially_refunded, payment.event.refunded, payment.event.expired, payment.field.event_id, payment.field.occurred_at]
    hole: E3
  # Each event has delivery { id: event_id, orderBy: payment_id }, and the contract uses the
  # Postgres plugin, so the outbox keeps the delivery: insertEvents writes the events in the
  # transaction of the change (none is lost), a row stays until markPublished (at least once),
  # nextEvents gives the events of one payment in the order they were written, with a sequence 1
  # higher each time, and event_id is the primary key of the outbox. The shell gives event_id
  # (newEventId), and a sent again event keeps it, so a consumer can discard a duplicate by it.
  # The transport is the user's: it sends what nextEvents gives, then calls markPublished.
  P21:
    promise: "Events are delivered at least once, in the order of the changes for any one payment, and a consumer can discard duplicates by event id."
    status: declared
    by: [payment.event.pending, payment.event.authorized, payment.event.captured, payment.event.voided, payment.event.partially_refunded, payment.event.refunded, payment.event.expired, payment.field.event_id, payment.field.payment_id]
  # Stated: the caller carries the kind of its key (secret or read_only) and its merchant;
  # create, capture, void and refund allow only caller.key_kind = 'secret' of the merchant of the
  # request and of the payment; get_payment and get_refund allow either kind of that merchant.
  # So a read-only key cannot write, and a key of another merchant can do nothing to a payment.
  # The shell's clock is a caller too (key_kind clock, with no merchant): each of these rules
  # needs caller.merchant_id is present, so the clock can do none of these, and only it may call
  # expire_payment (P17).
  # Lost: the names of the refusals. An operation has one callers.otherwise, and P16 needs it to
  # be not_found, so a read-only key that tries to write is answered not_found, not "forbidden";
  # callers cannot answer forbidden for one failed condition and not_found for another, and no
  # other rule may read the caller. "unauthorized" (no key, or a key that is not valid) is
  # authentication, which stays in the shell: the runtime takes no caller as a ContractViolation,
  # not as a refusal, and the manifest cannot state that the shell answers "unauthorized". So
  # the manifest keeps who may do what; the shell keeps the key and "unauthorized"; "forbidden"
  # is kept by no one.
  P22:
    promise: "Only a merchant's own secret API key may create, capture, void or refund its payments, while a read-only key may only read them, and any other caller is refused as \"unauthorized\" or \"forbidden\"."
    status: workaround
    by: [auth.entity.caller, auth.field.key_kind, payment.field.merchant_id, payment.operation.create_payment, payment.operation.capture_payment, payment.operation.void_payment, refund.operation.refund_payment, payment.operation.get_payment, refund.operation.get_refund]
    hole: D2
  P23:
    promise: "Answers and events never contain a full card number or security code, showing at most the card brand, the last 4 digits and the expiry."
    status: declared
    by: [card.entity.card_summary, card.field.brand, card.field.last4, payment.entity.created_payment, payment.entity.payment]
  # Within the major version, urn-forge diff refuses a removed or renamed field or refusal name. It also refuses a new
  # event type, which the promise allows: callers are not said to ignore unknown values. The 12 months for which a
  # major version is supported is how long the operator runs it, which nothing that urn-forge builds can check.
  P24:
    promise: "Within one major API version, fields and refusal names are never removed or renamed, new optional fields and new event types may be added, and a major version is supported for at least 12 months after its successor is released."
    status: workaround
    by: [manifest.version]
    hole: E4
