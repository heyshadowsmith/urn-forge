# The traceability chain, end to end (mvp-plan.md, build step 10). Any broken link turns
# the build red: a missing handler (gate 1), a feature table header that is not a field
# (gate 3), a hand-edited generated file (gate 4), or a failing scenario. A second job
# builds the docs site, so a broken page or dead link fails too. The same checks also run
# on self/, urn-forge's own domain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        id: install
        run: npm ci

      # The three checks below always run once dependencies are installed, so one failure
      # does not hide another: each broken link reports under its own step.
      - name: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # Vitest does not type-check. This runs tsc over src/, tests/, example/ and self/, so
      # the type-level tests (`@ts-expect-error`) are enforced too: a missing handler, a
      # plain value where a branded one belongs, or a primitive a plugin does not handle.
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: urn-forge verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        run: npx urn-forge verify --config example/urn-forge.config.ts

      - name: cucumber-js
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        run: npx cucumber-js

      # urn-forge's own domain (self/): the toolchain's pure functions, declared and
      # traced with urn-forge, so the chain is checked on a second domain.
      - name: urn-forge verify (self)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        run: npx urn-forge verify --config self/urn-forge.config.ts

      - name: cucumber-js (self)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        run: npx cucumber-js --profile self

      # The insurance domain (invariants plan): dates, exact decimals, an optional field and
      # invariants, strict from the start.
      - name: urn-forge verify (insurance)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        # Pass 8 compares sunset dates with the commit's date, never the clock, so a rerun of
        # this commit later gives the same verdict (lifecycle plan, decision 5).
        run: npm run verify:insurance -- --reference-date "$(git log -1 --format=%cs)"

      - name: cucumber-js (insurance)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        run: npm run test:features:insurance

      # The tutorial's three snapshots (docs/tutorials), so the code the tutorials show is
      # code that compiles, verifies and passes.
      - name: urn-forge verify (tutorial)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        run: npm run verify:tutorial

      - name: cucumber-js (tutorial)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/urn-forge
        run: npm run test:features:tutorial

  # Spec §6 and §9: the same inputs give the same bytes and the same verdict in any locale
  # and time zone. Turkish changes case mapping and collation; Chatham is UTC+12:45.
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Pacific/Chatham
      LANG: tr_TR.UTF-8
      LC_ALL: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: npm test
        run: npm test

      - name: Recompile each domain; the committed files must not change
        working-directory: packages/urn-forge
        run: |
          npm run compile:example
          npm run compile:self
          npm run compile:insurance
          git diff --exit-code

      - name: urn-forge verify
        working-directory: packages/urn-forge
        run: |
          npm run verify:example
          npm run verify:self
          npm run verify:insurance

  # Gate 5 (lifecycle plan): no breaking change to a live URN. A pull request is checked out
  # as its merge commit, so HEAD^1 is the tip of the base branch, and the diff shows exactly
  # what the pull request changes in each domain's manifest.
  compatibility:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: urn-forge diff of each domain against the base branch
        working-directory: packages/urn-forge
        run: npm run diff:base -- HEAD^1

  # The path a person takes outside this repository: pack urn-forge, install the tarball in a
  # new project, run urn-forge init, then verify and the scenarios (scripts/test-tarball.mjs).
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install the tarball in a new project and run init, verify and the scenarios
        run: npm run test:tarball

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build the docs site
        run: npm run docs:build
