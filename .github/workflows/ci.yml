# Every check of the repository, in one job: `npm run check`, the same command that a person or an
# agent runs before a pull request (scripts/check.mjs). It runs the tests and the type check, verify
# and the scenarios of each domain, the tarball test and the docs build. On a pull request, it also
# compares each domain with the base branch: diff as a report, and gate 5 on self/.
#
# A pull request is checked out as its merge commit, so HEAD^1 is the tip of the base branch. A
# change only to plans or contributor guides runs no check.
name: CI

on:
  pull_request:
    paths-ignore:
      - 'planning/**'
      - 'contributing/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run check
        run: npm run check -- ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
