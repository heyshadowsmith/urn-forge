<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none" role="img" aria-labelledby="t">
  <title id="t">A URN traced from the manifest through the IR, the generated contracts and core.ts to a feature that passes</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#39ff14" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect width="480" height="480" rx="20"/></clipPath>
    <style>
      .label { font: 500 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #c9ffbc; }
      .dim { fill: #5f8f63; }
      .ok { fill: #39ff14; }
      .node { fill: #07120a; stroke: #39ff14; stroke-width: 1.4; }
      .pulse { stroke-dasharray: 46 1100; stroke-dashoffset: 1086; animation: run 3.6s cubic-bezier(.55,.1,.45,.9) infinite; }
      .node-lit { animation: lit 3.6s linear infinite; opacity: 0; }
      .n2 { animation-delay: .62s } .n3 { animation-delay: 1.24s } .n4 { animation-delay: 1.86s } .n5 { animation-delay: 2.48s }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes run { from { stroke-dashoffset: 1086 } to { stroke-dashoffset: -46 } }
      @keyframes lit { 0%, 100% { opacity: 0 } 6% { opacity: .9 } 22% { opacity: 0 } }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; stroke-dasharray: none; stroke-opacity: .7; }
        .node-lit, .caret { animation: none; }
        .node-lit { opacity: .35; }
      }
    </style>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="480" height="480" fill="#040704"/>
    <rect width="480" height="480" fill="url(#grid)"/>

    <!-- window chrome -->
    <rect width="480" height="44" fill="#071009"/>
    <path d="M0 44H480" stroke="#39ff14" stroke-opacity=".25"/>
    <circle cx="24" cy="22" r="4.5" fill="#39ff14" fill-opacity=".85"/>
    <circle cx="40" cy="22" r="4.5" fill="#39ff14" fill-opacity=".35"/>
    <circle cx="56" cy="22" r="4.5" fill="#39ff14" fill-opacity=".15"/>
    <text x="80" y="26.5" class="label dim">$</text>
    <text x="94" y="26.5" class="label">urn-forge verify</text>
    <rect x="232" y="15" width="8" height="15" fill="#39ff14" class="caret"/>

    <!-- the trace: dim base, glowing pulse on top -->
    <path d="M155 112H335V192H155V272H335V352H155V432" stroke="#39ff14" stroke-opacity=".28" stroke-width="2"/>
    <path d="M155 112H335V192H155V272H335V352H155V432" stroke="#39ff14" stroke-width="3" stroke-linecap="round" class="pulse" filter="url(#glow)"/>

    <!-- nodes -->
    <g>
      <rect x="60" y="90" width="190" height="44" rx="8" class="node"/>
      <rect x="60" y="90" width="190" height="44" rx="8" fill="#39ff14" fill-opacity=".14" class="node-lit"/>
      <text x="76" y="116.5" class="label">domain.manifest.yaml</text>
    </g>
    <g>
      <rect x="250" y="170" width="170" height="44" rx="8" class="node"/>
      <rect x="250" y="170" width="170" height="44" rx="8" fill="#39ff14" fill-opacity=".14" class="node-lit n2"/>
      <text x="266" y="196.5" class="label">IR <tspan class="dim">· sha256</tspan></text>
    </g>
    <g>
      <rect x="60" y="250" width="190" height="44" rx="8" class="node"/>
      <rect x="60" y="250" width="190" height="44" rx="8" fill="#39ff14" fill-opacity=".14" class="node-lit n3"/>
      <text x="76" y="276.5" class="label">*.generated.ts</text>
    </g>
    <g>
      <rect x="250" y="330" width="170" height="44" rx="8" class="node"/>
      <rect x="250" y="330" width="170" height="44" rx="8" fill="#39ff14" fill-opacity=".14" class="node-lit n4"/>
      <text x="266" y="356.5" class="label">core.ts <tspan class="dim">satisfies</tspan></text>
    </g>
    <g>
      <rect x="60" y="410" width="190" height="44" rx="8" class="node"/>
      <rect x="60" y="410" width="190" height="44" rx="8" fill="#39ff14" fill-opacity=".14" class="node-lit n5"/>
      <text x="76" y="436.5" class="label">.feature <tspan class="ok">✓ passed</tspan></text>
    </g>

    <!-- gate markers along the right edge -->
    <text x="442" y="116.5" class="label dim" text-anchor="end">pass 1–4</text>
    <text x="442" y="276.5" class="label dim" text-anchor="end">gate 4</text>
    <text x="442" y="436.5" class="label dim" text-anchor="end">gate 3</text>
    <text x="60" y="356.5" class="label dim">gate 1</text>

    <rect width="480" height="480" fill="url(#scan)"/>
    <rect width="480" height="480" fill="url(#vignette)"/>
  </g>
  <rect x=".75" y=".75" width="478.5" height="478.5" rx="19.25" stroke="#39ff14" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
