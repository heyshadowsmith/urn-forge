manifest:
  namespace: demo
  domain: states
  version: 1.0.0

booking.field.reference:
  primitive: string
  regex: '[A-Z]{8}'
  description: The reference of a booking, eight capital letters
booking.field.state:
  primitive: enum
  values: [confirmed, seated, completed, cancelled]
  moves:
    confirmed: [seated, cancelled]
    seated: [completed]
  description: The state of a booking
booking.field.party_size:
  primitive: integer
  min: 1
  max: 20
  description: The number of guests
booking.field.refund:
  primitive: decimal
  scale: 2
  min: '0.00'
  description: The deposit that a cancellation pays back

booking.entity.booking:
  description: A booking
  key: booking.field.reference
  fields:
    - ref: booking.field.reference
    - ref: booking.field.state
    - ref: booking.field.party_size
booking.entity.booking_ref:
  description: The reference of one booking
  fields:
    - ref: booking.field.reference
booking.entity.party_change:
  description: A new party size for a booking
  fields:
    - ref: booking.field.reference
    - ref: booking.field.party_size
booking.entity.cancellation:
  description: What a cancellation gives back
  fields:
    - ref: booking.field.reference
    - ref: booking.field.refund

booking.error.invalid_state:
  description: The booking is not in a state that allows this
  category: conflict
  retryable: false
  message: Booking {reference} is {state}
  fields:
    - ref: booking.field.reference
    - ref: booking.field.state

booking.operation.seat_booking:
  description: Seat the party of a booking
  input: booking.entity.booking_ref
  output: booking.entity.booking
  changes:
    entity: booking.entity.booking
    from: [confirmed]
    to: seated
    otherwise: booking.error.invalid_state
  errors: [booking.error.invalid_state]
booking.operation.change_party:
  description: Change the party size of a booking; its state stays
  input: booking.entity.party_change
  output: booking.entity.booking
  changes:
    entity: booking.entity.booking
    from: [confirmed]
    otherwise: booking.error.invalid_state
  errors: [booking.error.invalid_state]
booking.operation.cancel_booking:
  description: Cancel a booking
  input: booking.entity.booking_ref
  output: booking.entity.cancellation
  changes:
    entity: booking.entity.booking
    from: [confirmed]
    to: cancelled
    otherwise: booking.error.invalid_state
  errors: [booking.error.invalid_state]
