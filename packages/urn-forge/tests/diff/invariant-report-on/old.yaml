manifest:
  namespace: demo
  domain: shop
  version: 1.0.0

order.field.sku: { primitive: string, maxLength: 12, description: A stock code }
order.field.qty: { primitive: integer, min: 1, max: 10 }
order.field.pack: { primitive: integer, multipleOf: 2 }
order.field.code: { primitive: string, regex: '[A-Z]+' }
order.field.colour: { primitive: enum, values: [red, blue] }
order.field.note: { primitive: string }
order.field.total: { primitive: decimal, max: "1000", scale: 2 }
order.field.size: { primitive: enum, values: [s, m] }
order.field.ref_no: { primitive: string }
order.field.spare: { primitive: integer }

order.entity.order:
  description: An order that a caller sends
  fields:
    - ref: order.field.sku
    - ref: order.field.qty
    - ref: order.field.pack
    - ref: order.field.code
    - ref: order.field.colour
    - { ref: order.field.note, required: false }
order.entity.receipt:
  description: A receipt that a caller receives
  fields:
    - ref: order.field.sku
    - ref: order.field.total
    - ref: order.field.size
    - { ref: order.field.ref_no, required: false }

order.invariant.small:
  description: d
  on: order.entity.order
  rule: qty < pack
  message: m

order.error.out_of_stock:
  description: No stock is left
  category: conflict
  retryable: true
  message: No stock for {sku}
  fields:
    - ref: order.field.sku

order.operation.place:
  description: Places an order
  input: order.entity.order
  output: order.entity.receipt
  errors: [order.error.out_of_stock]
