manifest:
  namespace: demo
  domain: shop
  version: 1.0.0

order.field.placed_at: { primitive: timestamp, precision: 3, description: When the order was placed }
order.entity.order:
  description: An order that a caller sends
  fields:
    - ref: order.field.placed_at
order.operation.place:
  description: Places an order
  input: order.entity.order
  output: order.entity.order
