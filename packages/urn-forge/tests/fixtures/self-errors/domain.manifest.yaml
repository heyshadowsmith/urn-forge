# The target of docs/project/error-kind-plan.md, written first (step 0): the slice of
# urn-forge's own domain that `parse_short_key` needs. The fixture harness records what
# today's compiler makes of it; each step of the plan changes that, until step 3 moves it
# into self/domain.manifest.yaml and this fixture is removed.
manifest:
  namespace: urn_forge
  domain: toolchain
  version: 0.1.0
  stability: experimental

# Already in self/ (copied here so the slice compiles on its own).
naming.field.context:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The context segment of a short key, such as policy
naming.field.identifier:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The identifier segment of a short key, such as deductible_amount
naming.field.kind:
  primitive: string
  oneOf: [field, entity, operation]
  description: The kind segment of a URN; the kinds the compiler supports

# New.
naming.field.short_key:
  primitive: string
  minLength: 1
  description: A manifest key as written, such as policy.field.deductible_amount
naming.field.kind_segment:
  primitive: string
  regex: '[a-z]+'
  description: The middle segment of a short key, whether or not it is a kind

naming.entity.short_key_input:
  description: A short key to parse
  fields: [{ ref: naming.field.short_key }]
naming.entity.short_key_parts:
  description: The three segments of a valid short key
  fields:
    - ref: naming.field.context
    - ref: naming.field.kind
    - ref: naming.field.identifier

naming.error.invalid_short_key:
  description: The key does not have the form <context>.<kind>.<identifier> in lowercase snake_case
  category: validation
  retryable: false
  message: Short key {short_key} is not <context>.<kind>.<identifier> in lowercase snake_case
  fields: [{ ref: naming.field.short_key }]
naming.error.unsupported_kind:
  description: The kind is in the spec but the compiler does not support it yet
  category: validation
  retryable: false
  message: Kind {kind_segment} in {short_key} is not supported yet
  fields: [{ ref: naming.field.short_key }, { ref: naming.field.kind_segment }]
naming.error.unknown_kind:
  description: The kind is not a kind of the spec
  category: validation
  retryable: false
  message: Kind {kind_segment} in {short_key} is not a kind
  fields: [{ ref: naming.field.short_key }, { ref: naming.field.kind_segment }]

naming.operation.parse_short_key:
  description: Split a short key into its context, kind and identifier
  input: naming.entity.short_key_input
  output: naming.entity.short_key_parts
  errors:
    - naming.error.invalid_short_key
    - naming.error.unsupported_kind
    - naming.error.unknown_kind
