# Each problem that a unique list of properties can have.
manifest:
  namespace: demo
  domain: lists
  version: 1.0.0

order.field.sku:
  primitive: string
  description: A product
order.field.tag:
  primitive: string
  description: A tag
order.entity.part:
  description: A part of a line
  fields:
    - ref: order.field.sku
order.entity.line:
  description: One line
  fields:
    - ref: order.field.sku
    - ref: order.field.tag
      many: true
    - ref: order.entity.part
order.entity.order:
  description: An order
  fields:
    - ref: order.entity.line
      as: unknown_name
      many: { unique: [location] }
    - ref: order.entity.line
      as: list_and_entity
      many: { unique: [tag, part] }
    - ref: order.entity.line
      as: twice
      many: { unique: [sku, sku] }
    - ref: order.field.tag
      as: values
      many: { unique: [tag] }
