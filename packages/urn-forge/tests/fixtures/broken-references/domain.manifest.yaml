# Problems from passes 3, 4 and 7, each reported at its position.
manifest:
  namespace: demo
  domain: broken
  version: 0.1.0

geo_metry.field.radius: { primitive: float }
geo.field.metry_radius: { primitive: float }
order.field.quantity:   { primitive: integer, min: 10, max: 1 }
order.field.code:       { primitive: string, minLength: 3, maxLength: 2 }
order.field.size:       { primitive: integer, min: 1, max: 1, notIn: [1] }

order.entity.line:
  description: One line
  fields:
    - ref: order.field.quantity
    - ref: order.field.missing
    - ref: order.entity.line
order.error.limit_exceeded:
  description: The order is over the limit
  category: precondition
  retryable: false
  message: Quantity {quantiy} is over the limit {limit}
  fields:
    - ref: order.field.quantity
    - ref: order.field.code
      required: false
order.error.limit:
  description: A note about {code}
  category: validation
  retryable: false
  message: Code {code} is optional here
  fields:
    - ref: order.field.code
      required: false

order.operation.place:
  description: Place an order
  input: order.field.quantity
  output: order.entity.line
order.operation.reprice:
  description: Reprice an order
  input: order.entity.line
  output: order.entity.line
  errors: [order.error.limit_exceeded, order.entity.line, order.error.limit_exceeded]
order.field.kind:       { primitive: string }
order.error.wrong_kind:
  description: An error with a field named kind
  category: validation
  retryable: false
  message: Wrong
  fields: [{ ref: order.field.kind }]
