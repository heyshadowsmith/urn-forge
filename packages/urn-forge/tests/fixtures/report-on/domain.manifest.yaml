# A restaurant rule. A party of 7 or more with no
# deposit is refused, and the issue goes on deposit, the field that the caller must correct.
manifest:
  namespace: demo
  domain: resto
  version: 0.1.0

booking.field.party_size:
  primitive: integer
  min: 1
  max: 12
  description: The number of guests
booking.field.deposit:
  primitive: decimal
  scale: 2
  min: "0.01"
  description: The deposit that the guest pays
booking.field.notes:
  primitive: string
  maxLength: 200
  description: Free text for the restaurant

booking.entity.request:
  description: A request for a table
  fields:
    - ref: booking.field.party_size
    - ref: booking.field.deposit
      required: false
    - ref: booking.field.notes
      as: guest_notes
      required: false

booking.invariant.large_party_has_deposit:
  description: A party of 7 or more pays a deposit
  on: booking.entity.request
  rule: party_size <= 6 or deposit is present
  reportOn: deposit
  message: A party of 7 or more must pay a deposit

booking.operation.book:
  description: Book a table
  input: booking.entity.request
  output: booking.entity.request
