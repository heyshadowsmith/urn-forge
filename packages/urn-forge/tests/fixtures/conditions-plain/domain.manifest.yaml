# Requires rules in a domain where no operation changes a record.
manifest:
  namespace: demo
  domain: conditions
  version: 1.0.0

booking.field.reference:
  primitive: string
  regex: '[A-Z]{8}'
  description: The reference of a booking
booking.field.party_size:
  primitive: integer
  min: 1
  max: 20
  description: The number of guests
booking.field.deposit_token:
  primitive: string
  minLength: 1
  description: A token that pays the deposit
booking.entity.request:
  description: A request for a table
  fields:
    - ref: booking.field.party_size
    - ref: booking.field.deposit_token
      required: false
booking.entity.booking:
  description: A booking
  fields:
    - ref: booking.field.reference
    - ref: booking.field.party_size
booking.error.party_too_large_for_online:
  description: A party of 13 or more books by phone
  category: validation
  retryable: false
  message: A party of {party_size} books by phone
  fields:
    - ref: booking.field.party_size
booking.error.deposit_required:
  description: A party of 7 or more pays a deposit
  category: validation
  retryable: false
  message: A party of {party_size} needs a deposit
  fields:
    - ref: booking.field.party_size
booking.operation.create_booking:
  description: Make a booking
  input: booking.entity.request
  output: booking.entity.booking
  requires:
    - rule: input.party_size < 13
      otherwise: booking.error.party_too_large_for_online
    - rule: input.party_size < 7 or input.deposit_token is present
      otherwise: booking.error.deposit_required
  errors: [booking.error.party_too_large_for_online, booking.error.deposit_required]

