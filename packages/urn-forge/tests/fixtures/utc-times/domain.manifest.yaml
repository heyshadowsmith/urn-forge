# UTC times: the target of utc-times.test.ts. A receipt time with exactly 3 digits after the
# second, a billing period of one calendar month, and a cancel deadline of 2 hours before a UTC
# start. Every instant is UTC; the contract has no time zone.
manifest:
  namespace: demo
  domain: utc
  version: 1.0.0

stock.field.sku:
  primitive: string
  regex: '[A-Z0-9-]{1,12}'
  description: A stock code
stock.field.received_at:
  primitive: timestamp
  precision: 3
  description: When the goods arrived, in UTC, with milliseconds
stock.entity.receipt:
  description: Goods that arrived
  key: stock.field.sku
  fields:
    - ref: stock.field.sku
    - ref: stock.field.received_at
stock.operation.receive:
  description: Record goods that arrived
  input: stock.entity.receipt
  output: stock.entity.receipt
billing.field.period_start:
  primitive: timestamp
  description: The start of a billing period, in UTC
billing.field.period_end:
  primitive: timestamp
  description: The end of a billing period, in UTC
billing.field.starts_on:
  primitive: date
  description: The first day of a plan
billing.field.ends_on:
  primitive: date
  description: The last day of a plan, one calendar month on
billing.field.plan_id:
  primitive: string
  regex: 'pln_[a-z0-9]{4}'
  description: The id of a plan
billing.entity.period:
  description: A billing period of one calendar month
  fields:
    - ref: billing.field.period_start
    - ref: billing.field.period_end
billing.entity.plan:
  description: A plan, from a day to the same day one calendar month on
  key: billing.field.plan_id
  fields:
    - ref: billing.field.plan_id
    - ref: billing.field.starts_on
    - ref: billing.field.ends_on
billing.invariant.one_month:
  description: A plan lasts one calendar month
  on: billing.entity.plan
  rule: ends_on = starts_on + 1 months
  message: A plan ends one calendar month after it starts
billing.operation.renew:
  description: Start the next billing period, one calendar month long
  input: billing.entity.period
  output: billing.entity.period
  ensures:
    - output.period_start = input.period_end
    - output.period_end = output.period_start + 1 months
