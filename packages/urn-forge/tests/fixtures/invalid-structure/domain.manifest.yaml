# Pass 1 (meta-schema) problems, each reported at its position.
manifest:
  namespace: demo
  domain: broken
  version: 1

Order.field.quantity:  { primitive: integer }
order.event.placed:    { description: An order was placed }
order.field.weight:    { primitive: decimal }
order.field.note:      { primitive: string, min: 1 }
order.field.count:     { primitive: integer, max: 1.5 }
order.field.speed:     { primitive: enum, values: [] }
order.field.size:      { primitive: enum, values: [s, m, s] }
order.field.pattern:   { primitive: string, regex: '[a-' }
order.entity.line:
  fields: []
order.error.sold_out:
  description: The item is sold out
  category: gone
  retryable: false
  message: Sold out
  recordAs: order.event.sale_refused
order.error.no_message:
  description: An error without a message
  category: conflict
  retryable: true
