# Refusals: the target of refusals.test.ts. A booking request that does not parse answers
# invalid_request; a refusal for no availability carries alternatives on the requested date for
# the same party; and cancel_booking changes a stored booking, for commit.
manifest:
  namespace: demo
  domain: refusals
  version: 1.0.0

booking.field.booking_id:
  primitive: string
  regex: 'bkg_[a-z0-9]{8}'
  description: The id of a booking
booking.field.date:
  primitive: date
  description: The day of the booking
booking.field.starts_at:
  primitive: timestamp
  description: When the booking starts
booking.field.party_size:
  primitive: integer
  min: 1
  max: 20
  description: The number of guests
booking.field.status:
  primitive: enum
  values: [CONFIRMED, CANCELLED]
  moves:
    CONFIRMED: [CANCELLED]
  description: The status of a booking
booking.entity.slot:
  description: A time that has a free table
  fields:
    - ref: booking.field.starts_at
    - ref: booking.field.party_size
booking.entity.booking_request:
  description: A request for a table
  fields:
    - ref: booking.field.date
    - ref: booking.field.starts_at
    - ref: booking.field.party_size
booking.entity.booking:
  description: A booking
  key: booking.field.booking_id
  fields:
    - ref: booking.field.booking_id
    - ref: booking.field.status
    - ref: booking.field.date
    - ref: booking.field.starts_at
    - ref: booking.field.party_size
booking.entity.booking_ref:
  description: The booking to cancel
  fields:
    - ref: booking.field.booking_id
booking.event.created:
  description: A booking was made
  fields:
    - ref: booking.field.booking_id
booking.event.cancelled:
  description: A booking was cancelled
  fields:
    - ref: booking.field.booking_id
booking.error.invalid_request:
  description: The request does not parse
  category: validation
  retryable: false
  message: The request is not valid
booking.error.no_availability:
  description: No table is free at the time
  category: conflict
  retryable: true
  message: No table on {date}
  fields:
    - ref: booking.field.date
    - ref: booking.entity.slot
      as: alternatives
      many: true
      required: false
booking.error.invalid_state:
  description: The booking is not in a status for this
  category: conflict
  retryable: false
  message: Booking {booking_id} is {status}
  fields:
    - ref: booking.field.booking_id
    - ref: booking.field.status
booking.operation.create_booking:
  description: Book a table, or refuse with other times on the same day for the same party
  input: booking.entity.booking_request
  output: booking.entity.booking
  rejects: booking.error.invalid_request
  refuses:
    - error: booking.error.no_availability
      ensures:
        - 'all(alt in error.alternatives: date(alt.starts_at) = input.date)'
        - 'all(alt in error.alternatives: alt.party_size = input.party_size)'
  emits: [booking.event.created]
  errors: [booking.error.invalid_request, booking.error.no_availability]
booking.operation.cancel_booking:
  description: Cancel a confirmed booking
  input: booking.entity.booking_ref
  output: booking.entity.booking
  changes:
    entity: booking.entity.booking
    from: [CONFIRMED]
    to: CANCELLED
    otherwise: booking.error.invalid_state
  emits:
    - event: booking.event.cancelled
  errors: [booking.error.invalid_state]
