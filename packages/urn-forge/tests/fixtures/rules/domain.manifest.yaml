# One invariant for each operator on each primitive.
# tests/invariants.test.ts runs each exported rule on values at its edges.
manifest:
  namespace: demo
  domain: rules
  version: 0.1.0

r.field.i1: { primitive: integer }
r.field.i2: { primitive: integer }
r.field.f1: { primitive: float }
r.field.f2: { primitive: float }
r.field.d1: { primitive: decimal }
r.field.d2: { primitive: decimal }
r.field.dt1: { primitive: date }
r.field.dt2: { primitive: date }
r.field.t1: { primitive: timestamp }
r.field.t2: { primitive: timestamp }
r.field.s1: { primitive: string }
r.field.s2: { primitive: string }
r.field.b1: { primitive: boolean }
r.field.e1: { primitive: enum, values: [a, b] }
r.field.opt: { primitive: decimal }

r.entity.sample:
  description: One field of each primitive
  fields:
    - ref: r.field.i1
    - ref: r.field.i2
    - ref: r.field.f1
    - ref: r.field.f2
    - ref: r.field.d1
    - ref: r.field.d2
    - ref: r.field.dt1
    - ref: r.field.dt2
    - ref: r.field.t1
    - ref: r.field.t2
    - ref: r.field.s1
    - ref: r.field.s2
    - ref: r.field.b1
    - ref: r.field.e1
    - { ref: r.field.opt, required: false }

r.invariant.int_lt:
  description: int_lt
  on: r.entity.sample
  rule: "i1 < i2"
  message: int_lt does not hold
r.invariant.int_le:
  description: int_le
  on: r.entity.sample
  rule: "i1 <= i2"
  message: int_le does not hold
r.invariant.int_eq:
  description: int_eq
  on: r.entity.sample
  rule: "i1 = i2"
  message: int_eq does not hold
r.invariant.int_ne:
  description: int_ne
  on: r.entity.sample
  rule: "i1 != i2"
  message: int_ne does not hold
r.invariant.int_ge:
  description: int_ge
  on: r.entity.sample
  rule: "i1 >= i2"
  message: int_ge does not hold
r.invariant.int_gt:
  description: int_gt
  on: r.entity.sample
  rule: "i1 > i2"
  message: int_gt does not hold
r.invariant.int_plus:
  description: int_plus
  on: r.entity.sample
  rule: "i1 + 1 = i2"
  message: int_plus does not hold
r.invariant.int_minus:
  description: int_minus
  on: r.entity.sample
  rule: "i2 - i1 >= 2"
  message: int_minus does not hold
r.invariant.float_lt:
  description: float_lt
  on: r.entity.sample
  rule: "f1 < f2"
  message: float_lt does not hold
r.invariant.float_literal:
  description: float_literal
  on: r.entity.sample
  rule: "f1 > 0.5"
  message: float_literal does not hold
r.invariant.dec_lt:
  description: dec_lt
  on: r.entity.sample
  rule: "d1 < d2"
  message: dec_lt does not hold
r.invariant.dec_eq:
  description: dec_eq
  on: r.entity.sample
  rule: "d1 = d2"
  message: dec_eq does not hold
r.invariant.dec_plus:
  description: dec_plus
  on: r.entity.sample
  rule: "d1 + d2 = '3.30'"
  message: dec_plus does not hold
r.invariant.dec_minus:
  description: dec_minus
  on: r.entity.sample
  rule: "d2 - d1 >= 1"
  message: dec_minus does not hold
r.invariant.date_lt:
  description: date_lt
  on: r.entity.sample
  rule: "dt1 < dt2"
  message: date_lt does not hold
r.invariant.date_literal:
  description: date_literal
  on: r.entity.sample
  rule: "dt1 >= '2026-01-01'"
  message: date_literal does not hold
r.invariant.ts_lt:
  description: ts_lt
  on: r.entity.sample
  rule: "t1 < t2"
  message: ts_lt does not hold
r.invariant.ts_eq:
  description: ts_eq
  on: r.entity.sample
  rule: "t1 = t2"
  message: ts_eq does not hold
r.invariant.str_ne:
  description: str_ne
  on: r.entity.sample
  rule: "s1 != s2"
  message: str_ne does not hold
r.invariant.enum_eq:
  description: enum_eq
  on: r.entity.sample
  rule: "e1 = 'a'"
  message: enum_eq does not hold
r.invariant.bool_eq:
  description: bool_eq
  on: r.entity.sample
  rule: "b1 = true"
  message: bool_eq does not hold
r.invariant.opt_guard:
  description: opt_guard
  on: r.entity.sample
  rule: "opt is absent or opt < d1"
  message: opt_guard does not hold
r.invariant.not_rule:
  description: not_rule
  on: r.entity.sample
  rule: "not i1 = 0"
  message: not_rule does not hold
r.invariant.or_rule:
  description: or_rule
  on: r.entity.sample
  rule: "i1 = 0 or i2 = 0"
  message: or_rule does not hold
# Days: a date plus or minus an integer of days, and the days between two dates.
r.invariant.date_plus_days:
  description: date_plus_days
  on: r.entity.sample
  rule: "dt2 <= dt1 + 28"
  message: date_plus_days does not hold
r.invariant.date_minus_days:
  description: date_minus_days
  on: r.entity.sample
  rule: "dt1 - 7 < dt2"
  message: date_minus_days does not hold
r.invariant.days_between:
  description: days_between
  on: r.entity.sample
  rule: "dt2 - dt1 >= 1"
  message: days_between does not hold
r.invariant.days_from_field:
  description: days_from_field
  on: r.entity.sample
  rule: "dt2 <= dt1 + i1"
  message: days_from_field does not hold
r.invariant.days_between_literal:
  description: days_between_literal
  on: r.entity.sample
  rule: "dt1 - '2026-01-01' >= 0"
  message: days_between_literal does not hold
r.invariant.date_of_timestamp:
  description: date_of_timestamp
  on: r.entity.sample
  rule: "date(t1) = dt1"
  message: date_of_timestamp does not hold
r.invariant.date_of_timestamp_plus_days:
  description: date_of_timestamp_plus_days
  on: r.entity.sample
  rule: "date(t1) + 1 = dt2"
  message: date_of_timestamp_plus_days does not hold
# reportOn: the issue goes on d1, which no order of this rule can put first (the guard must be on the left).
r.invariant.report_on_guarded:
  description: report_on_guarded
  on: r.entity.sample
  rule: "opt is absent or d1 < opt"
  reportOn: d1
  message: report_on_guarded does not hold
