# Every primitive and constraint, and an optional field reference.
manifest:
  namespace: demo
  domain: shop
  version: 0.1.0

order.field.quantity:  { primitive: integer, min: 1, max: 99, notEqual: 13 }
order.field.unit_cost: { primitive: float, min: 0, description: Price of one unit }
order.field.note:      { primitive: string, minLength: 1, maxLength: 140 }
order.field.total:     { primitive: float, min: 0 }
order.field.gift_wrap: { primitive: boolean }
order.field.delivery:  { primitive: string, oneOf: [standard, express, "click & collect"] }
order.field.sku:       { primitive: string, regex: '[A-Z]{3}-[0-9]{4}' }
order.field.tracking_url: { primitive: string, regex: 'https://track\.example/[0-9]+' }
order.field.terms_accepted: { primitive: boolean, mustBe: true, description: The buyer accepted the terms }

order.entity.line:
  description: One line of an order
  fields:
    - ref: order.field.sku
    - ref: order.field.quantity
    - ref: order.field.unit_cost
    - ref: order.field.note
      required: false
    - ref: order.field.gift_wrap
      required: false
    - ref: order.field.delivery
      required: false
    - ref: order.field.tracking_url
      required: false
    - ref: order.field.terms_accepted
order.entity.line_total:
  description: The cost of one line
  fields: [{ ref: order.field.total }]

order.operation.price_line:
  description: Price one order line
  input: order.entity.line
  output: order.entity.line_total
