# Compatibility: the target of compatibility.test.ts. Callers ignore what they do not know, so
# a new error, event or enum value in an answer is compatible. A removal is announced at least
# 6 months before its sunset date.
manifest:
  namespace: demo
  domain: compat
  version: 1.0.0
  compatibility:
    callers: ignore-unknown
    notice: 6 months

stock.field.sku:
  primitive: string
  maxLength: 12
  description: A stock code
stock.field.quantity:
  primitive: integer
  min: 0
  description: The units in stock
stock.field.state:
  primitive: enum
  values: [available, held]
  description: The state of the stock
stock.field.bin_code:
  primitive: string
  description: The bin of the stock, which the location replaced; no entity uses it now
  status: deprecated
  supersededBy: stock.field.location
  deprecatedOn: 2026-11-22
  sunsetDate: 2027-05-22
stock.field.location:
  primitive: string
  description: The location of the stock
stock.field.note:
  primitive: string
  description: A note, which no entity uses yet
stock.entity.stock_ref:
  description: The stock to read
  fields:
    - ref: stock.field.sku
stock.entity.stock:
  description: The stock of one code
  fields:
    - ref: stock.field.sku
    - ref: stock.field.quantity
    - ref: stock.field.state
    - ref: stock.field.location
stock.error.not_found:
  description: No stock has the code
  category: not_found
  retryable: false
  message: No stock for {sku}
  fields:
    - ref: stock.field.sku
stock.event.counted:
  description: The stock was counted
  fields:
    - ref: stock.field.sku
    - ref: stock.field.quantity
stock.operation.get_stock:
  description: Read the stock of one code
  input: stock.entity.stock_ref
  output: stock.entity.stock
  emits: [stock.event.counted]
  errors: [stock.error.not_found]
