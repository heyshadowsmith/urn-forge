# One field for each primitive and each constraint of the MECE model, stored in Postgres.
# tests/postgres.test.ts gives the same values to the Valibot schemas and to Postgres.
manifest:
  namespace: demo
  domain: stored
  version: 0.1.0

# boolean: membership
value.field.flag:          { primitive: boolean }
value.field.accepted:      { primitive: boolean, mustBe: true }
# enum: membership
value.field.size:          { primitive: enum, values: [s, m, l] }
# string: size, and shape (regex or format)
value.field.text:          { primitive: string }
value.field.code:          { primitive: string, minLength: 2, maxLength: 4 }
value.field.sku:           { primitive: string, regex: '[A-Z]{3}-[0-9]{4}' }
value.field.id:            { primitive: string, format: uuid }
value.field.email:         { primitive: string, format: email }
value.field.word:          { primitive: string, regex: '\w+\.\d+' }
value.field.line:          { primitive: string, regex: 'a.b|[^x]\s' }
value.field.hex:           { primitive: string, regex: '(?:0x)?[\da-fA-F]{2,4}' }
value.field.sample_id:     { primitive: integer }
# integer: range (inclusive), step, exclusion
value.field.count:         { primitive: integer }
value.field.quantity:      { primitive: integer, min: 1, max: 99, notIn: [13] }
value.field.pack:          { primitive: integer, min: 0, multipleOf: 6 }
# float: range (inclusive or exclusive), exclusion
value.field.ratio:         { primitive: float }
value.field.share:         { primitive: float, min: 0, max: 1 }
value.field.weight:        { primitive: float, exclusiveMin: 0, exclusiveMax: 1000 }
value.field.divisor:       { primitive: float, notIn: [0] }
# decimal: range (inclusive or exclusive), step (scale), exclusion; literals are quoted
value.field.amount:        { primitive: decimal }
value.field.price:         { primitive: decimal, min: "0.01", max: "9999.99", scale: 2, notIn: ["13.00"] }
value.field.rate:          { primitive: decimal, exclusiveMin: "0", exclusiveMax: "1" }
# date: range (inclusive)
value.field.day:           { primitive: date }
value.field.term_day:      { primitive: date, min: 2026-01-01, max: 2026-12-31 }
# timestamp: range (inclusive or exclusive)
value.field.at:            { primitive: timestamp }
value.field.window:        { primitive: timestamp, min: "2026-01-01T00:00:00Z", exclusiveMax: "2027-01-01T00:00:00Z" }

value.entity.sample:
  description: One value of each field
  key: value.field.sample_id
  fields:
    - { ref: value.field.sample_id }
    - { ref: value.field.word, required: false }
    - { ref: value.field.line, required: false }
    - { ref: value.field.hex, required: false }
    - { ref: value.field.flag, required: false }
    - { ref: value.field.accepted, required: false }
    - { ref: value.field.size, required: false }
    - { ref: value.field.text, required: false }
    - { ref: value.field.code, required: false }
    - { ref: value.field.sku, required: false }
    - { ref: value.field.id, required: false }
    - { ref: value.field.email, required: false }
    - { ref: value.field.count, required: false }
    - { ref: value.field.quantity, required: false }
    - { ref: value.field.pack, required: false }
    - { ref: value.field.ratio, required: false }
    - { ref: value.field.share, required: false }
    - { ref: value.field.weight, required: false }
    - { ref: value.field.divisor, required: false }
    - { ref: value.field.amount, required: false }
    - { ref: value.field.price, required: false }
    - { ref: value.field.rate, required: false }
    - { ref: value.field.day, required: false }
    - { ref: value.field.term_day, required: false }
    - { ref: value.field.at, required: false }
    - { ref: value.field.window, required: false }
