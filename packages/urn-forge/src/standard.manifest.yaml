# The standard set of rules: the keywords of JSON Schema, declared as any rule is. urn-forge loads it
# before a manifest. Its definitions are the types of its parameters, in urn-forge's namespace: a
# manifest's own names never clash with them.
manifest:
  namespace: urn_forge
  domain: standard
  version: 0.2.0

definitions:
  bound:
    description: A number that a value is compared with
    type: number

  count:
    description: A number of characters or items, 0 or more
    type: integer
    rules:
      - minimum: 0

  factor:
    description: A whole number that a value is a multiple of, 1 or more
    type: integer
    rules:
      - minimum: 1

  regular_expression:
    description: A regular expression
    type: string

  date_format:
    description: The format of a date or a time
    type: string
    rules:
      - enum: [date, date-time]

  choice:
    description: A value that is allowed
    type: string

  choices:
    description: The values that are allowed
    type: array
    items: choice

  property_name:
    description: The name of a property of an object
    type: string

  property_names:
    description: The names of properties of an object
    type: array
    items: property_name

rules:
  enum:
    description: The value is one of the choices
    parameters: [choices]
    rule: self in choices
    message: Must be one of {choices}

  const:
    description: The value is the choice
    parameters: [choice]
    rule: self == choice
    message: Must be {choice}

  minimum:
    description: The value is the bound or more
    parameters: [bound]
    rule: self >= bound
    message: Must be at least {bound}

  maximum:
    description: The value is the bound or less
    parameters: [bound]
    rule: self <= bound
    message: Must be at most {bound}

  exclusiveMinimum:
    description: The value is more than the bound
    parameters: [bound]
    rule: self > bound
    message: Must be more than {bound}

  exclusiveMaximum:
    description: The value is less than the bound
    parameters: [bound]
    rule: self < bound
    message: Must be less than {bound}

  multipleOf:
    description: The integer is a multiple of the factor
    parameters: [factor]
    rule: self % factor == 0
    message: Must be a multiple of {factor}

  minLength:
    description: The text has the count of characters or more
    parameters: [count]
    rule: size(self) >= count
    message: Must have at least {count} characters

  maxLength:
    description: The text has the count of characters or fewer
    parameters: [count]
    rule: size(self) <= count
    message: Must have at most {count} characters

  pattern:
    description: The text matches the regular expression
    parameters: [regular_expression]
    rule: self.matches(regular_expression)
    message: Must match {regular_expression}

  format:
    description: The text is a date (2026-11-24) or a date and time (2026-11-24T19:00:00Z)
    parameters: [date_format]
    rule: >-
      (date_format == 'date' && self.matches(r'^[0-9]{4}-[0-9]{2}-[0-9]{2}$')) ||
      (date_format == 'date-time' && self.matches(r'^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'))
    message: Must be a {date_format}

  minItems:
    description: The list has the count of items or more
    parameters: [count]
    rule: size(self) >= count
    message: Must have at least {count} items

  maxItems:
    description: The list has the count of items or fewer
    parameters: [count]
    rule: size(self) <= count
    message: Must have at most {count} items

  uniqueItems:
    description: No item of the list occurs two times
    rule: self.all(x, self.exists_one(y, y == x))
    message: Must not have an item two times

  required:
    description: The object has each of the properties
    parameters: [property_names]
    rule: property_names.all(p, p in self)
    message: Must have {property_names}
