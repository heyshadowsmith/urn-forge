# The math example: the area of a circle, and a division whose divisor is never zero.
manifest:
  namespace: demo
  domain: math
  version: 0.1.0

definitions:
  radius:
    description: The radius of a circle
    type: number
    rules:
      - minimum: 0

  area:
    description: The area of a circle
    type: number
    rules:
      - minimum: 0

  dividend:
    description: The number that is divided
    type: number

  divisor:
    description: The number that divides, never zero
    type: number
    rules:
      - not_zero

  quotient:
    description: The result of a division
    type: number

  circle:
    description: A circle by its radius
    type: object
    properties: [radius]
    rules:
      - required: [radius]

  circle_area:
    description: The area of a circle
    type: object
    properties: [area]
    rules:
      - required: [area]

  division:
    description: A division to perform
    type: object
    properties: [dividend, divisor]
    rules:
      - required: [dividend, divisor]

  division_result:
    description: The quotient of a division
    type: object
    properties: [quotient]
    rules:
      - required: [quotient]

rules:
  not_zero:
    description: The number is not zero
    rule: self != 0.0
    message: Must not be 0

  area_grows_with_radius:
    description: A circle of radius 1 or more has an area of at least its radius
    rule: input.radius < 1.0 || output.area >= input.radius
    message: The area is less than the radius

  quotient_has_the_sign:
    description: The quotient is negative only when the dividend and the divisor have different signs
    rule: (output.quotient < 0.0) == ((input.dividend < 0.0) != (input.divisor < 0.0) && input.dividend != 0.0)
    message: The quotient has the wrong sign

operations:
  compute_area:
    description: The area of a circle from its radius
    input: circle
    output:
      - circle_area: [area_grows_with_radius]

  safe_divide:
    description: Divide one number by another; the divisor is never zero
    input: division
    output:
      - division_result: [quotient_has_the_sign]
