# urn-forge's own domain: the pure functions of the toolchain, declared with urn-forge.
# Only what urn-forge can express lives here. See self/README.md for what is still blocked.
manifest:
  namespace: urn_forge
  domain: toolchain
  version: 0.1.0
  stability: experimental

naming.field.context:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The context segment of a short key, such as policy
naming.field.identifier:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The identifier segment of a short key, such as deductible_amount
naming.field.brand_identifier:
  primitive: string
  regex: '[A-Z][A-Za-z0-9]*'
  description: The PascalCase name that generated code uses for an atom

naming.entity.segment_pair:
  description: The context and identifier segments of a short key
  fields: [{ ref: naming.field.context }, { ref: naming.field.identifier }]
naming.entity.brand:
  description: The brand identifier derived from a segment pair
  fields: [{ ref: naming.field.brand_identifier }]

naming.operation.to_brand_identifier:
  description: Derive the PascalCase brand identifier of an atom from its context and identifier
  input: naming.entity.segment_pair
  output: naming.entity.brand

naming.field.namespace:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The namespace segment of a URN, such as acme
naming.field.domain:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The domain segment of a URN, such as insurance
naming.field.kind:
  primitive: string
  oneOf: [field, entity, operation]
  description: The kind segment of a URN; the kinds the compiler supports
naming.field.urn:
  primitive: string
  regex: 'urn(:[a-z][a-z0-9_]{0,62}){5}'
  description: A full URN

naming.entity.atom_address:
  description: The five segments that address an atom
  fields:
    - ref: naming.field.namespace
    - ref: naming.field.domain
    - ref: naming.field.context
    - ref: naming.field.kind
    - ref: naming.field.identifier
naming.entity.expanded:
  description: The URN an atom address expands to
  fields: [{ ref: naming.field.urn }]

naming.operation.to_urn:
  description: Expand an atom address to its URN, urn:<namespace>:<domain>:<context>:<kind>:<identifier>
  input: naming.entity.atom_address
  output: naming.entity.expanded
