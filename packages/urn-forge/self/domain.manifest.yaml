# urn-forge's own contract: the decisions of urn-forge that a user sees, and its vocabulary, declared with
# urn-forge. The core calls the functions that urn-forge really uses, so the scenarios test the toolchain,
# not a copy. tests/self.test.ts keeps its vocabulary equal to the package and to the pages that name it.
#
# The definitions come in four sections: 1. the vocabulary; 2. the decisions, each under the name of its
# operation; 3. the language of a manifest; 4. the results of a call, a check and a command. Then the
# rules, and the operations. The meaning of each item of the vocabulary is the argument of a rule of an
# operation, such as the meaning, severity and fix of each code in is_the_code of fix_of.
manifest:
  namespace: urn-forge
  domain: toolchain
  version: 0.2.2

definitions:
  # 1. The vocabulary
  # Each code, standard rule, function of the rule language, step kind and gate. The meaning of each item is
  # the argument of a rule of the operation that names it: fix_of, describe_standard_rule, signatures_of and
  # judge_gate. A test keeps each list equal to its source in the package, and to the pages that name it.

  code:
    description: A code of a problem that urn-forge reports. A tool or an agent acts on the code, not on the message. The meaning, the severity and the fix of each code are the argument of is_the_code, in the operation fix_of; the codes of each gate are the argument of reports_its_codes, in the operation judge_gate
    type: string
    rules:
      - enum: [usage, config-unreadable, config-invalid, manifest-unreadable, yaml-syntax, manifest-shape, unknown-definition, type-cycle, duplicate-property, unknown-property, not-an-object, duplicate-output, invalid-identifier, deprecated-use, standard-name, unknown-rule, rule-argument, rule-syntax, rule-type, rule-guard, rule-scope, invalid-message, tsconfig-unreadable, core-not-found, type-error, core-not-satisfying, direct-call, suppressed-check, feature-syntax, unknown-name, uncovered-operation, uncovered-output, uncovered-variant, uncovered-rule, drift, base-unreadable, removed-rule, wider-rule, removed-output, removed-scenario, internal-contract]

  fix:
    description: What to do about each case of a code, in one sentence
    type: string
    rules:
      - minLength: 1

  code_meaning:
    description: What a code means, the same for each case of the code
    type: string
    rules:
      - pattern: '\S'

  code_severity:
    description: "The severity of each problem of a code: error, warning, or by-version for the codes of gate 5 that a new version can allow, which are a warning when the version allows the change and an error when it does not"
    type: string
    rules:
      - enum: [error, warning, by-version]

  code_entry:
    description: "What a code is: what it means, its severity and its fix"
    type: object
    properties:
      - meaning: code_meaning
      - severity: code_severity
      - fix
    rules:
      - required: [meaning, severity, fix]

  code_entries:
    description: Each code, and what it is
    type: map
    keys: code
    values: code_entry

  standard_rule_name:
    description: The name of a rule of the standard set, which a manifest uses with no declaration. The parameters and texts of each rule are the argument of is_the_standard_rule, in the operation describe_standard_rule
    type: string
    rules:
      - enum: [enum, const, minimum, maximum, exclusiveMinimum, exclusiveMaximum, multipleOf, minLength, maxLength, pattern, format, minItems, maxItems, uniqueItems, required]

  parameter_name:
    description: The name of a parameter of a rule, which is also the name of a definition of its argument
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  parameter_names:
    description: The parameters of a rule, in their order
    type: array
    items: parameter_name

  rule_description:
    description: What a rule checks, and why
    type: string
    rules:
      - minLength: 1

  failure_text:
    description: What a failure of a rule says, with each argument in braces, such as Must be at least {bound}
    type: string
    rules:
      - minLength: 1
      - pattern: '\S'

  standard_rule_meaning:
    description: "What a standard rule is: its parameters, what it checks and what its failure says"
    type: object
    properties: [parameter_names, rule_description, failure_text]
    rules:
      - required: [parameter_names, rule_description, failure_text]

  standard_rule_meanings:
    description: Each standard rule and what it is
    type: map
    keys: standard_rule_name
    values: standard_rule_meaning

  function_name:
    description: The name of a function or a method of the rule language. A name with a dot is a function of a namespace, such as math.greatest. The signatures of each function are the argument of are_the_signatures, in the operation signatures_of
    type: string
    rules:
      - enum: [size, sum, matches, startsWith, endsWith, contains, split, charAt, indexOf, lastIndexOf, substring, join, flatten, math.greatest, math.least, math.ceil, math.floor, math.trunc, math.abs, math.sign, math.isNaN, math.isInf, math.isFinite, lowerAscii, upperAscii, int, double, string, bool, getFullYear, getMonth, getDate, getDayOfMonth, getDayOfWeek, getDayOfYear, getHours, getMinutes, getSeconds, getMilliseconds, timestamp]

  signature_text:
    description: The types that a function takes and gives, such as string.startsWith(string)
    type: string
    rules:
      - minLength: 1

  function_meanings:
    description: The signatures of each function of the rule language
    type: map
    keys: function_name
    values: signature_text

  step_kind:
    description: A step of urn-forge, by its name in the steps of the package
    type: string
    rules:
      - enum: [run, check, output, outputWith, inputRejected, valueRejected, accepted]

  gate_number:
    description: The number of a gate of verify, from 1 to 5
    type: integer
    rules:
      - minimum: 1
      - maximum: 5

  gate_name:
    description: The name of a gate, as verify prints it. What makes each gate fail, and its codes, are the argument of reports_its_codes, in the operation judge_gate
    type: string
    rules:
      - enum: [completeness, boundary, gherkin, drift, contract]

  severity:
    description: Whether a problem fails its gate (error) or only shows it (warning)
    type: string
    rules:
      - enum: [error, warning]

  gate_check:
    description: What makes a gate fail, in one line, as AGENTS.md says it
    type: string
    rules:
      - pattern: '\S'

  gate_codes:
    description: The codes of the problems that a gate reports
    type: array
    items: code
    rules:
      - uniqueItems

  gate_meaning:
    description: "What a gate is: its name, what makes it fail, and the codes of the problems that it reports"
    type: object
    properties: [gate_name, gate_check, gate_codes]
    rules:
      - required: [gate_name, gate_check, gate_codes]

  gate_meanings:
    description: Each gate, by its number from 1 to 5, and what it is
    type: map
    values: gate_meaning

  # 2. The decisions: the input and the outputs of each operation, under the name of the operation

  # 2. Decision: to_type_name

  definition_name:
    description: The name of a definition of a manifest, in lowercase snake_case, such as party_size
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  type_name:
    description: The name of the TypeScript type that the generated file gives a definition, such as PartySize
    type: string
    rules:
      - pattern: '^[A-Z][A-Za-z0-9]*$'

  naming_request:
    description: A definition whose type is named
    type: object
    properties: [definition_name]
    rules:
      - required: [definition_name]

  named_type:
    description: The type name of a definition
    type: object
    properties: [type_name]
    rules:
      - required: [type_name]

  # 2. Decision: judge_version_change and judge_weaker_contract

  version:
    description: A semver version of a manifest, such as 1.4.0 or 2.0.0-alpha.1, with the pattern that the manifest reader checks
    type: string
    rules:
      - pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'

  from_version:
    description: The version of the old manifest
    type: version

  to_version:
    description: The version of the new manifest
    type: version

  reason:
    description: Why the versions allow a breaking change or not
    type: string
    rules:
      - minLength: 1

  version_change:
    description: The versions of two manifests that diff compares
    type: object
    properties: [from_version, to_version]
    rules:
      - required: [from_version, to_version]

  breaking_allowed:
    description: The versions allow a breaking change
    type: object
    properties: [reason]
    rules:
      - required: [reason]

  breaking_refused:
    description: The versions do not allow a breaking change
    type: object
    properties: [reason]
    rules:
      - required: [reason]

  # 2. Decision: name_part

  namespace_name:
    description: The namespace of a manifest, which is also the namespace of its URNs
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9-]{1,31}$'

  domain_name:
    description: The domain of a manifest, such as booking
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  part_kind:
    description: The section of the manifest that a part is in
    type: string
    rules:
      - enum: [definition, rule, operation]

  part_name:
    description: The name of a part; a standard rule has a camelCase name, such as minLength
    type: string
    rules:
      - pattern: '^[a-z][A-Za-z0-9_]{0,62}$'

  urn:
    description: The URN of a part, such as urn:demo:booking:definition:party_size
    type: string

  part:
    description: A part of a manifest, named by its domain, its section and its name
    type: object
    properties: [namespace_name, domain_name, part_kind, part_name]
    rules:
      - required: [namespace_name, domain_name, part_kind, part_name]

  part_urn:
    description: The URN of a part
    type: object
    properties: [urn]
    rules:
      - required: [urn]

  # 2. Decision: check_namespace

  candidate:
    description: A text that can be the namespace of a manifest, or not
    type: string
    rules:
      - minLength: 1

  namespace_candidate:
    description: A text to check as the namespace of a manifest
    type: object
    properties: [candidate]
    rules:
      - required: [candidate]

  namespace_accepted:
    description: The text is a URN namespace
    type: object
    properties: [candidate]
    rules:
      - required: [candidate]

  namespace_refused:
    description: The text is not a URN namespace
    type: object
    properties: [candidate]
    rules:
      - required: [candidate]

  # 2. Decision: judge_bound_change

  bound_rule:
    description: A standard rule with one bound, a number that the value is compared with
    type: string
    rules:
      - enum: [minimum, maximum, exclusiveMinimum, exclusiveMaximum, minLength, maxLength, minItems, maxItems]

  old_bound:
    description: The bound in the old manifest
    type: number

  new_bound:
    description: The bound in the new manifest
    type: number

  bound_change:
    description: A new bound of a standard rule, as diff and gate 5 compare it
    type: object
    properties: [bound_rule, old_bound, new_bound]
    rules:
      - required: [bound_rule, old_bound, new_bound]

  direction:
    description: Whether the rule now accepts fewer values (narrower), more values (wider), or the same values
    type: string
    rules:
      - enum: [narrower, wider, same]

  bound_judged:
    description: The direction of the new bound
    type: object
    properties: [direction]
    rules:
      - required: [direction]

  # 2. Decision: fix_of

  code_request:
    description: A code whose meaning and fix are asked for, with the severity of the problem that has it, when there is one
    type: object
    properties: [code, severity]
    rules:
      - required: [code]

  code_fix:
    description: A code, what it means, its severity and its fix
    type: object
    properties:
      - code
      - meaning: code_meaning
      - severity: code_severity
      - fix
    rules:
      - required: [code, meaning, severity, fix]

  # 2. Decision: describe_standard_rule

  standard_rule_request:
    description: A standard rule that is asked for
    type: object
    properties: [standard_rule_name]
    rules:
      - required: [standard_rule_name]

  standard_rule:
    description: A standard rule, with its parameters, what it checks and what its failure says
    type: object
    properties: [standard_rule_name, parameter_names, rule_description, failure_text]
    rules:
      - required: [standard_rule_name, parameter_names, rule_description, failure_text]

  # 2. Decision: signatures_of

  function_request:
    description: A function of the rule language whose signatures are asked for
    type: object
    properties: [function_name]
    rules:
      - required: [function_name]

  function_signatures:
    description: A function of the rule language and its signatures
    type: object
    properties: [function_name, signature_text]
    rules:
      - required: [function_name, signature_text]

  # 2. Decision: match_step

  step_text:
    description: The text of a step of a scenario, after Given, When, Then, And or But
    type: string
    rules:
      - minLength: 1

  step_request:
    description: A step text to read
    type: object
    properties: [step_text]
    rules:
      - required: [step_text]

  matched_step:
    description: A step text that is a step of urn-forge, and its kind
    type: object
    properties: [step_text, step_kind]
    rules:
      - required: [step_text, step_kind]

  unmatched_step:
    description: A step text that is no step of urn-forge
    type: object
    properties: [step_text]
    rules:
      - required: [step_text]

  # 2. Decision: judge_gate

  gate_problem:
    description: A problem that a gate found, by its code and its severity
    type: object
    properties: [code, severity]
    rules:
      - required: [code, severity]

  gate_problems:
    description: The problems that a gate found
    type: array
    items: gate_problem

  gate_facts:
    description: A gate and the problems that it found in a project
    type: object
    properties: [gate_number, gate_problems]
    rules:
      - required: [gate_number, gate_problems]

  gate_passed:
    description: The gate passes
    type: object
    properties: [gate_number, gate_name]
    rules:
      - required: [gate_number, gate_name]

  gate_failed:
    description: The gate fails
    type: object
    properties: [gate_number, gate_name]
    rules:
      - required: [gate_number, gate_name]

  # 2. Decision: fill_message

  message_text:
    description: The failure message of a rule, with a parameter in braces where its argument goes
    type: string

  argument_name:
    description: The name of the parameter of an argument
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  argument_text:
    description: An argument of a rule use, as its failure message shows it
    type: string

  message_argument:
    description: One argument of a rule use, by the name of its parameter
    type: object
    properties: [argument_name, argument_text]
    rules:
      - required: [argument_name, argument_text]

  message_arguments:
    description: The arguments of a rule use
    type: array
    items: message_argument

  message_request:
    description: A failure message and the arguments of a use of its rule
    type: object
    properties: [message_text, message_arguments]
    rules:
      - required: [message_text, message_arguments]

  filled_text:
    description: The failure message of a rule use, with its arguments in place
    type: string

  filled_message:
    description: The failure message with the arguments in place
    type: object
    properties: [filled_text]
    rules:
      - required: [filled_text]

  # 2. Decision: find_uncovered_rules

  rule_place:
    description: A rule of a definition, as the definition and the rule with a space, such as party_size minimum
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]* [a-z][A-Za-z0-9_]*$'

  rule_places:
    description: Rules of definitions
    type: array
    items: rule_place

  coverage_facts:
    description: The rules that the definitions apply, and the rules that a scenario breaks
    type: object
    properties:
      - applied_rules: rule_places
      - broken_rules: rule_places
    rules:
      - required: [applied_rules, broken_rules]

  uncovered_rules:
    description: The rules that no scenario breaks, each once
    type: array
    items: rule_place
    rules:
      - uniqueItems

  rules_found:
    description: The rules that gate 3 reports as uncovered-rule
    type: object
    properties: [uncovered_rules]
    rules:
      - required: [uncovered_rules]

  # 3. The language of a manifest
  # The shape that the manifest reader accepts, key by key. A manifest that breaks it fails compile with
  # manifest-shape. tests/agents.test.ts checks each manifest of the repository with it, and checks that the
  # reader refuses what it refuses.

  manifest:
    description: "A manifest, the contract of a domain: its header, and its definitions, rules and operations by name"
    type: object
    properties:
      - manifest: manifest_header
      - definitions: definition_declarations
      - rules: rule_declarations
      - operations: operation_declarations
    rules:
      - required: [manifest]

  manifest_header:
    description: The header of a manifest, which names the domain and its version
    type: object
    properties:
      - namespace: namespace_name
      - domain: domain_name
      - version
      - compatibility
    rules:
      - required: [namespace, domain, version]

  compatibility:
    description: What the callers of the domain do with a part that they do not know
    type: object
    properties: [callers]
    rules:
      - required: [callers]

  callers:
    description: "ignore-unknown: the callers ignore a property or an output that they do not know, so a new one is compatible"
    type: string
    rules:
      - enum: [ignore-unknown]

  description:
    description: "What a part is, for a reader of the manifest: text with a character that is not a space"
    type: string
    rules:
      - pattern: '\S'

  deprecated:
    description: "True when the part is deprecated: it still works, and each use of it in a live part gives a warning"
    type: boolean

  definition_declarations:
    description: The definitions of a manifest, by name
    type: map
    keys: definition_name
    values: definition_declaration

  definition_declaration:
    description: "A definition: the structure of a value, and the rules that each value keeps"
    type: object
    properties:
      - description
      - type: type_reference
      - properties: property_entries
      - items: definition_name
      - values: definition_name
      - keys: definition_name
      - tag: property_name
      - variants
      - identifier: property_name
      - rules: rule_uses
      - deprecated
    rules:
      - required: [description, type]
      - structure_of_an_object
      - structure_of_an_array
      - structure_of_a_map
      - structure_of_a_union

  type_reference:
    description: >-
      The type of a definition - string, number, integer, boolean, object, array, map or union, or the name
      of another definition, whose structure it has
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  property_name:
    description: The name of a property of an object
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  property_entries:
    description: The properties of an object, in their order
    type: array
    items: property_entry

  property_entry:
    description: "A property: the name of its definition, or a name with its own definition"
    type: union
    variants: [definition_name, property_with_definition]

  property_with_definition:
    description: "A property with its own definition, such as { address: street_address } in YAML flow form"
    type: map
    keys: property_name
    values: definition_name
    rules:
      - one_entry

  variants:
    description: "The variants of a union: a list of definitions of different JSON types, or, with a tag, each value of the tag to its object variant"
    type: union
    variants: [variant_list, tagged_variants]

  variant_list:
    description: The variants of a union with no tag, at most one of each JSON type
    type: array
    items: definition_name

  tagged_variants:
    description: "The variants of a union with a tag: each value of the tag to its object variant"
    type: map
    values: definition_name

  rule_uses:
    description: The rules that a part applies, by name, in their order
    type: array
    items: rule_use

  rule_use:
    description: "A rule applied by name: the name alone, or the name with its argument"
    type: union
    variants: [rule_use_name, rule_with_argument]

  rule_use_name:
    description: "The name of a rule in a use: a rule of the manifest, or a standard rule, whose names are camelCase"
    type: string
    rules:
      - pattern: '^[a-z][A-Za-z0-9_]{0,62}$'

  rule_with_argument:
    description: "A rule with its argument, such as minimum: 1, or between: { low: 1, high: 9 }"
    type: map
    keys: rule_use_name
    values: json_value
    rules:
      - one_entry

  json_value:
    description: "Any JSON value but null: the argument of a rule use, or the value of an answer"
    type: union
    variants: [json_string, json_number, json_flag, json_list, json_map]

  json_string:
    description: A JSON value that is a string
    type: string

  json_number:
    description: A JSON value that is a number
    type: number

  json_flag:
    description: A JSON value that is true or false
    type: boolean

  json_list:
    description: A JSON value that is a list
    type: array
    items: json_value

  json_map:
    description: A JSON value that is a map, such as the arguments of the parameters of a rule by name
    type: map
    values: json_value

  rule_declarations:
    description: The rules of a manifest, by name
    type: map
    keys: rule_name
    values: rule_declaration

  rule_name:
    description: The name of a rule of a manifest, in lowercase snake_case
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  rule_declaration:
    description: "A rule: an expression of the rule language, its parameters, and what its failure says"
    type: object
    properties:
      - description
      - parameters: parameter_names
      - rule: rule_text
      - failure_message: failure_text
      - deprecated
    rules:
      - required: [description, rule, failure_message]

  rule_text:
    description: An expression of the rule language that gives true when the value keeps the rule
    type: string
    rules:
      - pattern: '\S'

  operation_declarations:
    description: The operations of a manifest, by name
    type: map
    keys: operation_name
    values: operation_declaration

  operation_name:
    description: The name of an operation of a manifest, in lowercase snake_case
    type: string
    rules:
      - pattern: '^[a-z][a-z0-9_]{0,62}$'

  operation_declaration:
    description: "An operation: its input, its outputs, and the rules of each answer"
    type: object
    properties:
      - description
      - input: definition_name
      - output: output_entries
      - rules: rule_uses
      - deprecated
    rules:
      - required: [description, input, output]

  output_entries:
    description: "The outputs of an operation: the core answers exactly one of them"
    type: array
    items: output_entry
    rules:
      - minItems: 1

  output_entry:
    description: "An output: the name of its object, or the name with the rules of the output"
    type: union
    variants: [definition_name, output_with_rules]

  output_with_rules:
    description: "An output with its rules, such as booked: [deposit_paid]"
    type: map
    keys: definition_name
    values: rule_uses
    rules:
      - one_entry

  # 4. The results
  # What check and runOperation of a generated file give, and the report of a command with --format json.
  # The CLI checks each report with these definitions before it writes it.

  failure:
    description: "A rule that a value breaks: the definition or the operation of the rule, the rule, the place of the value, and the failure message"
    type: object
    properties:
      - definition: part_name
      - rule: part_name
      - path: value_path
      - failure_message: failure_text
    rules:
      - required: [definition, rule, path, failure_message]

  value_path:
    description: The place of a value in the value that is checked, such as contact.email or dishes[0].amount, or empty for the whole value
    type: string

  failures:
    description: The rules that a value breaks, one or more
    type: array
    items: failure
    rules:
      - minItems: 1

  accepted:
    description: "True: the value keeps the contract"
    type: boolean
    rules:
      - is_true

  refused:
    description: "False: the value breaks the contract"
    type: boolean
    rules:
      - is_false

  check_accepted:
    description: The result of check for a value that keeps each rule of its definition
    type: object
    properties:
      - ok: accepted
      - domain: urn
      - value: json_value
    rules:
      - required: [ok, domain, value]

  check_refused:
    description: The result of check for a value that breaks a rule of its definition
    type: object
    properties:
      - ok: refused
      - domain: urn
      - failures
    rules:
      - required: [ok, domain, failures]

  call_answered:
    description: "The result of runOperation when the input and the answer keep the contract: the answer of the core, its output and its value"
    type: object
    properties:
      - ok: accepted
      - domain: urn
      - operation: operation_name
      - output: definition_name
      - value: json_value
    rules:
      - required: [ok, domain, operation, output, value]

  call_refused:
    description: The result of runOperation when the input or the answer breaks the contract, by its kind
    type: union
    tag: kind
    variants:
      InputRejected: input_rejected
      ContractViolation: contract_violation

  refusal_kind:
    description: >-
      Why a call is refused - InputRejected, the caller sent an input that breaks the contract, so the core
      did not run; or ContractViolation, the core answered what the contract does not allow, which is a bug
      in the core
    type: string
    rules:
      - enum: [InputRejected, ContractViolation]

  input_rejected:
    description: A call whose input breaks the contract; the core did not run
    type: object
    properties:
      - ok: refused
      - domain: urn
      - operation: operation_name
      - kind: refusal_kind
      - failures
    rules:
      - required: [ok, domain, operation, kind, failures]

  contract_violation:
    description: A call whose answer breaks the contract, which is a bug in the core
    type: object
    properties:
      - ok: refused
      - domain: urn
      - operation: operation_name
      - kind: refusal_kind
      - failures
    rules:
      - required: [ok, domain, operation, kind, failures]

  problem:
    description: "A problem that a command found: its code, its severity, its place, what it says, and its fix"
    type: object
    properties:
      - code
      - severity
      - file: file_path
      - line: line_number
      - path: problem_path
      - domain: urn
      - message: problem_message
      - fix
    rules:
      - required: [code, severity, message, fix]

  problems:
    description: The problems of a command, in the order it found them
    type: array
    items: problem

  file_path:
    description: A file, relative to the folder of the command, with forward slashes
    type: string
    rules:
      - minLength: 1

  line_number:
    description: A line of a file, from 1
    type: integer
    rules:
      - minimum: 1

  problem_path:
    description: The place of a problem in the manifest or the config, as a list of keys, such as definitions, party_size, rules, 0
    type: array
    items: path_key

  path_key:
    description: "A key of a place: the name of a key of a map, or the index of an item of a list"
    type: union
    variants: [key_name, key_index]

  key_name:
    description: The name of a key of a map
    type: string

  key_index:
    description: The index of an item of a list, from 0
    type: integer
    rules:
      - minimum: 0

  problem_message:
    description: What a problem says
    type: string
    rules:
      - pattern: '\S'

  passed:
    description: "True when the command passed: its exit code is 0"
    type: boolean

  compile_report:
    description: "The report of compile --format json: the files that it wrote or removed, and its problems"
    type: object
    properties:
      - ok: passed
      - files: written_files
      - problems
    rules:
      - required: [ok, problems]
      - an_error_fails

  written_files:
    description: The generated files of compile, for each domain
    type: array
    items: written_file

  written_file:
    description: A generated file, and what compile did with it
    type: object
    properties:
      - domain: urn
      - status: write_status
      - path: file_path
    rules:
      - required: [domain, status, path]

  write_status:
    description: "What compile did with a generated file: wrote it, found it unchanged, or removed it because no domain gives it"
    type: string
    rules:
      - enum: [wrote, unchanged, removed]

  verify_report:
    description: "The report of verify --format json: each gate of each domain, the count of warnings, and the problems"
    type: object
    properties:
      - ok: passed
      - gates: gate_reports
      - domains: domain_reports
      - warnings: warning_count
      - problems
    rules:
      - required: [ok, problems]
      - an_error_fails
      - a_failed_gate_fails

  gate_report:
    description: "The outcome of a gate: its number, its name, whether it passed, and its summary"
    type: object
    properties:
      - domain: urn
      - gate: gate_number
      - name: gate_name
      - pass: passed
      - summary: gate_summary
    rules:
      - required: [gate, name, pass, summary]

  gate_reports:
    description: The outcomes of the gates, of each domain in turn
    type: array
    items: gate_report

  gate_summary:
    description: What a gate checked, in one line, such as 1 generated file(s) compared byte for byte
    type: string

  domain_report:
    description: The outcomes of the gates of one domain
    type: object
    properties:
      - urn
      - gates: gate_reports
    rules:
      - required: [urn, gates]

  domain_reports:
    description: The outcomes of the gates, by domain
    type: array
    items: domain_report

  warning_count:
    description: The number of problems that are warnings
    type: integer
    rules:
      - minimum: 0

  diff_report:
    description: "The report of diff --format json: the versions, each change with its class, and whether the versions allow the breaking changes"
    type: object
    properties:
      - ok: passed
      - from: from_version
      - to: to_version
      - breaking: breaking_count
      - changes
      - allowed: breaking_allowed_flag
      - why: reason
      - problems
    rules:
      - required: [ok, problems]
      - an_error_fails

  breaking_count:
    description: The number of changes that are breaking
    type: integer
    rules:
      - minimum: 0

  breaking_allowed_flag:
    description: True when the versions allow the breaking changes, or when no change is breaking
    type: boolean

  changes:
    description: The changes from the old manifest to the new one
    type: array
    items: change

  change:
    description: "A change of a part: its class, the URN of the part, and what changed"
    type: object
    properties:
      - class: change_class
      - place: urn
      - message: problem_message
    rules:
      - required: [class, place, message]

  change_class:
    description: Whether a change can break a caller (breaking) or not (compatible)
    type: string
    rules:
      - enum: [breaking, compatible]

rules:
  # Rules of the decisions, in the order of the operations

  is_the_type_name:
    description: >-
      The type name is the PascalCase of the definition name: each part between underscores, with its first letter
      in upper case, joined; with Value after a name that the generated file declares itself
    rule: >-
      cel.bind(pascal, input.definition_name.split('_').filter(w, w != '').map(w, w.substring(0, 1).upperAscii() + w.substring(1)).join(''),
      output.type_name == (pascal in ['Failure', 'RuleError', 'DomainCore', 'Operations', 'Definitions', 'OperationName', 'DefinitionName', 'OperationResult', 'CheckResult'] ? pascal + 'Value' : pascal))
    failure_message: The type name is not the PascalCase of the definition name, with Value after a reserved name

  at_most_the_name_and_value:
    description: A type name drops the underscores of the definition name, and adds Value at most (for a name that the generated file uses itself)
    rule: size(output.type_name) <= size(input.definition_name) + 5
    failure_message: The type name is longer than the definition name and Value

  stable_and_final:
    description: A breaking change is refused only for a stable version (1.0.0 or later) that is not a pre-release
    rule: "!input.to_version.matches(r'^0\\.') && !input.to_version.matches(r'^[0-9]+\\.[0-9]+\\.[0-9]+-')"
    failure_message: A 0.x version or a pre-release allows a breaking change

  allows_a_breaking_change:
    description: A breaking change is allowed for a 0.x version, a pre-release, or a new major version
    rule: >-
      input.to_version.startsWith('0.') || input.to_version.split('+')[0].contains('-') ||
      int(input.to_version.split('.')[0]) > int(input.from_version.split('.')[0])
    failure_message: A breaking change is allowed within one stable major version

  keeps_the_major:
    description: A breaking change is refused only when the major version does not increase
    rule: int(input.to_version.split('.')[0]) <= int(input.from_version.split('.')[0])
    failure_message: A breaking change is refused, but the major version increased

  keeps_the_version_or_the_major:
    description: Gate 5 refuses a weaker contract that keeps its version, or whose major version does not increase
    rule: input.from_version == input.to_version || int(input.to_version.split('.')[0]) <= int(input.from_version.split('.')[0])
    failure_message: A weaker contract is refused, but its major version increased

  joins_the_parts:
    description: A URN is urn, the namespace, the domain, the section and the name, joined by colons
    rule: "output.urn == 'urn:' + input.namespace_name + ':' + input.domain_name + ':' + input.part_kind + ':' + input.part_name"
    failure_message: The URN is not urn:<namespace>:<domain>:<section>:<name>

  is_a_urn_namespace:
    description: A URN namespace has 2 to 32 lowercase letters, digits and hyphens, and starts with a letter
    rule: "input.candidate.matches(r'^[a-z][a-z0-9-]{1,31}$')"
    failure_message: The text is not a URN namespace

  is_not_a_urn_namespace:
    description: The text breaks the form of a URN namespace
    rule: "!input.candidate.matches(r'^[a-z][a-z0-9-]{1,31}$')"
    failure_message: The text is a URN namespace

  names_the_candidate:
    description: The answer names the text that was checked
    rule: output.candidate == input.candidate
    failure_message: The answer does not name the text that was checked

  the_version_changed:
    description: Gate 5 allows a weaker contract only with a new version, so that a reviewer sees the change
    rule: input.from_version != input.to_version
    failure_message: A weaker contract with the same version is allowed

  keeps_the_version_or_a_stable_major:
    description: "Gate 5 refuses a weaker contract that keeps its version, or whose new version is stable: not 0.x, and not a pre-release"
    rule: "input.from_version == input.to_version || (!input.to_version.matches(r'^0\\.') && !input.to_version.matches(r'^[0-9]+\\.[0-9]+\\.[0-9]+-'))"
    failure_message: A weaker contract is refused, but its version changed to a 0.x version or a pre-release

  direction_by_the_form:
    description: >-
      A larger bound of a lower limit (minimum, exclusiveMinimum, minLength, minItems) accepts fewer values; a larger
      bound of an upper limit accepts more; the same bound accepts the same values
    rule: >-
      (input.old_bound == input.new_bound && output.direction == 'same') ||
      (input.old_bound != input.new_bound &&
      (output.direction == 'narrower') == ((input.bound_rule in ['minimum', 'exclusiveMinimum', 'minLength', 'minItems']) == (input.new_bound > input.old_bound)))
    failure_message: The direction of the new bound is wrong for the form of the rule

  names_the_code:
    description: The answer names the code that was asked for
    rule: output.code == input.code
    failure_message: The answer names another code

  is_the_code:
    description: The meaning, the severity and the fix are those of the code, as the contract states them for each code
    parameters: [code_entries]
    rule: >-
      output.meaning == code_entries[input.code].meaning && output.severity == code_entries[input.code].severity &&
      output.fix == code_entries[input.code].fix
    failure_message: The answer is not what the code is

  has_its_severity:
    description: A problem has the severity of its code; a code of severity by-version can be a warning or an error
    rule: "!has(input.severity) || output.severity == input.severity || output.severity == 'by-version'"
    failure_message: The problem does not have the severity of its code

  fix_is_a_sentence:
    description: A fix is one sentence, which starts with a capital letter and ends with a period
    rule: output.fix.endsWith('.') && !output.fix.matches(r'\. [A-Z]') && output.fix.substring(0, 1) == output.fix.substring(0, 1).upperAscii() && output.fix.substring(0, 1) != output.fix.substring(0, 1).lowerAscii()
    failure_message: The fix is not one sentence that starts with a capital letter and ends with a period

  names_the_standard_rule:
    description: The answer is the standard rule that was asked for
    rule: output.standard_rule_name == input.standard_rule_name
    failure_message: The answer is another standard rule

  is_the_standard_rule:
    description: The parameters, the text and the failure message are those of the rule, as the contract states them for each standard rule
    parameters: [standard_rule_meanings]
    rule: >-
      output.parameter_names == standard_rule_meanings[input.standard_rule_name].parameter_names &&
      output.rule_description == standard_rule_meanings[input.standard_rule_name].rule_description &&
      output.failure_text == standard_rule_meanings[input.standard_rule_name].failure_text
    failure_message: The answer is not what the standard rule is

  names_the_function:
    description: The answer is the function that was asked for, and each of its signatures names it
    rule: output.function_name == input.function_name && output.signature_text.contains(input.function_name + '(')
    failure_message: The answer is another function, or a signature that does not name it

  are_the_signatures:
    description: The signatures are those of the function, as the contract states them for each function
    parameters: [function_meanings]
    rule: output.signature_text == function_meanings[input.function_name]
    failure_message: The signatures are not those of the function

  is_the_step_of_its_text:
    description: A step text is the step of urn-forge whose form it has, and of no other
    rule: >-
      (output.step_kind == 'run') == input.step_text.matches(r'^I run "[^"]+" with:$') &&
      (output.step_kind == 'check') == input.step_text.matches(r'^I check an? "[^"]+" with:$') &&
      (output.step_kind == 'output') == input.step_text.matches(r'^the output is "[^"]+"$') &&
      (output.step_kind == 'outputWith') == input.step_text.matches(r'^the output is "[^"]+":$') &&
      (output.step_kind == 'inputRejected') == input.step_text.matches(r'^the input is rejected by "[^"]+" of "[^"]+"$') &&
      (output.step_kind == 'valueRejected') == input.step_text.matches(r'^the value is rejected by "[^"]+" of "[^"]+"$') &&
      (output.step_kind == 'accepted') == input.step_text.matches(r'^the value is accepted$')
    failure_message: The kind of the step is not the form of its text

  matches_no_step:
    description: A step text that has the form of no step of urn-forge is no step
    rule: >-
      !input.step_text.matches(r'^I run "[^"]+" with:$') &&
      !input.step_text.matches(r'^I check an? "[^"]+" with:$') &&
      !input.step_text.matches(r'^the output is "[^"]+"$') &&
      !input.step_text.matches(r'^the output is "[^"]+":$') &&
      !input.step_text.matches(r'^the input is rejected by "[^"]+" of "[^"]+"$') &&
      !input.step_text.matches(r'^the value is rejected by "[^"]+" of "[^"]+"$') &&
      !input.step_text.matches(r'^the value is accepted$')
    failure_message: The step text has the form of a step of urn-forge

  names_the_gate:
    description: The answer names the gate by its number, in the order of verify
    rule: output.gate_number == input.gate_number && output.gate_name == ['completeness', 'boundary', 'gherkin', 'drift', 'contract'][input.gate_number - 1]
    failure_message: The answer names another gate

  reports_its_codes:
    description: Each problem of a gate has one of the codes of that gate, as the contract states them for each gate
    parameters: [gate_meanings]
    rule: input.gate_problems.all(p, p.code in gate_meanings[string(input.gate_number)].gate_codes)
    failure_message: A problem of the gate has a code that the gate does not report

  passes_with_no_error:
    description: A gate passes when none of its problems is an error; a warning does not fail it
    rule: "!input.gate_problems.exists(p, p.severity == 'error')"
    failure_message: The gate passes with a problem that is an error

  fails_with_an_error:
    description: A gate fails only with a problem that is an error, so a failing gate names its problem
    rule: input.gate_problems.exists(p, p.severity == 'error')
    failure_message: The gate fails with no problem that is an error

  fills_each_argument:
    description: >-
      Each parameter in braces that has an argument becomes the argument; no braces of an argument stay; and a
      message with no argument stays as it is
    rule: >-
      input.message_arguments.all(a, !output.filled_text.contains('{' + a.argument_name + '}') &&
      (!input.message_text.contains('{' + a.argument_name + '}') || output.filled_text.contains(a.argument_text))) &&
      (size(input.message_arguments) > 0 || output.filled_text == input.message_text)
    failure_message: A parameter in braces is not its argument

  each_unbroken_rule_once:
    description: >-
      Gate 3 reports each rule that a definition applies and no scenario breaks, and no other rule. A rule
      that no scenario breaks is a gap, as an output that no scenario answers is
    rule: >-
      input.applied_rules.all(r, r in input.broken_rules || r in output.uncovered_rules) &&
      output.uncovered_rules.all(r, r in input.applied_rules && !(r in input.broken_rules))
    failure_message: Gate 3 must report each rule that no scenario breaks, and only these

  # Rules of the language of a manifest

  one_entry:
    description: A name with its value is a map of exactly one entry
    rule: size(self) == 1
    failure_message: Must be one name with its value

  structure_of_an_object:
    description: An object needs properties; properties and identifier are only for type object
    rule: "self.type == 'object' ? has(self.properties) : !has(self.properties) && !has(self.identifier)"
    failure_message: An object needs properties, and only an object has properties or an identifier

  structure_of_an_array:
    description: An array needs items; items are only for type array
    rule: "self.type == 'array' ? has(self.items) : !has(self.items)"
    failure_message: An array needs items, and only an array has items

  structure_of_a_map:
    description: A map needs values; values and keys are only for type map
    rule: "self.type == 'map' ? has(self.values) : !has(self.values) && !has(self.keys)"
    failure_message: A map needs values, and only a map has values or keys

  structure_of_a_union:
    description: A union needs variants; variants and a tag are only for type union
    rule: "self.type == 'union' ? has(self.variants) : !has(self.variants) && !has(self.tag)"
    failure_message: A union needs variants, and only a union has variants or a tag

  # Rules of the results

  is_true:
    description: The flag is true
    rule: self
    failure_message: Must be true

  is_false:
    description: The flag is false
    rule: "!self"
    failure_message: Must be false

  an_error_fails:
    description: A command with a problem that is an error does not pass
    rule: "!self.problems.exists(p, p.severity == 'error') || !self.ok"
    failure_message: A command with an error must not pass

  a_failed_gate_fails:
    description: verify does not pass when a gate fails
    rule: "!has(self.gates) || self.gates.all(g, g.pass) || !self.ok"
    failure_message: verify must not pass when a gate fails

operations:
  # The operations: each decision of urn-forge, with its input, its outputs and the rules of each answer.

  to_type_name:
    description: Name the TypeScript type of a definition, as the generated file does
    input: naming_request
    output:
      - named_type: [at_most_the_name_and_value, is_the_type_name]

  judge_version_change:
    description: Whether the versions of two manifests allow a breaking change, as diff judges it by semver
    input: version_change
    output:
      - breaking_allowed: [allows_a_breaking_change]
      - breaking_refused: [stable_and_final, keeps_the_major]

  name_part:
    description: The URN of a part, as the generated file, diff and gate 5 give it
    input: part
    output:
      - part_urn: [joins_the_parts]

  check_namespace:
    description: Whether a text is a URN namespace, as the manifest takes it
    input: namespace_candidate
    output:
      - namespace_accepted: [is_a_urn_namespace, names_the_candidate]
      - namespace_refused: [is_not_a_urn_namespace, names_the_candidate]

  judge_weaker_contract:
    description: Whether the versions of two manifests allow a weaker contract, as gate 5 judges it
    input: version_change
    output:
      - breaking_allowed: [the_version_changed, allows_a_breaking_change]
      - breaking_refused: [keeps_the_version_or_a_stable_major, keeps_the_version_or_the_major]

  judge_bound_change:
    description: Whether a new bound of a standard rule accepts fewer values or more, as diff and gate 5 judge it
    input: bound_change
    output:
      - bound_judged: [direction_by_the_form]

  fix_of:
    description: The fix of a code, which each report of the code shows
    input: code_request
    output:
      - code_fix:
          - names_the_code
          - fix_is_a_sentence
          # Each code: what it means, its severity, and its fix, which each report of the code shows.
          - has_its_severity
          - is_the_code:
              usage:
                meaning: The command line is wrong
                severity: error
                fix: Run urn-forge --help, and call the command with the arguments and options that it shows.
              config-unreadable:
                meaning: The manifest file, or the file that `--config` names, does not exist
                severity: error
                fix: Give --config the path of a config file that exists, or remove --config to use urn-forge.config.ts.
              config-invalid:
                meaning: The config does not load, or an option is unknown or of the wrong type
                severity: error
                fix: Change the config to use only the options of defineConfig, with the types that the message names.
              manifest-unreadable:
                meaning: The manifest file, or the file that `--config` names, does not exist
                severity: error
                fix: Give --manifest, or manifest in the config, the path of a manifest that exists.
              yaml-syntax:
                meaning: The file is not valid YAML, or a map has one key two times
                severity: error
                fix: Correct the YAML at the line that the problem gives.
              manifest-shape:
                meaning: A key that is not allowed, a key that is not there, or a value of the wrong shape
                severity: error
                fix: Use only the keys that the message lists, with values of the type that it names; the definition manifest in self/domain.manifest.yaml of the package states each key.
              unknown-definition:
                meaning: A name that the manifest does not have
                severity: error
                fix: Add the definition to definitions:, or correct the name to one that is in definitions:.
              type-cycle:
                meaning: A chain of `type` names goes back to its start
                severity: error
                fix: Give one definition of the cycle a base type (string, number, integer, boolean, object, array, map or union) in place of the name of another definition.
              duplicate-property:
                meaning: A list names a property or an output two times
                severity: error
                fix: Remove the second copy of the name from properties:.
              unknown-property:
                meaning: A name that the manifest does not have
                severity: error
                fix: "Add the name to properties: of the object, or remove it from the rule."
              not-an-object:
                meaning: The input or an output is not an object
                severity: error
                fix: "Make the input or the output of the operation a definition of type: object."
              duplicate-output:
                meaning: A list names a property or an output two times
                severity: error
                fix: Remove the second copy of the object from output:.
              invalid-identifier:
                meaning: The identifier is not a required property with one value
                severity: error
                fix: "Make the identifier a property of the object, list it in the required rule of the object, and give it one value: not an object or a list."
              deprecated-use:
                meaning: A live part uses a deprecated part
                severity: warning
                fix: "Use a definition or a rule that is not deprecated, or remove deprecated: true if it is still the right one."
              standard-name:
                meaning: A rule of the manifest has the name of a standard rule
                severity: error
                fix: Give the rule of the manifest a name that is not the name of a standard rule.
              unknown-rule:
                meaning: A name that the manifest does not have
                severity: error
                fix: Add the rule to rules:, or correct the name to a rule of the manifest or a standard rule.
              rule-argument:
                meaning: An argument does not agree with the parameters of the rule
                severity: error
                fix: Give the rule an argument that its parameters accept, or no argument when the rule has no parameters.
              rule-syntax:
                meaning: The rule does not parse, or uses a form that is not in the rule language
                severity: error
                fix: "Write the rule in the rule language of urn-forge: the names, operators, functions and macros of the reference."
              rule-type:
                meaning: A type in the rule is wrong, the rule does not give a `bool`, or `has()` reads a required property
                severity: error
                fix: Change the rule so that each part has the type that the message names, and the rule gives a bool.
              rule-guard:
                meaning: The rule reads an optional property without `has()`
                severity: error
                fix: "Read an optional property only after has(): has(self.x) && self.x > 0, or !has(self.x) || self.x > 0."
              rule-scope:
                meaning: The rule reads a name that is not available where you apply the rule, such as `output` in a rule of a definition
                severity: error
                fix: "Use only the names that the message lists: self, input, output, the parameters of the rule, and the variable of a macro."
              invalid-message:
                meaning: A message names `{x}`, but `x` is not a parameter
                severity: error
                fix: Use in {braces} only the names of the parameters of the rule.
              tsconfig-unreadable:
                meaning: "Gate 1 or gate 2: the tsconfig does not exist, or does not parse"
                severity: error
                fix: Give --tsconfig, or tsconfig in the config, the path of a tsconfig that TypeScript can read.
              core-not-found:
                meaning: "Gate 1: the file of the core does not exist"
                severity: error
                fix: Create the core file, or give --core, or core in the config, its path.
              type-error:
                meaning: "Gate 1: `tsc` finds a type error in the core, with the tsconfig of the project"
                severity: error
                fix: Correct the type error at the line that the problem gives; do not suppress it.
              core-not-satisfying:
                meaning: "Gate 1: no export of the core `satisfies DomainCore`"
                severity: error
                fix: Export the core as export const core = { … } satisfies DomainCore, with one function for each operation.
              direct-call:
                meaning: "Gate 2: a shell file calls a function of the core directly, without `runOperation`"
                severity: error
                fix: Call the core through runOperation(core, operation, input), which checks the input and the answer.
              suppressed-check:
                meaning: "Gate 2: a core or shell file has `@ts-ignore`, `@ts-expect-error` or `@ts-nocheck`"
                severity: error
                fix: Remove the @ts- comment and correct the type error that it hides.
              feature-syntax:
                meaning: "Gate 3: a `.feature` file does not parse"
                severity: error
                fix: Correct the Gherkin of the feature file at the line that the message gives.
              unknown-name:
                meaning: "Gate 3: a step names a part that the manifest does not have"
                severity: error
                fix: Use in the step the name of an operation, a definition, an output or a rule of the manifest, as the message says.
              uncovered-operation:
                meaning: "Gate 3: no scenario runs an operation"
                severity: error
                fix: Add a scenario with When I run "<operation>" with:.
              uncovered-output:
                meaning: "Gate 3: no scenario of an operation ends with one of its outputs"
                severity: error
                fix: Add a scenario of the operation that ends with Then the output is "<output>".
              uncovered-variant:
                meaning: "Gate 3: no scenario reaches a variant of a union"
                severity: error
                fix: "Add a scenario whose table has a value of the variant: for a union with a tag, a value with that value of the tag."
              uncovered-rule:
                meaning: "Gate 3: no scenario breaks a rule of a definition"
                severity: error
                fix: Add a scenario that breaks the rule and ends with Then the input is rejected by "<rule>" of "<definition>", or Then the value is rejected by "<rule>" of "<definition>".
              drift:
                meaning: "Gate 4: a generated file is not what `compile` writes now, or it is missing, or `compile` no longer writes it"
                severity: error
                fix: Run urn-forge compile, and do not edit a generated file by hand.
              base-unreadable:
                meaning: "Gate 5: the folder is not in a git repository, or the ref is not a commit"
                severity: error
                fix: Fetch the base ref (git fetch origin <branch>, with enough depth), or give --base a ref that exists.
              removed-rule:
                meaning: "Gate 5: the contract is weaker than at the base, and the version does not allow it"
                severity: by-version
                fix: Put the rule back; if the change is on purpose, stop and ask a person, because only a person decides a new manifest.version.
              wider-rule:
                meaning: "Gate 5: the contract is weaker than at the base, and the version does not allow it"
                severity: by-version
                fix: Put the argument or the text of the rule back; if the change is on purpose, stop and ask a person, because only a person decides a new manifest.version.
              removed-output:
                meaning: "Gate 5: the contract is weaker than at the base, and the version does not allow it"
                severity: by-version
                fix: Put the output back; if the change is on purpose, stop and ask a person, because only a person decides a new manifest.version.
              removed-scenario:
                meaning: "Gate 5: the contract is weaker than at the base, and the version does not allow it"
                severity: by-version
                fix: Put the scenario back; if the change is on purpose, stop and ask a person, because only a person decides a new manifest.version.
              internal-contract:
                meaning: "urn-forge broke its own contract: an answer of urn-forge does not keep a rule of `self/domain.manifest.yaml`, which is a bug of urn-forge"
                severity: error
                fix: "Report it in an issue of urn-forge, with the message: urn-forge broke its own contract, and your project did not cause it."

  describe_standard_rule:
    description: A standard rule, with its parameters, what it checks and what its failure says
    input: standard_rule_request
    output:
      - standard_rule:
          - names_the_standard_rule
          # Each standard rule: its parameters, what it checks and what its failure says.
          - is_the_standard_rule:
              enum:
                parameter_names: [choices]
                rule_description: The value is one of the choices
                failure_text: "Must be one of {choices}"
              const:
                parameter_names: [choice]
                rule_description: The value is the choice
                failure_text: "Must be {choice}"
              minimum:
                parameter_names: [bound]
                rule_description: The value is the bound or more
                failure_text: "Must be at least {bound}"
              maximum:
                parameter_names: [bound]
                rule_description: The value is the bound or less
                failure_text: "Must be at most {bound}"
              exclusiveMinimum:
                parameter_names: [bound]
                rule_description: The value is more than the bound
                failure_text: "Must be more than {bound}"
              exclusiveMaximum:
                parameter_names: [bound]
                rule_description: The value is less than the bound
                failure_text: "Must be less than {bound}"
              multipleOf:
                parameter_names: [factor]
                rule_description: The integer is a multiple of the factor
                failure_text: "Must be a multiple of {factor}"
              minLength:
                parameter_names: [count]
                rule_description: The text has the count of characters or more
                failure_text: Must have at least {count} characters
              maxLength:
                parameter_names: [count]
                rule_description: The text has the count of characters or fewer
                failure_text: Must have at most {count} characters
              pattern:
                parameter_names: [regular_expression]
                rule_description: The text matches the regular expression
                failure_text: "Must match {regular_expression}"
              format:
                parameter_names: [date_format]
                rule_description: The text is a date (2026-11-24) or a date and time (2026-11-24T19:00:00Z)
                failure_text: "Must be a {date_format}"
              minItems:
                parameter_names: [count]
                rule_description: The list has the count of items or more
                failure_text: Must have at least {count} items
              maxItems:
                parameter_names: [count]
                rule_description: The list has the count of items or fewer
                failure_text: Must have at most {count} items
              uniqueItems:
                parameter_names: []
                rule_description: No item of the list occurs two times
                failure_text: Must not have an item two times
              required:
                parameter_names: [property_names]
                rule_description: The object has each of the properties
                failure_text: "Must have {property_names}"

  signatures_of:
    description: The types that a function of the rule language takes and gives
    input: function_request
    output:
      - function_signatures:
          - names_the_function
          # The types that each function of the rule language takes and gives.
          - are_the_signatures:
              size: size(string), size(list(T)), size(map(string, T)), string.size(), list(T).size(), map(string, T).size()
              sum: list(int).sum(), list(double).sum()
              matches: string.matches(string), matches(string, string)
              startsWith: string.startsWith(string)
              endsWith: string.endsWith(string)
              contains: string.contains(string)
              split: string.split(string), string.split(string, int)
              charAt: string.charAt(int)
              indexOf: string.indexOf(string), string.indexOf(string, int)
              lastIndexOf: string.lastIndexOf(string), string.lastIndexOf(string, int)
              substring: string.substring(int), string.substring(int, int)
              join: list(string).join(), list(string).join(string)
              flatten: list(list(T)).flatten(), list(T).flatten(int)
              math.greatest: math.greatest(int), math.greatest(double), math.greatest(list(int)), math.greatest(list(double))
              math.least: math.least(int), math.least(double), math.least(list(int)), math.least(list(double))
              math.ceil: math.ceil(double)
              math.floor: math.floor(double)
              math.trunc: math.trunc(double)
              math.abs: math.abs(int), math.abs(double)
              math.sign: math.sign(int), math.sign(double)
              math.isNaN: math.isNaN(double)
              math.isInf: math.isInf(double)
              math.isFinite: math.isFinite(double)
              lowerAscii: string.lowerAscii()
              upperAscii: string.upperAscii()
              int: int(int), int(double), int(string), int(timestamp)
              double: double(double), double(int), double(string)
              string: string(string), string(int), string(double), string(bool), string(timestamp), string(duration)
              bool: bool(bool), bool(string)
              getFullYear: timestamp.getFullYear(), timestamp.getFullYear(string)
              getMonth: timestamp.getMonth(), timestamp.getMonth(string)
              getDate: timestamp.getDate(), timestamp.getDate(string)
              getDayOfMonth: timestamp.getDayOfMonth(), timestamp.getDayOfMonth(string)
              getDayOfWeek: timestamp.getDayOfWeek(), timestamp.getDayOfWeek(string)
              getDayOfYear: timestamp.getDayOfYear(), timestamp.getDayOfYear(string)
              getHours: timestamp.getHours(), timestamp.getHours(string), duration.getHours()
              getMinutes: timestamp.getMinutes(), timestamp.getMinutes(string), duration.getMinutes()
              getSeconds: timestamp.getSeconds(), timestamp.getSeconds(string), duration.getSeconds()
              getMilliseconds: timestamp.getMilliseconds(), timestamp.getMilliseconds(string), duration.getMilliseconds()
              timestamp: timestamp(string), timestamp(timestamp), timestamp(int)

  match_step:
    description: Whether a step text is a step of urn-forge, and which one, as Cucumber reads it
    input: step_request
    output:
      - matched_step: [is_the_step_of_its_text]
      - unmatched_step: [matches_no_step]

  judge_gate:
    description: Whether a gate passes, from the problems that it found
    input: gate_facts
    output:
      - gate_passed: [names_the_gate, passes_with_no_error]
      - gate_failed: [names_the_gate, fails_with_an_error]
    rules:
      # Each gate: what makes it fail, and the codes of the problems that it reports.
      - reports_its_codes:
          "1":
            gate_name: completeness
            gate_check: "`tsc` fails over the core, or no export `satisfies DomainCore`"
            gate_codes: [type-error, core-not-satisfying, core-not-found, tsconfig-unreadable]
          "2":
            gate_name: boundary
            gate_check: "The shell calls the core without `runOperation`, or a file suppresses a type check"
            gate_codes: [direct-call, suppressed-check, tsconfig-unreadable]
          "3":
            gate_name: gherkin
            gate_check: "A step names an unknown part, or an operation, an output or a rule has no scenario"
            gate_codes: [unknown-name, feature-syntax, uncovered-operation, uncovered-output, uncovered-variant, uncovered-rule]
          "4":
            gate_name: drift
            gate_check: "A generated file is not what `compile` writes now"
            gate_codes: [drift]
          "5":
            gate_name: contract
            gate_check: "Only with `--base <ref>`: a rule, an output or a scenario of the ref is gone, or a rule accepts more, and the version does not allow it"
            gate_codes: [removed-rule, wider-rule, removed-output, removed-scenario, base-unreadable]

  fill_message:
    description: The failure message of a use of a rule, with its arguments in place, as a failure gives it
    input: message_request
    output:
      - filled_message: [fills_each_argument]

  find_uncovered_rules:
    description: The rules of the definitions that gate 3 reports, because no scenario breaks them
    input: coverage_facts
    output:
      - rules_found: [each_unbroken_rule_once]
