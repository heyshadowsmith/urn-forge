# urn-forge's own domain: the pure functions of the toolchain, declared with urn-forge.
# Only what urn-forge can express lives here. See self/README.md for what is still blocked.
manifest:
  namespace: urn_forge
  domain: toolchain
  version: 0.1.0
  stability: experimental

naming.field.context:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The context segment of a short key, such as policy
naming.field.identifier:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The identifier segment of a short key, such as deductible_amount
naming.field.brand_identifier:
  primitive: string
  regex: '[A-Z][A-Za-z0-9]*'
  description: The PascalCase name that generated code uses for an atom

naming.entity.segment_pair:
  description: The context and identifier segments of a short key
  fields: [{ ref: naming.field.context }, { ref: naming.field.identifier }]
naming.entity.brand:
  description: The brand identifier derived from a segment pair
  fields: [{ ref: naming.field.brand_identifier }]

naming.operation.to_brand_identifier:
  description: Derive the PascalCase brand identifier of an atom from its context and identifier
  input: naming.entity.segment_pair
  output: naming.entity.brand

naming.field.namespace:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The namespace segment of a URN, such as acme
naming.field.domain:
  primitive: string
  regex: '[a-z][a-z0-9_]{0,62}'
  description: The domain segment of a URN, such as insurance
naming.field.kind:
  primitive: string
  oneOf: [field, entity, operation, error]
  description: The kind segment of a URN; the kinds the compiler supports
naming.field.urn:
  primitive: string
  regex: 'urn(:[a-z][a-z0-9_]{0,62}){5}'
  description: A full URN

naming.entity.atom_address:
  description: The five segments that address an atom
  fields:
    - ref: naming.field.namespace
    - ref: naming.field.domain
    - ref: naming.field.context
    - ref: naming.field.kind
    - ref: naming.field.identifier
naming.entity.expanded:
  description: The URN an atom address expands to
  fields: [{ ref: naming.field.urn }]

naming.operation.to_urn:
  description: Expand an atom address to its URN, urn:<namespace>:<domain>:<context>:<kind>:<identifier>
  input: naming.entity.atom_address
  output: naming.entity.expanded

# Short keys and their errors (the error kind plan's target, written first as tests/fixtures/self-errors).
naming.field.short_key:
  primitive: string
  minLength: 1
  description: A manifest key as written, such as policy.field.deductible_amount
naming.field.kind_segment:
  primitive: string
  regex: '[a-z]+'
  description: The middle segment of a short key, whether or not it is a kind

naming.entity.short_key_request:
  description: A short key to parse
  fields: [{ ref: naming.field.short_key }]
naming.entity.short_key_parts:
  description: The three segments of a valid short key
  fields:
    - ref: naming.field.context
    - ref: naming.field.kind
    - ref: naming.field.identifier

naming.error.invalid_short_key:
  description: The key does not have the form <context>.<kind>.<identifier> in lowercase snake_case
  category: validation
  retryable: false
  message: Short key {short_key} is not <context>.<kind>.<identifier> in lowercase snake_case
  fields: [{ ref: naming.field.short_key }]
naming.error.unsupported_kind:
  description: The kind is in the spec but the compiler does not support it yet
  category: validation
  retryable: false
  message: Kind {kind_segment} in {short_key} is not supported yet
  fields: [{ ref: naming.field.short_key }, { ref: naming.field.kind_segment }]
naming.error.unknown_kind:
  description: The kind is not a kind of the spec
  category: validation
  retryable: false
  message: Kind {kind_segment} in {short_key} is not a kind
  fields: [{ ref: naming.field.short_key }, { ref: naming.field.kind_segment }]

naming.operation.parse_short_key:
  description: Split a short key into its context, kind and identifier
  input: naming.entity.short_key_request
  output: naming.entity.short_key_parts
  errors:
    - naming.error.invalid_short_key
    - naming.error.unsupported_kind
    - naming.error.unknown_kind
