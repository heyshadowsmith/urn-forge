# The shipping quote, with a refusal: an express parcel weighs 5000 grams at most. A refusal is an
# output of the operation, an object like any other, and rules say when each output comes back.
manifest:
  namespace: demo
  domain: shipping
  version: 0.1.0

definitions:
  weight_grams:
    description: The weight of the parcel in grams
    type: integer
    rules:
      - minimum: 1
      - maximum: 30000

  zone:
    description: Where the parcel goes
    type: string
    rules:
      - enum: [domestic, international]

  express:
    description: Whether the parcel goes by express delivery
    type: boolean

  price_cents:
    description: The price of the delivery in cents
    type: integer
    rules:
      - minimum: 0

  parcel:
    description: A parcel to send
    type: object
    properties: [weight_grams, zone, express]
    rules:
      - required: [weight_grams, zone]

  quote:
    description: The price to send a parcel
    type: object
    properties: [price_cents]
    rules:
      - required: [price_cents]

  too_heavy_for_express:
    description: The parcel is too heavy for express delivery
    type: object
    properties: [weight_grams]
    rules:
      - required: [weight_grams]

rules:
  fits_express:
    description: A parcel that goes by express weighs 5000 grams at most
    rule: '!has(input.express) || !input.express || input.weight_grams <= 5000'
    failure_message: An express parcel can weigh 5000 grams at most

  over_express_limit:
    description: The parcel goes by express and weighs more than 5000 grams
    rule: has(input.express) && input.express && input.weight_grams > 5000
    failure_message: The parcel fits express delivery

  names_the_weight:
    description: The refusal names the weight of the parcel
    rule: output.weight_grams == input.weight_grams
    failure_message: The refusal names another weight

operations:
  quote_shipping:
    description: Calculate the price to send a parcel
    input: parcel
    output:
      - quote: [fits_express]
      - too_heavy_for_express: [over_express_limit, names_the_weight]
