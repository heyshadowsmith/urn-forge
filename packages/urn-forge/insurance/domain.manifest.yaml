# The insurance domain (MVP plan, Milestone 3; invariants plan, step 0). It uses dates, exact
# decimals, an optional field and invariants, so each part of the rule language has a real use.
manifest:
  namespace: acme
  domain: insurance
  version: 0.1.0

customer.field.customer_id:
  primitive: string
  format: uuid
  description: The identifier of a customer
customer.field.name:
  primitive: string
  minLength: 1
  description: The full name of a customer

customer.entity.customer:
  description: A person who holds policies
  key: customer.field.customer_id
  fields:
    - ref: customer.field.customer_id
    - ref: customer.field.name

policy.field.peril:
  primitive: enum
  values: [fire, flood, theft]
  description: A kind of damage that a policy covers
policy.field.limit:
  primitive: decimal
  scale: 2
  description: The most that a policy pays for one peril
policy.field.note:
  primitive: string
  description: Free text about a coverage
  # Retired for remark, which is limited in length (lifecycle plan). Callers receive both until the sunset.
  status: deprecated
  supersededBy: policy.field.remark
  sunsetDate: 2027-06-30
policy.field.remark:
  primitive: string
  maxLength: 40
  description: Free text about a coverage, at most 40 characters

policy.field.policy_id:
  primitive: string
  format: uuid
  description: The identifier of a policy
policy.field.effective_date:
  primitive: date
  description: The first day that the policy covers
policy.field.expiry_date:
  primitive: date
  description: The last day that the policy covers
policy.field.premium:
  primitive: decimal
  exclusiveMin: "0"
  scale: 2
  description: The price of the policy for its whole term
policy.field.deductible:
  primitive: decimal
  min: "0"
  scale: 2
  description: The amount of a claim that the holder pays first
policy.field.cancellation_date:
  primitive: date
  description: The day from which the policy stops
policy.field.refund:
  primitive: decimal
  min: "0"
  scale: 2
  description: The part of the premium that goes back to the holder

policy.entity.coverage:
  description: One peril that a policy covers, up to a limit
  key: policy.field.peril
  fields:
    - ref: policy.field.peril
    - ref: policy.field.limit
    - ref: policy.field.note
      required: false
    - ref: policy.field.remark
      required: false

policy.entity.policy:
  description: An issued insurance policy
  # What a link to a policy holds, and the primary key of its table (Postgres plan).
  key: policy.field.policy_id
  fields:
    - ref: policy.field.policy_id
    # The customer who holds the policy: the policy holds the customer's key.
    - link: customer.entity.customer
      as: holder
    # Each peril at most once: a list of coverage objects, unique by their key.
    - ref: policy.entity.coverage
      as: coverages
      many: { minItems: 1, maxItems: 3, unique: true }
    - ref: policy.field.effective_date
    - ref: policy.field.expiry_date
    - ref: policy.field.premium
    - ref: policy.field.deductible
      required: false
policy.entity.cancellation:
  description: A request to stop a policy, with the terms it needs
  fields:
    - ref: policy.field.effective_date
    - ref: policy.field.expiry_date
    - ref: policy.field.premium
    - ref: policy.field.cancellation_date
policy.entity.refund_quote:
  description: The refund for a cancellation
  fields:
    - ref: policy.field.refund

policy.invariant.limit_is_positive:
  description: A coverage pays something
  on: policy.entity.coverage
  rule: limit > 0
  message: The limit of a coverage must be more than 0
policy.invariant.term_is_positive:
  description: A policy ends after it starts
  on: policy.entity.policy
  rule: expiry_date > effective_date
  message: The expiry date must be after the effective date
policy.invariant.deductible_below_premium:
  description: A deductible, when there is one, is less than the premium
  on: policy.entity.policy
  rule: deductible is absent or deductible < premium
  message: The deductible must be less than the premium
policy.invariant.cancellation_within_term:
  description: A policy can stop only on a day that it covers
  on: policy.entity.cancellation
  rule: cancellation_date >= effective_date and cancellation_date <= expiry_date
  message: The cancellation date must be inside the term of the policy

# Events (events plan): the facts that the operations return on success, and the audit record of a refusal.
policy.event.policy_issued:
  description: A policy was issued
  fields:
    - ref: policy.field.policy_id
    - link: customer.entity.customer
      as: holder
    - ref: policy.field.premium
policy.event.policy_cancelled:
  description: A policy stopped, with the refund for the days it does not cover
  fields:
    - ref: policy.field.cancellation_date
    - ref: policy.field.refund
policy.event.refund_refused:
  description: A cancellation was refused because its refund was below the minimum, for an audit trail
  fields:
    - ref: policy.field.refund
    # Optional, so the error's fields can build the event (events plan, decision 6).
    - ref: policy.field.cancellation_date
      required: false

policy.error.refund_below_minimum:
  description: The refund is too small to pay out
  category: precondition
  retryable: false
  message: A refund of {refund} is below the minimum of 1.00
  fields:
    - ref: policy.field.refund
  recordAs: policy.event.refund_refused

policy.operation.issue_policy:
  description: Issue a policy as requested
  input: policy.entity.policy
  output: policy.entity.policy
  emits: [policy.event.policy_issued]
policy.operation.cancel_policy:
  description: Stop a policy and calculate the refund for the days it does not cover
  input: policy.entity.cancellation
  output: policy.entity.refund_quote
  errors:
    - policy.error.refund_below_minimum
  emits: [policy.event.policy_cancelled]

# Days (date arithmetic plan): at the end, so the line numbers that the docs quote do not move.
policy.invariant.term_at_most_a_year:
  description: A policy lasts one year at most, also in a leap year
  on: policy.entity.policy
  rule: expiry_date - effective_date <= 366
  message: A policy can last 366 days at most
