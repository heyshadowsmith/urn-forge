# A first domain: the price to send a parcel. One operation, its input and its output.
manifest:
  namespace: demo
  domain: shipping
  version: 0.1.0

definitions:
  weight_grams:
    description: The weight of the parcel in grams
    type: integer
    rules:
      - minimum: 1
      - maximum: 30000

  zone:
    description: Where the parcel goes
    type: string
    rules:
      - enum: [domestic, international]

  express:
    description: Whether the parcel goes by express delivery
    type: boolean

  price_cents:
    description: The price of the delivery in cents
    type: integer
    rules:
      - minimum: 0

  parcel:
    description: A parcel to send
    type: object
    properties: [weight_grams, zone, express]
    rules:
      - required: [weight_grams, zone]

  quote:
    description: The price to send a parcel
    type: object
    properties: [price_cents]
    rules:
      - required: [price_cents]

operations:
  quote_shipping:
    description: Calculate the price to send a parcel
    input: parcel
    output:
      - quote: []
